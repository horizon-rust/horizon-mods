# Non-executing package validation, review and candidate index generation.
# Native Rust is never compiled here; wasm remains kind `mod`.
# Only the trusted base's scripts and exact reviewed engine checker run.
# No job restores a cache: third-party build jobs must not influence reviewers.
name: check
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HORIZON_REV: ${{ vars.HORIZON_REV }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: head
          persist-credentials: false
      # main's scripts, not the pull request's.
      - run: base/scripts/install-tool.sh
      - name: Who submitted it
        id: author
        env:
          LOGIN: ${{ github.event.pull_request.user.login }}
          BODY: ${{ github.event.pull_request.body }}
          BOT: ${{ vars.REGISTRY_BOT || 'horizon-mods-bot' }}
        run: |
          # The submission form opens pull requests as the bot and names the
          # GitHub account that signed in to it.
          author="$LOGIN"
          if [ "$LOGIN" = "$BOT" ] || [ "$LOGIN" = "${BOT}[bot]" ]; then
            author="$(printf '%s' "$BODY" | sed -n 's/.*<!-- submitted-by: \([A-Za-z0-9-]*\) -->.*/\1/p' | head -1)"
          fi
          echo "login=${author:-$LOGIN}" >> "$GITHUB_OUTPUT"
      - name: What it changes
        run: |
          set -o pipefail
          { echo "## Changes"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          status=0
          python3 base/scripts/catalogue.py review-base base head review-base
          cargo horizon-mod registry review review-base head --author "${{ steps.author.outputs.login }}" 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY" || status=1
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Download its files
        run: base/scripts/fetch.sh head
      - name: Check each new file
        run: |
          set -o pipefail
          { echo "## New files"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          status=0
          cargo horizon-mod registry check base head --files files 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || status=1
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: The index it would publish
        run: |
          cargo horizon-mod registry build head --files files --out index.json --generated "$(date -u +%FT%TZ)"
          python3 base/scripts/catalogue.py history head history
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          index = json.load(open("index.json"))
          print("## index.json")
          for p in index["projects"]:
              print(f"- {p['kind']} `{p['id']}` {p['versions'][0]['version']}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: registry-candidate
          path: |
            index.json
            history/
          if-no-files-found: error
