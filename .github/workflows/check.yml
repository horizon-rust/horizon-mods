# Non-executing package validation, review and candidate index generation.
# Native Rust is never compiled here; wasm remains kind `mod`.
# Only the trusted base's scripts and exact reviewed engine checker run.
# No job restores a cache: third-party build jobs must not influence reviewers.
name: check
on:
  pull_request:
    branches: [main]
    # ready_for_review too: owner-update.yml passes over a draft, and marking it ready pushes no commit.
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  # The last successful publish run and its verified-files artifact.
  actions: read
concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # The main the pull request is merged into, not the event's base.sha: a re-run (or a run that waited in the
      # queue) keeps the old base.sha while GitHub rebuilds the merge commit on today's main, so everything main
      # gained in between would count as the pull request's own (the same as native-compat.yml's #425).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: head
          persist-credentials: false
          fetch-depth: 2
      - name: The main commit it is merged into
        id: merged
        run: echo "base=$(git -C head rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"
      # Every published input (entries, icons, screenshots) is read from disk later, and Pages follows links:
      # a link or submodule anywhere in the tree could expose the runner's files.
      - name: Only regular files
        run: |
          bad=$(git -C head ls-tree -r HEAD | awk '$1 != "100644" && $1 != "100755"')
          if [ -n "$bad" ]; then
            echo "::error::only regular files can be submitted, not links or submodules:"
            echo "$bad"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.merged.outputs.base }}
          path: base
          persist-credentials: false
      # main's scripts and tool pin (base/.github/horizon-rev), not the pull request's.
      - run: base/scripts/install-tool.sh
      - name: Who submitted it
        id: author
        env:
          LOGIN: ${{ github.event.pull_request.user.login }}
          BODY: ${{ github.event.pull_request.body }}
          BOT: ${{ vars.REGISTRY_BOT || 'horizon-mods-bot' }}
        run: |
          # The submission form opens pull requests as the bot and names the
          # GitHub account that signed in to it.
          author="$LOGIN"
          if [ "$LOGIN" = "$BOT" ] || [ "$LOGIN" = "${BOT}[bot]" ]; then
            author="$(printf '%s' "$BODY" | sed -n 's/.*<!-- submitted-by: \([A-Za-z0-9-]*\) -->.*/\1/p' | head -1)"
          fi
          echo "login=${author:-$LOGIN}" >> "$GITHUB_OUTPUT"
      - name: What it changes
        env:
          # GitHub's own numeric id of who opened the pull request, never a login or a claim in its body:
          # archived ids reactivate only for an account in their owner_ids.
          PR_AUTHOR_ID: ${{ github.event.pull_request.user.id }}
        run: |
          set -o pipefail
          { echo "## Changes"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          status=0
          # An unconfirmed owner of a reactivated archived id is only recorded here; the last step fails on it,
          # after every other check has run on this head.
          python3 base/scripts/catalogue.py review-base base "${{ steps.merged.outputs.base }}" \
            head "$(git -C head rev-parse HEAD)" review-base --author-id "$PR_AUTHOR_ID" \
            --unconfirmed-owners "$RUNNER_TEMP/unconfirmed-owners.txt"
          cargo horizon-mod registry review review-base head --author "${{ steps.author.outputs.login }}" 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY" || status=1
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $status
      # Every live file, not only the new ones, goes into the candidate index. The files the last successful
      # publish verified (publish.yml's artifact, unpacked outside the checkouts; fetch.sh rehashes each against
      # the entry) are reused when they match, and only the rest is downloaded: one download per live file on every
      # check doesn't hold up when many pull requests come at once.
      - name: The last successful publish
        id: last
        run: |
          run=$(base/scripts/last-publish.sh 2>/dev/null) || run=
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - if: steps.last.outputs.run != ''
        id: kept
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-files
          path: ${{ runner.temp }}/kept-files
          run-id: ${{ steps.last.outputs.run }}
          github-token: ${{ github.token }}
      - name: Download its files
        env:
          FILES_KEPT: ${{ runner.temp }}/kept-files
        run: base/scripts/fetch.sh head
      - name: Check each new file
        run: |
          set -o pipefail
          { echo "## New files"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          status=0
          cargo horizon-mod registry check base head --files files 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || status=1
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: The index it would publish
        run: |
          cargo horizon-mod registry build head --files files --out index.json --generated "$(date -u +%FT%TZ)"
          python3 base/scripts/catalogue.py history head "$(git -C head rev-parse HEAD)" history
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          index = json.load(open("index.json"))
          print("## index.json")
          for p in index["projects"]:
              print(f"- {p['kind']} `{p['id']}` {p['versions'][0]['version']}")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: registry-candidate
          path: |
            index.json
            history/
          if-no-files-found: error
      - name: Owner of a reactivated archived id (last, after every other check)
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          file="$RUNNER_TEMP/unconfirmed-owners.txt"
          [ -s "$file" ] || exit 0
          cat "$file"
          if [ "$JOB_STATUS" = success ]; then
            msg="owner not confirmed; every other check passed on this head. A maintainer may admin-merge only after confirming the owner by hand."
          else
            msg="owner not confirmed, and other checks failed too: fix those first."
          fi
          { echo "## Owner"; echo "$msg"; echo '```'; cat "$file"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::$msg"
          exit 1
