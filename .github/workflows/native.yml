# Horizon's own native mods (native/<name>/): each changed folder's tests and .hnmod, and the game with it applied
# on the Horizon it was tested on; every mod together, as a player's set. Every Monday, all of them on the newest
# Nightly, to catch a change of the hook points early.
name: native
on:
  pull_request:
    branches: [main]
    paths: ["native/**", ".github/workflows/native.yml"]
  push:
    branches: [main]
    paths: ["native/**", ".github/workflows/native.yml"]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      horizon:
        description: "Horizon commit, tag, or `latest` (the newest Nightly); empty: the mods' tested commit"
        default: latest
permissions:
  contents: read
concurrency:
  group: native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  # The Rust the launcher builds native mods with (launcher/src/rust_toolchain.rs).
  RUST: "1.99.1"
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      mods: ${{ steps.mods.outputs.mods }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: mods
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          all=$(ls -d native/*/compatibility.json | cut -d/ -f2 | jq -R . | jq -sc .)
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ] || [ -z "$BASE" ] \
             || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "mods=$all" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$BASE" HEAD)
          # The shared tools or this workflow: every mod.
          if grep -qE '^(native/tools/|\.github/workflows/native\.yml)' <<< "$changed"; then
            echo "mods=$all" >> "$GITHUB_OUTPUT"; exit 0
          fi
          mods=$(grep -oE '^native/[^/]+/' <<< "$changed" | cut -d/ -f2 | sort -u \
            | while read -r m; do [ -f "native/$m/compatibility.json" ] && echo "$m"; done | jq -R . | jq -sc .)
          echo "mods=$mods" >> "$GITHUB_OUTPUT"
  mod:
    needs: changes
    if: needs.changes.outputs.mods != '[]'
    strategy:
      fail-fast: false
      matrix:
        mod: ${{ fromJson(needs.changes.outputs.mods) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/${{ matrix.mod }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install $RUST --profile minimal --component rustfmt --component clippy && rustup default $RUST
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Package the .hnmod and check what it holds
        working-directory: .
        run: |
          python3 native/tools/native.py package ${{ matrix.mod }}
          python3 - <<'PY'
          import json, zipfile, glob
          path, = glob.glob("native/target/*.hnmod")
          names = zipfile.ZipFile(path).namelist()
          manifest = json.loads(zipfile.ZipFile(path).read("horizon-native.json"))
          assert manifest["hooks"] >= 1, manifest
          bundle = f"mixins/{manifest['id']}/"
          # `native.py package` also adds the data folders: the bundle's `data/` and each crate's `data/`.
          assert all(n == "horizon-native.json" or n == bundle + "LICENSE" or (n.startswith(bundle) and (n.endswith((".rs", ".toml")) or "data" in n[len(bundle):].split("/")[:-1])) for n in names), names
          assert bundle + "LICENSE" in names, "the mod's LICENSE travels in its package"
          print(path, manifest)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hnmod-${{ matrix.mod }}
          path: native/target/*.hnmod
  horizon:
    needs: changes
    if: needs.changes.outputs.mods != '[]'
    strategy:
      fail-fast: false
      matrix:
        mod: ${{ fromJson(needs.changes.outputs.mods) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install $RUST --profile minimal && rustup default $RUST
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config
      - name: Apply on Horizon and check the game
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HORIZON: ${{ github.event_name == 'schedule' && 'latest' || inputs.horizon || '' }}
        run: python3 native/tools/native.py check ${{ matrix.mod }} ${HORIZON:+--horizon "$HORIZON"}
  together:
    needs: changes
    if: needs.changes.outputs.mods != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install $RUST --profile minimal && rustup default $RUST
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config
      - name: Every native mod applied together, on Horizon
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HORIZON: ${{ github.event_name == 'schedule' && 'latest' || inputs.horizon || '' }}
        run: python3 native/tools/native.py check all ${HORIZON:+--horizon "$HORIZON"}
