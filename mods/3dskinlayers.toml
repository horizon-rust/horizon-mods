## Horizon registry entry for 3D Skin Layers (behavioral clean-room port of tr7zw's protective-licensed mod).
id = "3dskinlayers"
kind = "native-mod"
name = "3D Skin Layers"
summary = "Renders the skin's second layer as an extruded 3D shell: pixel volume model, greedy quad merging, per-part toggles."
description = """
**A native Horizon mod**: the launcher builds it into the game (install it on the launchers Mods page, then press Build there). Native mods are not sandboxed and run with your accounts rights, so read the source before you build it. Pinned to the Horizon tree this was built against.

- **Pixel volume model**: the standard 64x64 skin overlay is parsed into per-part extruded shells (head 8x8x8, body 8x12x4, arms and legs 4x12x4), each face sampling its own atlas region.
- **Greedy quad merging**: adjacent opaque overlay pixels merge into the fewest quads, so a fully drawn face is a single quad and the vertex count stays low.
- **Per-part toggles**: head, body, arms and legs gate independently, plus a master switch.
- **First-person policy**: the shell on your own head is hidden in first person by default, opt-in to show.
- **Shell animation**: a breathing/wobble phase advances per tick when animations are on.

Behavioral clean-room port of [3D Skin Layers](https://modrinth.com/mod/3dskinlayers) by tr7zw (LicenseRef-tr7zw-Protective-License): no upstream code or assets are included, ported under CC0-1.0. Degradation: Horizon has no client seam to swap a body part's mesh with extruded geometry at draw time, so the port ships the full geometry and policy logic (16 tests) while the draw call stays stock; the seam request is tracked on the Horizon tracker and the port upgrades to full 1:1 when it lands. Ported to Rust by sparticle.
"""
