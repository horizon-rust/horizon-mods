id = "accessories"
kind = "mod"
name = "Accessories"
summary = "Accessory slots like hat, back, rings and belt, with a screen to manage them. Requires the native mod Accessories (native)."
description = """
An independent port of [Accessories](https://github.com/wisp-forest/accessories) by Wisp Forest (blodhgarm, chyzman, Dr.Zeal).

**Both projects are required:** install this one (`accessories`) and **Accessories (native)** (`accessories_native`)

- Accessory slots: hat, face, necklace, cape, back, hands, rings, wrist, belt, anklet, shoes and charm, defined by data packs in the original's format.
- The accessories screen (H or the inventory button) with cosmetic slots, show/hide toggles, a crafting grid and a settings panel.
- Equipping by dragging, shift-click, right-click or a dispenser; curses of binding and vanishing; drops on death by each slot's rule.
- Items can give attributes, effects and extra slots while worn; totems, elytras and protective gear work from the slots, and so do their enchantments.
- Advancement triggers `accessories:equip_accessory` and `accessories:unequip_accessory`, and data-driven renderers.
- A library for other mods: few vanilla items are accessories on their own. Works with Traveler's Backpack (its Back slot).

Source, changelog and details: https://github.com/DeportedToHell/MCRE-Mods/tree/main/accessories

MIT, same as the original. Not affiliated with or endorsed by Wisp Forest."""
