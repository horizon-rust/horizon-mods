description = """
The native code of an independent port of [Accessories](https://github.com/wisp-forest/accessories) by Wisp Forest (blodhgarm, chyzman, Dr.Zeal).

**Both projects are required:** install this one (`accessories_native`) and **Accessories** (`accessories`)

Native source mod: the launcher builds it into a separate game with Horizon Mixins. It is not sandboxed and runs with your account's permissions.

Built for Horizon Nightly `9f42064` and Horizon Mixins `5a64af9`; other revisions are not tested.

Keybinds: **H** opens the accessories screen. Commands: `/accessories`. The config file is the original's, `config/accessories.json5`, with its config screen in Mod Menu and Options > Mods.

Source, changelog and details: https://github.com/DeportedToHell/MCRE-Mods/tree/main/accessories

MIT, same as the original. Not affiliated with or endorsed by Wisp Forest."""
