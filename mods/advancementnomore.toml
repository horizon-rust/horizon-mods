name = "AdvancementNoMore"
summary = "Disables advancement loading and progression while preserving existing progress files."
description = """
Disables the advancement subsystem: tree loading, player advancement progression, grant/revoke, synchronization and advancement saves. Existing advancement progress JSON files are preserved. Advancement-driven rewards and recipe unlocks have no advancement tree to execute. The installed mod is always active and has no configuration file.

Port of [AdvancementNoMore by 狂想ThePotato / MCTeamPotato](https://github.com/MCTeamPotato/AdvancementNoMore), under MIT. Original copyright and license notices are retained.

Native source mod for Horizon 26.3. The launcher compiles it into the game, with the game's account permissions. The published build targets Horizon `1453e0e614af4b2d04dd0d228a94162b5d459910` (API 415) and horizon-mixins `5a64af938ec86b00d53d16a408aabc0038fb3e57`; latest Nightly compatibility is pending registry CI.
"""
