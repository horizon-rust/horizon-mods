id = "amidrunk"
kind = "shader"
name = "Am I Drunk?"
summary = "xsoras's Am I Drunk! ported to Horizon: a cursed drunk-like screen with sway, fisheye, double vision and blur."
description = """
An unofficial port of [Am I Drunk!](https://modrinth.com/shader/amidrunk) 1.1 by **xsoras** to Horizon's own shader format. All credit for the effect goes to xsoras; this port is not affiliated with or endorsed by them. Licensed Apache-2.0, like the original.

The original's effect, translated line for line: a drunken sway and drifting view, a breathing zoom, fisheye distortion, a chromatic split with double vision, ghost trails, a pulsing blur towards the edges, a warm colour tint, grain and a vignette. The world itself looks like vanilla, as in the original.

No settings: pick it and it runs.

Source: https://github.com/fbikat/amidrunk-horizon"""
