id = "apotheosis"
kind = "mod"
name = "Apotheosis (content)"
summary = "The items, names and world generation of the Apotheosis port: gems, materials, sigils, rogue spawners and boss dungeons. Needs the native mod."
description = """
The content half of the Apotheosis port; **the native mod `apotheosis_native` does the rest**, and both are needed.

- **21 gems** (each with a sprite drawn for this port) and Gem Dust.
- **Materials** for salvaging and reforging: Mysterious Scrap Metal, Timeworn Fabric, Luminous Crystal Shard, Arcane Sands, Godforged Pearl.
- **Gem-Fused Slate** and the **Sigils of Socketing, Withdrawal and Unnaming**, with their recipes.
- **Rogue spawners** on cave floors (Apotheosis' nine, with their chests) and **boss dungeons** (two kinds of room with a boss spawner and dungeon chests), in new overworld chunks, as structure templates and world generation data.
- Names in **English and Brazilian Portuguese**.

Apotheosis (by Shadows_of_Fire) is MIT for its code and data, which this port carries (rogue spawners, loot tables and its second boss room); its textures and lang are all rights reserved and none are used: the art and words here are this port's own. Not affiliated with or endorsed by Apotheosis' authors."""
