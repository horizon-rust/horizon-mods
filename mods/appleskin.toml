id = "appleskin"
kind = "native-mod"
name = "AppleSkin"
summary = "Saturation and what the food in your hand restores."
description = """
A gold bar above the hunger row shows saturation out of 20, the stat vanilla hides and the one that decides whether you heal or starve.

While a food is in your hand, a line shows what eating it gives: nutrition and saturation, red and `(wasted)` when the bar cannot take it.

Settings: Options > Mods > AppleSkin > Settings (the bar, the food line)."""
authors = ["Domanffe"]
owners = ["Domanffe"]
license = "MIT"
source = "https://github.com/Domanffe/appleskin"
icon = "https://horizon-rust.github.io/horizon-mods/icons/appleskin.png"

