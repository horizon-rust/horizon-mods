id = "armor_status"
kind = "native-mod"
name = "Armor Status"
summary = "Displays equipped armor & held items with authentic Java durability colors."
description = """
A native ArmorStatusHUD mod for the Horizon Rust client.

Features
Displays all 4 armor slots plus main and off-hand items on the HUD.
Authentic Java durability color coding (Green > Yellow > Orange > Red).
Item count display for non-damageable held items (torches, food, blocks).
Default position: Bottom Right (freely customizable in Options > Mods)."""
