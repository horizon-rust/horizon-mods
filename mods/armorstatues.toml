name = "Armor Statues"
summary = "Sneak and use an armor stand with an empty hand to pose, style and move it."
description = """
Sneak and use an armor stand with an empty hand to pose, style and move it.

**Differences from the original:** There is no equipment tab, so armour and held items are put on the stand by hand as in vanilla. Positions and angles change with buttons in fixed steps, with no sliders or typed values. The stand's name can't be edited in the menu, but a name tag still works.

A port of [Armor Statues](https://github.com/Fuzss/armorstatues) 8.0.6 by Fuzs, published under its licence, MPL-2.0. Original copyright and licence notices are kept in the file.

Native source mod: install it on the launcher's Mods page, press Build there, and confirm the native-code warning. It runs with your account's permissions. It is pinned to Horizon Nightly fdc87ae and Horizon Mixins e8cd0aa.

No Minecraft code is included."""
authors = ["lavoide", "Fuzs"]
