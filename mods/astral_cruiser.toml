changelog = """
A big overhaul of the ship, its weapons and its effects.

- **Military cruiser hull:** armour belts, stepped superstructure, light stripes, red, green and white beacons, engine nacelles with glowing thrust.
- **Second deck:** captain's cabin, arsenal, gym and a gallery over the reactor hall, an observation dome on top, and stairs between the decks. Every room is newly furnished.
- **New effects for every weapon:** fire, smoke, sparks, shockwaves and light on the hull, on a budget that drops small particles far away.
- **Strike weapons on the wheel,** Erasure and Supernova among them; strikes reach at most 384 blocks from the ship.
- **Faster block breaking:** strikes clear their craters in batches instead of one block at a time."""

