changelog = """
For Horizon Nightly 2026-11-13 (`9f42064`).

- **Map sharing**: a Horizon server running Atlas shares every chunk its players have loaded. When you join one, your world map asks first: Download, Not now or Never (`/atlas download` changes it later). Only what changed since your last visit is sent, nearest first, capped per player.
- **Draw on the world map** (D): lines in eight colours, right-drag to erase, Z to undo. Kept per world and dimension.
- **Zoom**: the world map zooms out to 1/64x, and stays sharp at every zoom, big screens included.
- **Mob faces** (Tab) for 64 kinds, cats and fish included, a little smaller.
- **`/atlas`**: Tab completes every setting and value; `/atlas help` explains the commands and `/atlas help <page>` lists a page's settings.
- **From XaeroPlus**: waypoint beacons, a minimap FPS limiter, the minimap following the world map's dimension, a see-through obsidian roof, and server map folders by address, server list name or base domain.
- **Report an Issue** in Options > Mods > Atlas.

Fixed: single player worlds with the same name (New World) no longer share maps and waypoints; waypoint and seed files are written whole."""

