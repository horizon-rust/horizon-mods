id = "auto_fishing"
kind = "native-mod"
name = "Auto Fishing"
summary = "Client-side auto fishing from the vanilla bobber splash sound."
description = """
Auto Fishing detects the fishing bobber splash sound and automatically reels in, then recasts after a 5-tick delay (about 250 ms).
Press F8 to toggle automation; the enabled state appears in local chat. Cast once with a fishing rod to start. Install this mod only on the client.
Another player's bobber within 32 blocks can also trigger a reel while Auto Fishing is armed.
"""
authors = ["Schonggg"]
owners = ["Schonggg"]
owner_ids = [112318347]
license = "MIT"
source = "https://github.com/Schonggg/Horizon_Mod/tree/main/auto-fishing"
icon = "icons/auto_fishing.png"
categories = ["utility"]
tags = ["fishing", "auto-fishing", "automation"]

