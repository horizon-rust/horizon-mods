sha256 = "412b3508f4badd17d22fe7ff28979f83d8d8bb7d3f4b12f9ca9064969133a7e1"
changelog = """
Fix: waypoints are now saved for good, per world and server, until the player removes them. Before, they were never written to disk: their folder, waypoints/, had the name of the setting file waypoints in the same folder, so it could not be made and the write failed silently. They disappeared when changing dimension, leaving a world or restarting.
Now they go to waypoint_lists/<world>.txt, written to a temporary file and moved into place, with a warning in the log if saving fails.
Built for Horizon nightly 6475f62 (2026-11-04)."""

