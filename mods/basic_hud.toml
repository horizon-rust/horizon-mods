- 13 widgets, including FPS, coordinates, available player health and actual item cooldowns.
- Icons + values: ×16, 1:45 and durability without long labels.
- Mini armour beside the hotbar, including elytra.
- Custom Tab list: numeric ping, bars, player counts, sorting and scale.
- Smoothed optional speed; single-player ping labelled Local.
- Ten UI languages plus Auto; first-visit tutorial, replay through ?.
- Reset confirmation; Save / Discard changes / Stay on leaving with edits; failed-save recovery.

Pinned to Minecraft 26.3 / Horizon 68ac6f6. Use the Performance build profile on Windows; Dev can overflow the startup stack on this baseline. No compatibility with other Nightlies or FPS gain is claimed.

Validated: 67 Rust test executions, native build, isolated gameplay/editor tests, restart persistence and ordinary asynchronous startup.

