changelog = """
## 0.5.0 — Recent pickups
- New movable widget for recently collected items: pick up 4 torches, then 2 more before expiry, and it shows x6. Each repeat pickup refreshes that item's timer.
- Default display time: 5 seconds; adjustable from 1 to 60 seconds.
- Supports icon + count mode, dragging, scale, colours and opacity.
- Partial pickups count only the amount that fits. Giving, crafting and inventory rearrangement do not by themselves create entries.
- New pixel-art totem icon; new labels translated into all ten interface languages. Existing layouts and settings are preserved.

Verified: 75 strict Rust test executions, warning-free pinned native build, real in-game aggregation/expiry/partial-pickup checks, editor persistence and ordinary startup without a controller.

Русский: добавлен блок недавнего подбора с суммированием количества, обновлением таймера и настройкой 1–60 секунд (по умолчанию 5). Новая иконка — тотем.
Deutsch: Neues Widget für aufgehobene Gegenstände mit addierten Mengen und einstellbarer Dauer von 1–60 Sekunden.
Français : nouveau widget des objets ramassés, quantités cumulées et durée réglable de 1 à 60 secondes.
Español: nuevo widget de objetos recogidos, cantidades acumuladas y duración ajustable de 1 a 60 segundos."""

