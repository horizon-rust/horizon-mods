id = "betterhurtcam"
kind = "native-mod"
name = "betterhurtcam"
summary = "A Horizon port of BetterHurtCam."
description = """Horizon port of uku3lig/betterhurtcam (commit d0bf3d0, MIT, (c) 2022 uku): the full
hurt cam experience as a native Rust mod. 1:1 logic core: the three bobHurt handler
bodies (the intensity multiplier, the cancel when the mod is disabled, the hurt-cam
type switch between old and yaw-based), the hearts-blink gate, the BHCConfig model
and the HurtCamType enum, and the F6/F7/F8 keybind actions with the multiplier
overlay text.

Port by sparticle. Upstream: https://github.com/uku3lig/betterhurtcam

Source-only .hmod built on the current SDK (Horizon f00125f). The config is wired
as mod settings on Horizon's Options > Mods page (enabled, heartBlink, type, with
the upstream lang keys; the multiplier stays in the config file, the way upstream
ships it) and the three keys register on Options > Controls, read per client tick.
The vanilla hurt cam, the hearts' blink argument and the action-bar overlay wait
on horizon#19406, the hurt-cam surface.

Licence: MIT. Source: https://github.com/Sparticle62ops/horizon-betterhurtcam
"""
authors = ["uku3lig", "sparticle"]
