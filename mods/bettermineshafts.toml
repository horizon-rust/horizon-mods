changelog = "Slice 2: the stair piece family (SmallTunnelStairs) — its 5x9x5 box, the branch chain's per-segment kind roll, the stair rail shape on all four facings, and the vines/ore randomization. Two defects fixed on the way: the port's LCG used a signed shift (so nextInt went negative and the corridor chain stopped at two segments), and upstream's stairs always set an ascending-north rail whatever the piece's direction. The structure is now entered in game and the stair's rail read back at its own coordinate."
