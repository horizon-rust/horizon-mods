description = """
A Horizon port of [YUNG's Better Ocean Monuments 4.1.2](https://github.com/YUNG-GANG/YUNGs-Better-Ocean-Monuments) by YUNG GANG (**LGPL-3.0-only**), carried as worldgen data.

This is a **content-only** package: `kind = "mod"`, `api = "0.2"`, no Rust source and no `[native]` block. It carries the mod's own worldgen — one deep-ocean jigsaw structure, 13 template pools, 59 structure templates and one loot table — unchanged.

**What the port does.** Upstream's ten Java structure processors flood the monument's interior with water, waterlog its slabs and stairs, and decorate it with prismarine slabs, oxidised copper, seagrass and sponges. This port expresses them as the game's own processor types (`horizon:flood_air`, `horizon:waterlog`, `horizon:keep_world_block`, `horizon:pick`, `horizon:yung_pillar`, `minecraft:rule`) instead of shipping Java, so the monument builds from the carried data with no code of its own.

**Not yet ported.** There is no code to port — the mod is data plus ten processors. The one place this port could differ from upstream is a processor whose behaviour the engine does not offer exactly, and each mapping is recorded in the port's `notes.md`.

Upstream's licence and notice travel inside the package. Pinned to Horizon `0b14f8a` and horizon-mixins `e59da90`.
"""
