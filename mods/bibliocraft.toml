summary = """A port of Bibliocraft Legacy for Horizon: plain decorative furniture. Slice 1 carries the oak bookcase, the oak shelf, the black oak seat and the desk…"""
description = """A port of Bibliocraft Legacy for Horizon: plain decorative furniture. Slice 1 carries the
oak bookcase, the oak shelf, the black oak seat and the desk bell with their block states (facing and
waterlogged, the seat's occupied), their shapes transcribed from upstream, their items, self-drop
loot, the upstream shaped recipes, the block and item tags and one Bibliocraft creative tab. The
bookcase and shelf inventories, the seat entity, the desk bell's ring and redstone answers, the other
11 wood types and 15 seat colours, and the table are not ported yet.

**Implemented so far:** the slice in the package, as described above.

**Not yet ported**

- **Decorative, not functional.** The bookcase and shelf have no inventory,
- **Table deferred.** Its collision depends on type *and* facing
- **Waterlogged is a declared state, not fluid logic.** The state binds and
- **Occlusion is the template's.** Upstream marks the bookcase, shelf, seat
- **One wood type and one seat colour.** Slice 1 carries only oak and
- **The seat carries an extra axis state.** The seat uses the oak_log

Ported to Horizon 0.2 from the upstream mod; pinned to game 26.3, Horizon SDK `0b14f8a` and horizon-mixins `e59da90`. The full corresponding source ships in this repository beside the artifact."""
