id = "big_nukes_native"
kind = "native-mod"
name = "Big Nukes"
summary = "Nuclear bombs whose shockwave digs real craters and leaves fallout. Launch missiles, build a superbomb, survive in a bunker."
description = """
**One file, no separate content mod.** Install it and press Build: its textures, models, sounds, text and recipes come inside it.

- **Make** the bombs: mine uranium below y=16, enrich it in a centrifuge, and put the parts together on the assembly table.
- **Blast** with a demolition charge (radius 16), a tactical warhead (50) or an atomic bomb (250). The flash, the mushroom cloud and the ring of the shockwave are seen from far beyond your render distance, and the wave leaves a crater, ash and fires behind it.
- **Set them off** by fuse, by a keypad's code, or by a remote from any distance. Fire a missile from a silo at coordinates up to 4096 blocks away, or call a bomber onto a strike beacon.
- **Build** the Sunbreaker round its core: 26 implosion shells and 98 neutron reflectors, radius 600 to 1000. At 1000 it breaks through the bedrock.
- **Survive** the radiation: a Geiger counter, a hazmat suit, anti-rad, iodine tablets, and a decontaminator that turns the ash back to grass.
- **Hide** in a bunker: reinforced and armored concrete, a multilayer wall that holds even the Sunbreaker away from its center, a hermetic door, and an air filter powered by a fuel generator that keeps 95% of the radiation out of a sealed room.

The Big Nukes Guide tells it all in the game. English and Russian.

**Commands:** `/bignukes guide` gives the guide. Operators have `/bignukes blast <radius> [x y z]`, and `/bignukes maxpower [16|50|250|1000|1024]`, the largest blast a world allows.

Native source mod: install it on the launcher's Mods page, press Build there, and confirm the native-code warning. It runs with your account's permissions. It is pinned to one Horizon Nightly and Horizon Mixins revision, named in each version's changelog.

All the art and sounds are original. No Minecraft code or assets are included. MIT licensed."""
