id = "big_skies"
kind = "native-mod"
name = "Big Skies"
summary = "Adds atmospheric dynamic weather based on climate across all biomes."
description = """
Description: Weather is a real place on the map rather than a switch for the whole world. Storms, showers, fronts and overcast decks are born, grow, drift with the wind and die, so you can stand in sunshine and watch a thunderstorm on the horizon, see its rain shaft and lightning, and hear it rumble long before it arrives.

A physical sky (Rayleigh, Mie and ozone scattering) with golden sunsets, violet twilight and haze over Horizon's distant terrain.
Soft volumetric clouds at real scale, from fair-weather cumulus to 12 km thunderstorms with anvils.

Clouds that suit the biomes under them; snow on the peaks and rain in the valleys.
Thunder that depends on distance, morning valley fog, northern lights, shooting stars, rainbows after rain, and mist with spray rainbows at waterfalls.
/skies for the forecast and controls (bring a storm, hold a kind of day, set the wind, timelapse).

For the best experience I highly recommended that you turn the game's Clouds, Fog and Weather off and set your LOD Distance up to 128 or more. 

Pairs with the Natural Lighting shader pack: passing clouds dim its light and fade its shadows."""
