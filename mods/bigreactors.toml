changelog = """The four findings of the review on this pull request, each reproduced against the delivered 0.2.4 before it was fixed. One formation record per machine: the shape is built once and shared through an Arc behind every block that answers for the machine, controllers and ports alike, so four controllers no longer hold four copies of a five-thousand-block shell, which was three hundred and eighty-one mebibytes of duplicated coordinates. Ports are visited once per machine per tick, claimed by a single master controller, and a switched-off machine visits none at all — asserted as a count of visits, not a wall time, so it cannot be satisfied by a faster machine. A port's capability access now re-derives its membership from the world instead of trusting a saved coordinate and a formed bit, so a port left outside after a machine is rebuilt smaller answers nothing; the in-game run shows the detached old port reading not formed while the new one works. And the reactor takes only the fuel its tank has room for, writing the remainder back into the slot, which the access port now shows as three ingots where the old package left it empty."""
