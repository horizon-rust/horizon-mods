changelog = """Slice 2 (the energizer), the bounded-tick-cost repair, and the budget fix. Adds the energizer, the fourth multiblock — its 3x3x3 to 32-cubed forms, the cell count and capacity, the controller and the four blocks, on/off with FE in and out — with four defects fixed (carried recipes named c: common tags Horizon never resolves; the blocks were missing from minecraft:mineable/pickaxe; the power tap pushed its buffer back into the reactor; two graphite_from_coalblock recipes were dead data). Structure work is bounded: scans are shared per component, invalidation is limited to the affected topology (inside the box always, the one-block ring only when a machine part sits there, another level never), and SCANS_PER_TICK = 4 is paid from a budget refilled at level_tick_post. This version closes the remaining bypass: a capability scan — an energizer tick asking an adjacent machine's capacity — was charged Budget::Once, so every such tick did an unbudgeted scan. The budget now opens at level_tick_pre and closes at level_tick_post, so in-tick capability scans come out of the same share, while clicks, commands and one-off capability calls still cost one scan and a cache hit is free in both. Proven in game: an energizer fills two adjacent reactors (9,253 -> 216,000 FE); one tick that invalidates five machines runs 4 fresh scans and the rest report not-formed; with the old policy the same scenario runs 7 (counterfactual EXIT:1); all five recover once the casings are replaced."""
