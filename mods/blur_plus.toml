## Horizon registry entry for Blur+ (port of Motschen/Blur).
id = "blur_plus"
kind = "native-mod"
name = "Blur+"
summary = "Spices up the vanilla blur effect: animations, colors, gradients and lots of customizability."
description = """
**A native Horizon mod**: the launcher builds it into the game (install it on the launchers Mods page, then press Build there). Native mods are not sandboxed and run with your accounts rights, so read the source before you build it. Pinned to the Horizon tree this was built against.

- Blur with the ten upstream easing curves and the animation state machine (blur radius, background alpha, gradient).
- HSB and hex colors, packed gradient model, per-screen gates (title, container, sign, book, death, command block, options), options coefficient, debug HUD.

Port of [Blur+](https://github.com/Motschen/Blur) by Motschen (MIT); credited upstream, original MIT license carried verbatim. The drawing itself (strata, gradients, text) is a seam returning draw specs for the client; gaps are documented in the port README and tracked on horizon-rust/horizon.
"""
