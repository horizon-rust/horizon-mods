id = "blur_plus"
kind = "native-mod"
name = "Blur+"
summary = "Port of Motschen's Blur: the screens blur behind a gradient background with the fade and easing the original config has."
description = """Horizon port of Motschen/Blur (commit 7f57397, MIT, (c) 2017 tterrag): the full
blur menu experience as a native Rust mod. 1:1 logic core: config + v3
migration, the ten easing curves, the animation state machine (blur radius,
background alpha, gradient), the HSB/hex color math, the render-pass flow
(onRender / renderBackground / onRenderEnd), the screen gates from every
upstream mixin, the options coefficient, and the debug HUD renderer.

Port by sparticle. Upstream: https://github.com/Motschen/Blur

Source-only .hmod built on the current SDK (Horizon f00125f). The config is wired as mod settings on Horizon's Options > Mods page (which screens blur, the gradient colors and alphas, the fade times, the ten animation curves). The blurred draw itself waits on horizon#19349, the screen-render hook.

Licence: MIT. Source: https://github.com/Sparticle62ops/horizon-blur-plus
"""
authors = ["Motschen", "sparticle"]
owners = ["Sparticle62ops"]
owner_ids = [209812745]
license = "MIT"
source = "https://github.com/Sparticle62ops/horizon-blur-plus"
icon = "icons/blur_plus.png"
categories = ["utility"]
tags = ["port", "horizon"]

