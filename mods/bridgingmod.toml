id = "bridgingmod"
kind = "native-mod"
name = "Bridging Mod"
summary = "Right-click past an edge to bridge blocks out, Bedrock style."
description = """
Right-click past an edge to bridge blocks out, Bedrock style.

**Differences from the original:** There is no bridging crosshair, toggle key or config screen. Building up or down off the top or bottom of a slab uses vanilla slab placement instead of the mod's assist.

A port of [Bridging Mod](https://github.com/CloudG360/BridgingMod) 2.5.1+1.20.1 by CG360, published under its licence, MIT. Original copyright and licence notices are kept in the file.

Native source mod: install it on the launcher's Mods page, press Build there, and confirm the native-code warning. It runs with your account's permissions. It is pinned to Horizon Nightly fdc87ae and Horizon Mixins e8cd0aa.

No Minecraft code is included."""
