name = "Bundles Beyond"
summary = "Bundle tooltips as a grid you can walk with the arrow keys and scroll wheel, a port of Bundles Beyond's navigation."
description = """
A port of O7410's [Bundles Beyond](https://github.com/O7410/Bundles-Beyond) to Horizon: the bundle tooltip becomes a grid at least as wide as its items, and the mouse wheel selects any item in it, and over a bundle the arrow keys and movement keys walk the grid (Bundles Beyond's `offsetVertical/offsetHorizontal`). Not ported yet: the Space click, slot size +/-, scroll-axis modes, reverse view, container-style slots and the on/off key.

**Licence.** A port of Bundles Beyond's behaviour, so it keeps that mod's licence, [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/); credit to the Bundles Beyond authors. The two drawing helpers copy Horizon's own code (MIT, Horizon contributors). The repository's LICENSE.md also has a review grant that lets the Horizon reviewers read and list it.

Pinned to Horizon `9f42064`: two hooks stand in for whole function bodies (`draw_stack_tooltip_with`, `draw_bundle_tooltip`)."""
