summary = "Capipimon and Capipimon Content in one install. Become a Pokémon and fight other players on a Capipimon server."
description = """
**The easy way to install Capipimon:** this pack installs both Capipimon listings together, Capipimon (the game code) and Capipimon Content (textures and creature data), at matching versions.

Capipimon is a free, fan-made PvP mod. You play as a Capipimon and fight other players with move kits, guarding and dodging.

### How to play
1. Install this pack. It becomes its own instance, named "Capipimon Pack".
2. Select the "Capipimon Pack" instance and press Build. Capipimon is a native mod, so it compiles on your PC; the first build usually takes 10 to 30 minutes.
3. Press Play and join a Capipimon server. Get the address from whoever runs one.

Native mods run with the same access to your computer as the game. It needs Minecraft 26.3. Single player and LAN worlds stay vanilla, and the server itself isn't public. Install, playing and server notes are on the Capipimon listing.

### Credits and licences
Capipimon's client code is GPL-3.0-only. The models, animations and textures come from Cobblemon and many community add-on packs, and each keeps its own licence. See CREDITS.md in the source for every author, licence and link. The icon shows Cobblemon's Buneary model and shiny texture (CC BY-NC 3.0) wearing Capipimon's original Bow hat.

Talent NPCs on Capipimon servers wear skins of Minecraft accounts chosen by the server, loaded from Mojang's skin servers.

### Disclaimer
Unofficial fan project, not affiliated with or endorsed by Nintendo, The Pokémon Company, Game Freak or Phase Connect. Pokémon and all related names are trademarks of their respective owners."""
