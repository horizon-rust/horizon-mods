id = "chat_animation"
kind = "native-mod"
name = "ChatAnimationHorizon"
summary = "ChatAnimation for Horizon"
description = """
By tariksabanuz

ChatAnimationHorizon brings smooth chat animations to Horizon, recreating Ezzenix's Chat Animation mod. New chat messages slide and fade in instead of popping onto the screen.

Features
- Messages animate in smoothly when they arrive
- Works with the game's normal chat, no setup needed

Notes
- Native Horizon mod, built from source by the launcher.
- Based on Ezzenix's Chat Animation (MIT licensed), recreated for Horizon.

Source code: https://github.com/tariksabanuz/ChatAnimationHorizon"""
