changelog = """
Fixed chunk selection, world shutdown ticket cleanup, and licensing parity from PR #557 review:

- **Strip Traversal Fix**: Corrected the strip X-offset calculation in `pattern.rs` (`strip_x = current / (WIDTH * size_z) * WIDTH`). Resolves overlapping 64-chunk bands and ensures complete, 100% unique chunk coverage without gaps or duplicates on selections wider than 64 chunks, including 141×141 selections, non-square rectangles, and ellipses.

- **World Shutdown Force-Load Cleanup**: Fixed ticket release in `glue.rs` by capturing held chunks before calling `task.stop(false)`, ensuring all in-flight force-load tickets are cleanly released to the game engine when a world closes.

- **Licensing & Attribution**: Reconciled `core/Cargo.toml` and `NOTICE` to GPL-3.0-or-later, attributing original Chunky by pop4959 and contributors (commit `c4274bd539d1d79a15fe1e73afb2eface64d625f`). Packaged `NOTICE` into the `.hnmod` bundle (`mixins/chunky/data/NOTICE`) and added an Attribution & License section to `README.md`.

- **Test Coverage**: Added regression tests in `pattern.rs` verifying exact, unique coverage for 141×141 selections, rectangle and ellipse auto-selection, and strip resumption parity across bands. Also added `daily_use.rs` integration tests verifying in-flight ticket release during world shutdown."""
