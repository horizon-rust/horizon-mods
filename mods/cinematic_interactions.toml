id = "cinematic_interactions"
kind = "native-mod"
name = "Cinematic Interactions"
summary = "Using a crafting table, furnace, anvil, enchanting table and more moves the camera in close for a cinematic, hands-on scene."
description = """
By tariksabanuz. Cinematic Interactions for Horizon, a port of Southware's Cinematic Interactions for Fabric: when you use a station,
the camera glides in and your hands work it in a close-up scene instead of opening a plain menu.

- Crafting table, crafter, stonecutter, loom and cartography table, furnace, smoker, blast furnace and campfire.
- Anvil with the hammer swing, grindstone, smithing table, enchanting table with its rune circles, brewing stand, beacon, lectern, jukebox and chiseled bookshelf.
- Right-click the next station beside you to move straight over to it.
- Cinematic Interaction Settings... in Options: turn stations off, tune the camera speed, lean, zoom, black bars and screen flashes.

Needs the Performance build in the launcher. This is a Rust port of the original mod (Southware, MIT), made from its published source;
it is released under the same MIT licence."""
authors = ["tariksabanuz"]
owners = ["tariksabanuz"]
license = "MIT"
source = "https://github.com/tariksabanuz/CinematicInteractionsHorizon"
icon = "icons/cinematic_interactions.png"

