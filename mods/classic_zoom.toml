id = "classic_zoom"
kind = "native-mod"
name = "Classic Zoom"
summary = "Hold V to zoom 3x, scroll for more, release to snap back. Instant, no settings, inspired by WI Zoom."
description = """
## Controls

| Action | Result |
|---|---|
| Hold **V** | Zoom in 3x |
| Scroll while holding V | Zoom from 1x to 10x, x1.1 per wheel step |
| Release V | Back to normal view at once |

While V is held, the mouse wheel zooms instead of switching hotbar slots, and turning slows down in step with the zoom so aiming stays steady. Rebind the key on the mod's page in Options > Mods.

## How it differs from Horizon's own Zoom

| | Horizon Zoom | Classic Zoom |
|---|---|---|
| Default key | Z | V |
| Starting zoom | 4x (configurable) | 3x |
| Range | 1.25x to 10x | 1x to 10x |
| Wheel step | x1.25 | x1.1, finer |
| Transition | Smooth by default | Instant |
| Settings page | Yes | None |

Both can be installed at once: they use different keys.

## Notes

- Horizon caps zoom at 10x, so there is no 50x as in WI Zoom.
- Written from scratch for Horizon's mod API. Not affiliated with Wurst-Imperium.
- Some servers forbid zoom mods: check the rules before you join.

**Now a native mod (2.0.0)**: the launcher builds it into the game (install it on the launcher's Mods page, then press Build there). Native mods are not sandboxed and run with your account's permissions, so read the source before you build it: it is one small bundle on Horizon's native hook points (key, wheel, zoom, mods list). Tested against Horizon `6f8c7a0e5d531d3834c4d0be4659a1db8e7e5c2a` with Horizon Mixins `0d6b103c70633d8fd9443d8d0acd3aadaacedb06`. A key set in 1.0.0 carries over.

Source and issues: [github.com/SU4G3/classic-zoom](https://github.com/SU4G3/classic-zoom)"""
