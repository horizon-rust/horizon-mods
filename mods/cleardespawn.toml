changelog = "Rebuilt as the exact 1:1 port on the current SDK: full module tree (constants, config, config_helper, services, render_item_entity_extended, clear_despawn, mod_menu, seams), the original's three config entries as settings with upstream's lang keys, the despawn-flash renderer entry wired on client setup, MIT notices carried in the repo and package."
