id = "cleardespawn"
kind = "native-mod"
name = "cleardespawn"
summary = "A Horizon port of ClearDespawn."
description = """cleardespawn (Horizon Rust port): item entities blink out as they near their despawn time.

Exact 1:1 Rust translation of ClearDespawn (upstream Java, MIT) by StrikerRockers-Mods,
carrying the upstream license and credit. Inside the last flashStartTime seconds of an
item entity's lifetime the extended item entity renderer drops the item's draw on the
flash schedule, and when urgentFlash is on the blink period shrinks with the remaining
time so the flashing accelerates toward despawn. Port by sparticle.
Upstream: https://github.com/StrikerRockers-Mods/ClearDespawn (MIT).

Source-only .hmod built on the current SDK (Horizon f00125f, mixins e59da909, mod api 0.2).

Licence: MIT. Source: https://github.com/Sparticle62ops/horizon-cleardespawn
"""
authors = ["StrikerRocker", "Guntram Blohm", "sparticle"]
owners = ["Sparticle62ops"]
owner_ids = [209812745]
license = "MIT"
source = "https://github.com/Sparticle62ops/horizon-cleardespawn"
icon = "icons/cleardespawn.png"
categories = ["utility"]
tags = ["port", "horizon"]

