id = "clickthrough"
kind = "native-mod"
name = "ClickThrough"
summary = "Open containers through attached item frames, wall signs, and banners."
description = """
I made this Horizon port with Codex. The [original ClickThrough](https://github.com/gbl/ClickThrough) is by Giselbaer and is MIT-licensed.

Right-click an item frame, glow item frame, wall sign, wall hanging sign, or wall banner attached to a supported container to use that container. Hold Sneak to use the marker itself.

This native mod targets Horizon 26.3 Nightly 2026-11-13 (`9f42064`). Build the instance’s native mods after installing it. The patched client passed `cargo check`. Gameplay testing is pending."""
