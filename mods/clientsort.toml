id = "clientsort"
kind = "native-mod"
name = "ClientSort"
summary = "Inventory sorting from ClientSort: Sort, Restock and Transfer buttons, middle-click sort, Shift/Ctrl/Alt for other orders."
description = """
A port of [ClientSort](https://github.com/TerminalMC/ClientSort) by TerminalMC to Horizon, as a native mod.

- **Trigger buttons** beside each inventory, as in the original: **Sort**, **Restock** (moves the items the other inventory already holds) and **Transfer** (moves as much as fits).
- **Middle click** over an inventory sorts it.
- Sort order: the creative inventory's order by default; hold **Shift** for quantity, **Ctrl** for name (A-Z), **Alt** for item ID.
- The container, the main inventory and the hotbar are sorted on their own.
- Keys for every operation, including **Fill Stacks**, in Options > Mods > ClientSort.
- Settings: buttons on/off, default order, click speed, hotbar as its own group, restock by item type, button tooltips.
- Horizon's own "≡" sort buttons are hidden while ClientSort's are shown.

Every action is an ordinary container click, so it works on servers too.

Built for Horizon Nightly 2026-11-13 (`9f42064`). Native mods are compiled into the game and are not sandboxed: build only code you trust.

**Credits.** ClientSort is Copyright 2024-2026 TerminalMC, Apache License 2.0; it uses code from Mouse Wheelie by Siphalor (Apache-2.0) and Inventory Management by Roundaround (MIT). The button sprites are ClientSort's own. Since 1.2.0 the config screen follows [Cloth Config](https://github.com/shedaniel/cloth-config) by shedaniel and uses its texture. This port rewrites ClientSort's logic in Rust under ClientSort's licence and is not affiliated with TerminalMC, Mojang or Microsoft. The Cloth Config parts (cloth.rs, cloth_sprites.rs) are under the GNU LGPL-3.0; the rest of the port is Apache-2.0."""
authors = ["DeportedToHell"]
owners = ["DeportedToHell"]
owner_ids = [344119465]
license = "Apache-2.0 AND LGPL-3.0-only"
source = "https://github.com/DeportedToHell/MCRE-Mods/tree/7b21651d6957d1ada09e0a7a38867503a613b39f/clientsort"
icon = "icons/clientsort.png"
categories = ["utility", "storage"]
tags = ["inventory", "sorting", "buttons", "port"]

