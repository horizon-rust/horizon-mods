owner_ids = [250532790]
license = "MIT"
source = "https://github.com/pretinhacappucina/clumps-horizon"
icon = "icons/clumps.png"
categories = ["game-mechanics", "optimization"]
tags = ["xp", "experience", "orbs", "performance", "optimization"]

