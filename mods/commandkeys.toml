name = "CommandKeys"
summary = "Bind keys to macros: lists of chat messages and commands with per-message delays, sent in order."
description = """
**A native Horizon mod**: the launcher builds it into the game (install it on the launchers Mods page, then press Build there). Native mods are not sandboxed and run with your accounts rights, so read the source before you build it. Pinned to the Horizon tree this was built against.

- Bind any key to a macro: an ordered list of chat messages and commands.
- Per-message delays, editable from the in-game controls screen.

Port of [CommandKeys](https://github.com/TerminalMC/CommandKeys) by TerminalMC (Apache-2.0); credited upstream, original Apache-2.0 license preserved. Feature gaps vs upstream are documented in the port README and tracked on horizon-rust/horizon.
"""
