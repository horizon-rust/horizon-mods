id = "compass_bar"
kind = "mod"
repo = "Fernandes585/Compass-Enhanced"
name = "Compass Enhanced"
summary = "A compass bar with degrees and colored directions, plus death points that guide you back."
description = """
A compass bar at the top of your screen that shows where you are facing, in degrees, and slides smoothly as you turn.

## Features
- Compass letters (N, NE, E, SE, S, SW, W, NW) in a color you choose
- Death points: every time you die, a marker stays on the bar with the distance to where you died
- Reaching a death point turns it into an X with a countdown, or look at it and press X to dismiss it
- Arrows with the distance at the edge of the bar for death points out of view
- Optional background box and four sizes (75% to 150%)
- No commands

Settings are in Options → Mods → Compass Bar. Death points are not saved: they vanish when you close the game."""
