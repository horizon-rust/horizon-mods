id = "connected_textures"
kind = "native-mod"
name = "ContinuityHorizon"
summary = "Continuity for Horizon"
description = """
By tariksabanuz

ContinuityHorizon brings Continuity-style connected textures to Horizon. Neighbouring blocks of the same kind join up into one seamless surface instead of showing a border on every block.

What it connects
- Glass and glass panes
- Bookshelves
- Sandstone

Notes
- Works with the game's own textures; no resource pack needed.
- Native Horizon mod, built from source by the launcher.
- Inspired by Continuity (MIT licensed), recreated for Horizon.

Source code: https://github.com/tariksabanuz/ContinuityHorizon"""
authors = ["tariksabanuz"]
