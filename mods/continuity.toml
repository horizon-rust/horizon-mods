## Horizon registry entry for Continuity (exact 1:1 port of the LGPL-3.0-only mod).
id = "continuity"
kind = "native-mod"
name = "Continuity"
summary = "Efficient connected textures: OptiFine-style CTM rules driving real render-time quad processing with pack textures, emissive sprites, redirects, custom block layers, and a config screen."
description = """
**A native Horizon mod**: the launcher builds it into the game (install it on the launchers Mods page, then press Build there). Native mods are not sandboxed and run with your accounts rights, so read the source before you build it. Pinned to the Horizon tree this was built against.

- **Full CTM loader set**: all 25 loader registrations from ContinuityClient (`ctm`+`glass`, `ctm_compact`, `horizontal`/`bookshelf`, `vertical`, the `h+v`/`v+h` aliases, `top`, `random`, `repeat`, `fixed`, and the 10 overlay variants) with the createLoader/createCustomLoader helper chain and the two built-in resource packs.
- **Real render integration**: pack `.properties` rules parse into processor holders; the baked-model wrap layers CtmBakedModel and EmissiveBakedModel and quad processors rewrite quads at render time; emissive sprites carry through the atlas/sprite loader contexts.
- **Resource layer**: OptiFine-style redirect `.properties` with the stable index table, `block.properties` custom block layers, `emissive.properties` suffixes, resource redirect parsing, and the config screen with the ModMenu entry.

Exact 1:1 Rust translation of [Continuity](https://modrinth.com/mod/continuity) by PepperCode1 ([PepperCode1/Continuity](https://github.com/PepperCode1/Continuity)): every upstream Java class maps to one Rust module with the same names, logic, defaults, and control flow, carrying the upstream license and credit in full. LGPL-3.0-only: copyright (c) PepperCode1; the license text ships with the source. Ported to Rust by sparticle.
"""
