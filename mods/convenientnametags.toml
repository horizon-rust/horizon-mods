id = "convenientnametags"
kind = "native-mod"
name = "Convenient Name Tags"
summary = "Name tags drop on death, can be sheared off and renamed."
description = """
Name tags drop on death, can be sheared off and renamed.

**Differences from the original:** There is no rename screen, so name tags are renamed in an anvil at the normal cost. Shearing a name off and the name tag drop on death don't work on armor stands.

A port of [Convenient Name Tags](https://www.curseforge.com/projects/662763) 1.1.0 by Mim1q, published under its licence, Apache-2.0. Original copyright and licence notices are kept in the file.

Native source mod: install it on the launcher's Mods page, press Build there, and confirm the native-code warning. It runs with your account's permissions. It is pinned to Horizon Nightly fdc87ae and Horizon Mixins e8cd0aa.

No Minecraft code is included."""
authors = ["lavoide", "Mim1q"]
