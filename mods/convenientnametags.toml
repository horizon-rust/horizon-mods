id = "convenientnametags"
kind = "native-mod"
name = "Convenient Name Tags"
summary = "Name tags drop on death, can be sheared off and renamed."
description = """
Name tags drop on death, can be sheared off and renamed.

**Differences from the original:** There is no rename screen, so name tags are renamed in an anvil at the normal cost. Shearing a name off and the name tag drop on death don't work on armor stands.

A port of [Convenient Name Tags](https://www.curseforge.com/projects/662763) 1.1.0 by Mim1q, published under its licence, Apache-2.0. The original copyright and licence notices are kept in the file (LICENSE, NOTICE).

No Minecraft code is included."""
authors = ["lavoide", "Mim1q"]
owners = ["lavoide"]
owner_ids = [38075742]
license = "Apache-2.0"
source = "https://github.com/lavoide/horizon-ports/tree/main/convenientnametags"
icon = "icons/convenientnametags.png"
categories = ["utility"]
tags = ["homestead", "port"]

