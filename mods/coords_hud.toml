id = "coords_hud"
kind = "mod"
name = "Coordinates HUD"
summary = "Your coordinates, facing and the time of day in a corner of the screen."
description = """
The SDK's example mod. It draws your block position, the direction you face and the time of day
in the top-left corner, every frame.

- `/where` puts your coordinates and dimension in chat.
- `/coords` hides or shows the panel.

It reads the game (position, health, time), draws on the HUD and writes to chat: nothing else.
"""
authors = ["Horizon"]
owners = ["ludovic111"]
license = "MIT"
source = "https://github.com/horizon-rust/horizon/tree/main/crates/horizon-mod-sdk/examples/coords-hud"
icon = "icons/coords_hud.png"

