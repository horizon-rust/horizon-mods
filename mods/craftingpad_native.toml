description = """
**This mod has two parts, and you need both.** This is the native part (the rules, as Rust code); install [the other one](https://playhorizon.dev/mods/craftingpad) too.

A portable crafting table.

A port of [Crafting Pad](https://github.com/StrikerRockers-Mods/CraftingPad) 1.0.12 by StrikerRocker, Giselbaer, published under its licence, MIT. Original copyright and licence notices are kept in the file.

Native source mod: install it on the launcher's Mods page, press Build there, and confirm the native-code warning. It runs with your account's permissions. It is pinned to Horizon Nightly fdc87ae and Horizon Mixins e8cd0aa.

No Minecraft code is included."""
