changelog = "A content package checked against the unified farmersdelight 0.5.1. It no longer points at the retired farmersdelight_native: farmersdelight and expandeddelight are optional dependencies, used only by eight recipes. LICENSE and NOTICE are inside the package. The blueberry crate gets the block model the original lacks. The categories Food and Storage are back. Supersedes #698."
