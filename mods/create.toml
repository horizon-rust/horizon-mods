id = "create"
kind = "native-mod"
name = "Create for Horizon"
summary = "Build rotating machines and small factories in Horizon with gears, belts, presses and fans."
description = """
An unofficial, experimental Rust port of [Create](https://github.com/Creators-of-Create/Create), made by Delete228. The original Create code is MIT and credited in the mod's NOTICE.

- Drive machines with water wheels, hand cranks or a Creative Motor. Route power through shafts, gears, gearboxes and clutches.
- Move and process items with belts, depots, presses, mills, Basins and fans.
- Build small moving farms with bearings, pistons, saws, harvesters and Deployers. Moving assemblies currently fit within one loaded chunk column.

Install it as a native mod in Horizon Launcher and build the instance. Built-in models use standard Minecraft textures.

**For the original models and textures, use the Create 6.0.10 JAR for Minecraft 1.21.1 (NeoForge).** Place it in the instance's `horizon-mods/create-resources/` folder and restart Horizon. The JAR is optional and the mod imports resources locally. [Supported JAR](https://modrinth.com/mod/create/version/UjX6dr61)

[Setup and compatibility](https://github.com/Delete228/create-horizon)"""
