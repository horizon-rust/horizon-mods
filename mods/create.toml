sha256 = "754af00a2f5fa738e59cb1217fdc5b95ac45e2a0f140458312cbd190df08d588"
changelog = """
- Added moving contraptions with Mechanical, Windmill and Clockwork Bearings, Mechanical Pistons, Rope Pulleys and Gantries.
- Moving saws, drills, harvesters, ploughs and Deployers can work on supported assemblies. Mounted chests retain their inventory across stops and restarts. Portable Storage Interfaces and Chutes can feed or unload supported farms.
- Vertical Mechanical Bearings can land through dry vanilla leaves. Farm supply and shutdown matched 125 consecutive ticks in Java Create 6.0.10.

This is an alpha. Contraptions must fit within one loaded chunk column, and collision and presentation coverage is partial. Built cleanly in Horizon Launcher 0.2.45 on macOS ARM64. The bundled models and the optional local Create 6.0.10 JAR were checked in game.

[Supported behavior and tests](https://github.com/Delete228/create-horizon/blob/0cb39d4a965f5c229d38def8c62ea8462c0ac176/docs/contraptions.md)"""

