changelog = """
First experimental registry submission for Minecraft 26.3. This build includes kinetic transmission, basic belts, depots, pressing, milling, Basin recipes, fans and stationary drilling. Built-in models use standard Minecraft textures. The optional original JAR is supplied by the player.

Horizon is pinned to `9c7f9b2215dfed497aba5522c44f38926628648d` and Horizon Mixins to `e8cd0aa38cffef49cb2e088ef716baa107148c02`. The macOS ARM64 Launcher 0.2.42 Performance build completed after restoring a truncated source download. The player verified the built-in appearance and the original resources in that profile.

Archive SHA-256: `13638c5571ef7ac32be5bb19ddac90959796d6c102122de09f6a81d39be74d97`. [Validation](https://github.com/Delete228/create-horizon/blob/236c87a889cd76f7e663d1d182c28dc1145f7b14/VALIDATION.md#optional-resources-in-070-alpha2)"""
