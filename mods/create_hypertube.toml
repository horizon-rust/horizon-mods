changelog = """Slice 2, every living traveller rides: villagers and other living entities now travel the tube beside players, where only server players did. The rules are the jar's own — a default blacklist holding the wither and the ender dragon, living entities only, a spectator never riding, sneak refusing the pull, and a ride table keyed by entity UUID — with the entity sweep every ten ticks and a traveller standing in the cell its feet are in. Proven in game: the player reaches x 223.0 at half a block a tick while a villager follows from 199.5 to 223.0 on the same path, a dropped item and a wither stay put over forty ticks, sneaking holds the traveller at 199.5 until the key is released, and both the tube and the entrance recipes craft with their ingredients consumed while nine copper crafts nothing. The accelerators, junctions and funnel stay recorded gaps for a stated reason: they read Create's kinetic network, which cannot be linked at this pin, so carrying one would mean inventing a no-power speed; curves need the bezier renderer and a corner model a content block cannot express."""
