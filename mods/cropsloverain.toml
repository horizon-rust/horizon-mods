id = "cropsloverain"
kind = "native-mod"
name = "Crops Love Rain"
summary = "Crops grow faster in the rain."
description = """
Crops grow faster in the rain.

**Differences from the original:** Saplings and bamboo don't get the extra growth in rain. Any spot open to the sky counts as rained on, so crops under a glass roof or in a desert or badlands also grow faster while it rains.

A port of [Crops Love Rain](https://github.com/ThePoultryMan/Crops-Love_Rain) 1.4.0 by ThePoultryMan, published under its licence, MIT. Original copyright and licence notices are kept in the file.

Native source mod: install it on the launcher's Mods page, press Build there, and confirm the native-code warning. It runs with your account's permissions. It is pinned to Horizon Nightly fdc87ae and Horizon Mixins e8cd0aa.

No Minecraft code is included."""
