id = "crosshair_indicator"
kind = "native-mod"
name = "Crosshair Indicator"
summary = "Dynamic target reach awareness: visual feedback on your crosshair when hovering over an entity in attack range."
description = """
Crosshair Indicator

A native Horizon mod by CayMac that ports the popular Java Crosshair Indicator mod into Horizon:

Dynamic Target Reach Awareness: Real-time visual feedback directly on your crosshair when hovering over an entity in attack reach (<= 3.0 blocks).
Iconic PvP Target Reticle: Default crisp white corner brackets [ + ] hugging the crosshair, matching classic competitive PvP clients.
Multiple Styles: Choose between Brackets [ + ], Center Dot, Diamond, and Tactical Chevron.
Custom Color Themes: Classic White (Default), Dynamic (Green/Orange cooldown awareness), Combat Red, Pink Aesthetic, Diamond Cyan, and Gold.
Cooldown Bar: Optional subtle weapon cooldown progress indicator below the crosshair.
Configurable: Easily customize styles, themes, and keybinds in Options > Mods > Crosshair Indicator."""
