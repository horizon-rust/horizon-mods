name = "Marlow's Crystal Optimizer"
summary = "Client-side End Crystal PvP optimizer: instant 0ms break prediction, zero miss penalty, and fast place."
description = """
Marlow's Crystal Optimizer

A native Horizon mod by CayMac, bringing the premier client-side competitive Crystal PvP utility (originally created by Bram1903 for Java) into Horizon:

0ms Instant Break Prediction: Client-side entity prediction eliminates the delay of waiting for server confirmation packets. The End Crystal despawns locally on the exact frame you strike it, allowing seamless placement and ultra-responsive combos even on higher ping.
Zero Miss Penalty (miss_time = 0): Completely removes vanilla Minecraft's artificial 10-tick (500ms) miss delay, so rapid attacks are never blocked or swallowed.
Fast Place: Removes the 4-tick right-click delay when holding Obsidian or End Crystals, enabling maximum placement speed.
Auto-Break on Hold: Seamlessly attacks crystals when holding down the attack button as your crosshair passes over them.
100% Server-Legal: Sends strictly vanilla attack and punch packets with standard reach checks. No Reach hacks, no automated macros, fully compliant with competitive CPvP rules.
Customizable: Configurable in-game via Options > Mods > Marlow's Crystal Optimizer."""
