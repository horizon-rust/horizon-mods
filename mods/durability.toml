id = "durability"
kind = "native-mod"
name = "Durability HUD"
summary = "Shows remaining durability for your armour and held items."
description = """Draws a small panel with the durability left on your armour and the item in your hand, so you know what to repair before it breaks.

An original native mod for Horizon, written for this project (MIT). Source and licence: [`native/durability`](https://github.com/Jorungandr/horizon-rust-mods/tree/main/native/durability).

- One row per equipment slot, with the item's readable name and remaining durability.
- Optional percentage.
- Pick which corner it sits in; right-hand corners align to the screen edge.
- Only reads your own equipment; it changes no game state."""
authors = ["Jorungandr"]
owners = ["Jorungandr"]
