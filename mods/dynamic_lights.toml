summary = "1:1 LambDynamicLights: handheld torches, lanterns, glowing items, dropped items, and glowing/burning entities illuminate their surroundings with water-sensitive"
description = "A 1:1 native Rust port of LambDynamicLights for Horizon. Holding torches, lanterns, soul lanterns, glowstone, sea lanterns, shroomlights, lava buckets, blaze rods, glow ink sacs, or nether stars in your main hand or offhand smoothly illuminates the blocks and entities around you. Features authentic water-sensitive extinguishing (open-flame torches and campfires turn off underwater while lanterns, sea lanterns, glowstone, and shroomlights stay lit), dynamic lighting for dropped items and glowing/burning mobs (Blaze, Glow Squid, Magma Cube, Allay, Vex, swelling Creeper), and an L-key toggle."
