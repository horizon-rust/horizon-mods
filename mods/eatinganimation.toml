id = "eatinganimation"
kind = "native-mod"
name = "Eating Animation"
summary = "While you eat food, or drink a potion or milk, the item in your hand shows its bitten frames."
description = """
It is a port of [Eating Animation](https://github.com/Theoness1/EatingAnimation) for Horizon.

While you eat food, or drink a potion or milk, the item in your hand shows its bitten frames.

The frames come from a resource pack you build from your own copy of the EatingAnimation download with `tools/make_frame_pack.py`, and drop into Horizon's `resourcepacks/` folder.

~~Or you can just download it from GitHub Releases...~~"""
authors = ["soufi"]
owners = ["soufied"]
license = "MIT"
source = "https://github.com/soufied/EatingAnimation-Horizon"
icon = "https://raw.githubusercontent.com/soufied/EatingAnimation-Horizon/refs/heads/main/icons/eatinganimation.png"
key = "RWT6eNq4e5WfVDA2lzOOi6XCm/+jJgilqT1+HUUM33ie5MCjcRfSg760"

