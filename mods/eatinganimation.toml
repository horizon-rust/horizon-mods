name = "Eating Animation"
summary = "Shows bitten frames for the food, milk and potion in your hand while you eat or drink them."
description = """
Eating Animation for Horizon, a native mod, a port of Eating Animation by Theoness1.
While you eat food or milk, or drink a potion, the item in your hand shows its bitten frames.
The mod has no textures of its own. Build the frame pack from your own copy of the EatingAnimation download with `tools/make_frame_pack.py` in the source, and put it in Horizon's resource packs."""
