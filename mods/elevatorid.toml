changelog = """
First Horizon release, a port of Elevator 1.16.6 (Fabric) by VsnGamer. 1.16.9 is this port's own version number. Built on Horizon commit fdc87ae (Nightly 2026-11-08).

Since the 1.16.8 submission: builds with the new Horizon ports of Tinkers' Construct, Ender IO, Powah and Apothic Spawners (all ten together); with JEI, recipe cards draw fluids as their textures (mod kit 14); the W guide's 3D scene finds its structure from any page and its buttons are translated.

From the 1.16.7 review: the server finds a ride's destination itself, from the direction the client asks for (the next elevator within `range`, never a further one), with widened arithmetic for the client's numbers, and tests for out-of-range and skipped destinations.
