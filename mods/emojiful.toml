id = "emojiful"
kind = "native-mod"
name = "Emojiful"
summary = ":short_name: in chat shows the emoji (Twemoji), with completions as you type."
description = """
**This mod has two parts, and you need both.** This is the native part (the rules, as Rust code); install [the other one](https://playhorizon.dev/mods/emojiful_twemoji) too.

:short_name: in chat shows the emoji (Twemoji), with completions as you type.

**Differences from the original:** Emoji codes become images only in chat messages, not on signs, books, names or in the chat box while typing. The images come in a separate resource pack that has to be enabled. There is no emoji picker button, no Emojiful custom or GIF emoji, no datapack emoji and no profanity filter. A code split across text colours stays as text.

A port of [Emojiful](https://github.com/InnovativeOnlineIndustries/Emojiful) 4.2.0 by HorizonStudio, published under its licence, MIT. Original copyright and licence notices are kept in the file.

Native source mod: install it on the launcher's Mods page, press Build there, and confirm the native-code warning. It runs with your account's permissions. It is pinned to Horizon Nightly fdc87ae and Horizon Mixins e8cd0aa.

No Minecraft code is included."""
authors = ["lavoide", "HorizonStudio"]
