summary = "End foods for Farmer's Delight: shulker, dragon and chorus dishes, End Stove, knives (needs the Farmer's Delight port)."
description = """
End foods for Farmer's Delight: shulker, dragon and chorus dishes, End Stove, knives (needs the Farmer's Delight port).

**Needs** [farmersdelight](https://playhorizon.dev/mods/farmersdelight) and [farmersdelight_native](https://playhorizon.dev/mods/farmersdelight_native) installed too.

**Differences from the original:** The dragon tooth knife does no extra damage to End mobs. Enderman gristle teleports you like a chorus fruit, up to 16 blocks around, where the Java mod sends you higher with less fall damage. Teleporting foods have no cooldown afterwards. The chorus succulent gives the same light at every size.

A port of [End's Delight]() refabricated-1.20.1-2.5 by FoggyHillside, published under its licence, MIT. Original copyright and licence notices are kept in the file.

Its textures, models and data come from the original mod. No Minecraft code is included."""
