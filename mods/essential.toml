## Horizon registry entry for Essential (behavioral clean-room port of the source-available mod).
id = "essential"
kind = "native-mod"
name = "Essential"
summary = "Session invite codes, an in-game skin manager and a screenshot gallery: the local half of Essential's feature set, ported clean-room."
description = """
**A native Horizon mod**: the launcher builds it into the game (install it on the launchers Mods page, then press Build there). Native mods are not sandboxed and run with your accounts rights, so read the source before you build it. Pinned to the Horizon tree this was built against.

- **Session invite codes**: the host issues short alphanumeric invite codes (open-ended or expiring), lists the still-live ones and revokes them; revoked, expired and unknown codes all reject at join time.
- **In-game skin manager**: save skins with their slim/wide model flag, wear one by name, undress by removing the worn skin; unknown skins are rejected and leave the current one on.
- **Screenshot gallery**: captures list newest-first, can be favorited, deleted, and flagged into a share outbox.

Behavioral clean-room port of [Essential](https://modrinth.com/mod/essential) by EssentialGG (source-available, view-only license): no upstream code or assets are included, ported under CC0-1.0. The backend-dependent parts (upstream's relay for world hosting, their social service for chat and cosmetics delivery) are not shippable from a clean-room port; the degradations and host seams are documented in the repo README. Ported to Rust by sparticle.
"""
