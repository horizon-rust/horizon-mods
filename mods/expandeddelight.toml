description = """
Asparagus, sweet potatoes, chili peppers, peanuts, cinnamon, salt, juices, the juicer and the mortar (needs the Farmer's Delight port).

**Needs** [farmersdelight](https://playhorizon.dev/mods/farmersdelight) and [farmersdelight_native](https://playhorizon.dev/mods/farmersdelight_native) installed too.

**Differences from the original:** Villagers don't trade Expanded Delight's items. Farmer's Delight keeps its own melon juice recipe instead of Expanded Delight's replacement.

A port of [Expanded Delight](https://github.com/ianm1647/expandeddelight) 0.3.2 by ianm1647, published under its licence, MIT. Original copyright and licence notices are kept in the file.

Its textures, models and data come from the original mod. No Minecraft code is included."""
