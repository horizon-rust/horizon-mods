id = "fallingtrees"
kind = "native-mod"
name = "Panda's Falling Tree's"
summary = "Trees fall when their base is cut."
description = """
Trees fall when their base is cut.

**Differences from the original:** Trees don't fall with an animation or sound. The drops appear at the stump at once instead of after a delay. Big trees don't take longer to chop and felling costs no extra hunger. Unbreaking doesn't reduce the extra axe wear, and that wear stops at zero durability instead of breaking the axe.

A port of [Panda's Falling Tree's](https://github.com/PandaMods-Dev/Pandas-Falling-Trees) 0.13.2 by The Panda Oliver, published under its licence, GPL-3.0-only. Original copyright and licence notices are kept in the file.

Native source mod: install it on the launcher's Mods page, press Build there, and confirm the native-code warning. It runs with your account's permissions. It is pinned to Horizon Nightly fdc87ae and Horizon Mixins e8cd0aa.

No Minecraft code is included."""
authors = ["lavoide", "The Panda Oliver"]
