id = "farmersdelight"
kind = "native-mod"
name = "Farmer's Delight"
summary = "Farmer's Delight: stove, cooking pot, skillet, cutting board, crops, rich soil and 170 foods."
description = """
Farmer's Delight: stoves, cooking pots, skillets and cutting boards with their recipes; cabbages, onions, tomato vines on rope and rice; rich soil and organic compost; baskets, cabinets, feasts, placeable pies and 170 foods with the Comfort and Nourishment effects. One package with the code and the content.

**Differences from the original:** Cooking pot meals give no experience, and the cutting board ignores Fortune. Eating a pie slice straight from the placed pie gives its food but not the slice's effects. The skillet has no flip animation or Fire Aspect speed-up. There are no steam, bubble or smoke particles and no boiling or crackling sounds. Rich soil's growth boost lands one tick after the crop's own growth, and its "solid block" checks go by block tags.

A port of [Farmer's Delight](https://github.com/MehVahdJukaar/FarmersDelight) 1.20.1-2.4.1+refabricated by vectorwing, MehVahdJukaar, MerchantPug, published under its licence, MIT. The original copyright and licence notices are kept in the file (LICENSE, NOTICE).

Its textures, models and data come from the original mod. No Minecraft code is included."""
authors = ["lavoide", "vectorwing", "MehVahdJukaar", "MerchantPug"]
