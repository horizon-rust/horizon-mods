name = "Farmer's Delight (assets)"
summary = "Farmer's Delight: stove, cooking pot, skillet, cutting board, crops, rich soil and 170 foods."
description = """
**This mod has two parts, and you need both.** This is the content part (items, blocks, textures, models, data; no code); install [the other one](https://playhorizon.dev/mods/farmersdelight_native) too.

Farmer's Delight: stove, cooking pot, skillet, cutting board, crops, rich soil and 170 foods.

**Differences from the original:** Cooking pot meals give no experience, and the cutting board ignores Fortune. Eating a pie slice straight from the placed pie gives its food but not the slice's effects. There are no steam, bubble or smoke particles and no boiling or crackling sounds. Without Nether's Delight installed, hoglins drop nothing, because this port always uses Nether's Delight's hoglin loot.

A port of [Farmer's Delight](https://github.com/MehVahdJukaar/FarmersDelight) 1.20.1-2.4.1+refabricated by MehVahdJukaar, MerchantPug, published under its licence, MIT. Original copyright and licence notices are kept in the file.

Its textures, models and data come from the original mod. No Minecraft code is included."""
