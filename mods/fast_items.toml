id = "fast_items"
kind = "native-mod"
name = "Fast Items for Horizon"
summary = "Optimize item rendering by transforming item entities to 2D"
description = """
Fast Items (2D Items)
Optimizes item rendering by transforming items to 2D forms.

For 2D items(such as potions), this mod avoids rendering their sides, so they are completely flat

For 3D items(such as cube blocks), this mod makes them always face to camera, just as the same behaviour in Lunar Client/BLC."""
