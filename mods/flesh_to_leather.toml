id = "flesh_to_leather"
kind = "mod"
name = "Flesh to Leather"
summary = "Smelt rotten flesh into leather in a furnace."
description = """
Rotten flesh finally has a use: smelt it into leather.

Zombies drop it constantly, and it just piles up in chests. This mod lets you put rotten flesh in a furnace with any fuel — about 10 seconds later you get leather, plus a little experience for your trouble.

**How to use**

1. Install the mod and enable it in Options → Mods, then restart the game.
2. Put rotten flesh in the top slot of a furnace, any fuel below.
3. Collect your leather — ready for armor, item frames, and books.

**Good to know**

- Uses only vanilla items. No new blocks, textures, or mechanics to learn.
- Works in single player. On a multiplayer server, the server needs the mod too.
- Tested on Horizon 0.2.97 (Minecraft Java Edition 26.3).
- Uninstall any time leather you already smelted stays in your world.

Free and open source under the MIT license. Not an official Minecraft product."""
