changelog = """
First release.

- F4 toggles freecam: fly the camera freely while your player stays where it is.
- WASD to fly, Space/Shift up/down, Ctrl for 2.5x speed, mouse wheel changes the speed.
- Fair play mode: the camera can't fly through blocks.
- Settings: key, speed (2–80 blocks/s), fair play, allowed on servers."""
