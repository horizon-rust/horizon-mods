changelog = "Scope the freeze gate to the freecam's own thread: the flag is per-thread, so the integrated server's own Game — which shares the motion method and whose freecam never flew — can no longer clear the camera thread's freeze or freeze anything else. Adds the requested integrated-server test (a second player falls with gravity while the camera's player holds frozen) and fixes the runtime VERSION const the 0.1.1 bump missed."

