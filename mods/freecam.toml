id = "freecam"
kind = "native-mod"
name = "Freecam"
summary = "Fair-play spectator camera with solid block collision, hidden hands, and smooth flight kinematics."
description = """
A fair-play detached spectator camera mod for the Horizon Rust client.

Features
Fair-Play Collision: Full continuous swept AABB block collision prevents wall clipping or cave x-ray abuse.
Clean View: First-person hands and held items are cleanly hidden in camera mode; footstep view bobbing is eliminated.
Smooth Kinematics: Smooth acceleration, braking, and strafe controls (WASD, Space, Shift).
Dynamic Speed: Adjust flight speed on the fly with the mouse scroll wheel (0.25x to 6.0x).
Safe Character: Your player entity remains safely frozen in place with 0 server movement packets sent."""
