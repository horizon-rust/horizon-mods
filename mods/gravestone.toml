summary = "Gravestone block, 3D model, obituary item, textures, and EN/RU localizations for Gravestone. Requires the Gravestone native mod."
description = """
The content module (`gravestone.hmod`) for **Gravestone**, providing the `gravestone:gravestone` block, 3D gravestone model, `gravestone:obituary` item, GUI assets, and English/Russian localizations.

> **Important:** This is the asset/content pack only. For grave spawning on death, inventory restoration, and the readable obituary book screen to work, you must also install the **`gravestone_core`** native mod (`.hnmod`).

