name = "Grind Enchantments"
summary = "Grindstones move enchantments to books."
description = """
Grindstones move enchantments to books.

**Differences from the original:** A book can go into the second grindstone slot even when the other slot already holds a book. Two books just give no result.

A port of [Grind Enchantments](https://github.com/mschae23/grind-enchantments) 3.1.4+1.20.1 by mschae23, published under its licence, LGPL-3.0-or-later. Original copyright and licence notices are kept in the file.

Native source mod: install it on the launcher's Mods page, press Build there, and confirm the native-code warning. It runs with your account's permissions. It is pinned to Horizon Nightly fdc87ae and Horizon Mixins e8cd0aa.

No Minecraft code is included."""
