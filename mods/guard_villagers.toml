changelog = "First WebAssembly `.hmod` release after the `.hnmod` format was retired. Full village grouping, guard hiring, iron gear, combat goals, baby promotion and surplus rebalancing ported to the mod API. Combat goals are now installed once per live entity rather than on every server tick, so a loaded village no longer grows its goal selectors without bound, and village reassignment clears every coordinate tag so a guard can no longer read back a mixed village key. 15 unit tests, source check and signed package check pass."
