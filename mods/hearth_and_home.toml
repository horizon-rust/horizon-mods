name = "Hearth & Home"
summary = "Chimneys, lattices, columns, tile roofs and other cosy building blocks."
description = """
Chimneys, lattices, columns, tile roofs and other cosy building blocks.

**Differences from the original:** Thatch doesn't soften falls as hay does. Chimney smoke and crackle are sent by the server as particle and sound commands, so every player sees the same smoke.

A port of [Hearth & Home](https://github.com/starfish-studios/Hearth-and-Home) 2.0.3 by Starfish Studios, published under its licence, MIT. The original copyright and licence notices are kept in the file (LICENSE, NOTICE).

Its textures, models and data come from the original mod. No Minecraft code is included."""
