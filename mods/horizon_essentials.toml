id = "horizon_essentials"
kind = "native-mod"
name = "Essentials"
summary = "A native port of EssentialsX for Horizon (Minecraft 26.3) with 163 commands, economy, teleportation, kits, and moderation."
description = """
A complete native port of **EssentialsX** to **Horizon** (Minecraft: Java Edition 26.3 rewritten in Rust).

### Features

- **All 163 EssentialsX commands**: `/home`, `/sethome`, `/spawn`, `/warp`, `/tpa`, `/back`, `/fly`, `/god`, `/heal`, `/feed`, `/workbench`, `/kit`, `/balance`, `/pay`, `/ban`, `/mute`, `/jail`, and more.
- **Works with vanilla clients**: Players connect using standard Minecraft 26.3 clients with no mods required.
- **Singleplayer Support**: Works in local singleplayer worlds with host OP level 4 and isolated saves under `<world>/essentials/`.
- **Full Configuration & Permissions**: Uses standard Essentials configuration formats (`config.yml`, `permissions.yml`, `kits.yml`)."""
