changelog = """
Version 0.2.2 (addresses the review on #406):
 - Userdata: a malformed or unreadable player file is logged and marked broken; it is never overwritten or deleted (saves, /essentials cleanup and user removal skip it), and the player gets an in-memory account for the session
 - Data files written by Essentials (kits.yml, jail.yml, worth.yml, spawn.yml, warps/...): a corrupt existing file is copied to <file>.broken-<timestamp> before it is replaced
 - Regression tests for malformed YAML, non-UTF-8 files and cleanup/removal
 - Bundled GPL-3.0 LICENSE and NOTICE with EssentialsX attribution"""
