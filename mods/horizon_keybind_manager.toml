id = "horizon_keybind_manager"
kind = "native-mod"
name = "Horizon Keybind Manager"
summary = "Find, manage, and fix conflicting key bindings for Minecraft and Horizon native mods."
description = """
Horizon Keybind Manager makes finding and managing key bindings easier in Minecraft. Search controls, identify conflicting shortcuts, and manage key bindings from native Horizon mods alongside vanilla controls.

**Features:**
- **Fast Search:** Find key bindings by action name, mod name, keyboard key, or mouse button.
- **Exact Key Search:** Type `key:M` to find actions assigned to a specific key.
- **Conflict Detection:** Filter overlapping key bindings and quickly jump between conflicting actions.
- **Native Mod Support:** View, rebind, and reset key bindings from Horizon native mods alongside regular Minecraft controls.
- **Simple Integration:** Works directly inside Options → Controls → Key Binds.
- **Bilingual Interface:** English and Russian labels.
- **Client-Side:** No server-side installation required.

Designed to make key binding management faster and more convenient, especially when playing with multiple Horizon mods.

**Compatibility:** Horizon Minecraft 26.3."""
