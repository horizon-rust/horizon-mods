id = "horizon_physics"
kind = "native-mod"
name = "PhysicsModHorizon"
summary = "Physics for Horizon, inspired by PhysicsMod: ragdolls, waves, physical particles and capes."
description = """
By tariksabanuz

Physics for Horizon, inspired by PhysicsMod by Haubna. It is a clean-room version for Horizon: it contains none of PhysicsMod's code or assets and is not made or endorsed by Haubna. Everything is built as a native Horizon mod, so no other mods or loaders are needed.

Features

- **Realistic water**: waves that never repeat, built from several swells with wave groups, wind gusts, sun glints, foam on the crests and along the shore, and rain rings on the surface. Boats and the camera follow the same waves you see.
- **Ragdolls**: mobs fall and tumble with their bodies instead of just disappearing.
- **Physical particles**: block cracks, sprint dust and broken or eaten items become small physical pieces that fall, bounce and settle.
- **Capes** that move with you.
- **Quick Setup**: on first launch everything is off, so the game starts fast. A short setup lets you pick how much you want, and then turns it on.
- **Physics Settings** in Options, with categories, switches and sliders for every effect, so you can tune it to your PC.

Notes

- Built for Horizon Nightly `6475f62`. Other versions may need an updated build.
- Works with Vulkan and DirectX 12.
- If the game feels slow, lower the wave height or turn effects off in Physics Settings.

Source code and issues: https://github.com/tariksabanuz/PhysicsModHorizon"""
authors = ["tariksabanuz"]
