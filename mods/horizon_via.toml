changelog = """
Initial registry release of ViaHorizon 0.5.0 (experimental).

- Update official Horizon and horizon-mixins source pins.
- Integrate upstream protocol adapters while retaining experimental Java 1.8.9, 1.12.2, 1.16.5 and 1.20–1.20.1 support, automatic server detection and the version picker.
- Support two-input Java 1.16.5 smithing.
- Fix legacy resource-pack replacement, relative motion correction and translation failure handling.

Uses a guarded source overlay in the launcher’s staged build workspace, pinned to Horizon 802a858cc1ff8a26a5d17424c51ad0f478c79099. This mechanism requires maintainer review.

See https://github.com/TheApple05/horizon-via/blob/v0.5.0/CHANGELOG.md for Windows validation and known limitations. Online authentication across all targets, full launcher installation and other platforms remain unverified."""
