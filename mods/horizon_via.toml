id = "horizon_via"
kind = "native-mod"
name = "ViaHorizon"
summary = "Natively join older versions with Horizon"
description = """
ViaHorizon aims to let you connect to servers running older Minecraft versions directly from Horizon. It handles protocol translation natively in Rust, independently of ViaFabricPlus’s Java implementation.

The focus is on expanding version support while keeping Horizon fast and responsive, with minimal added overhead when playing on older servers.

Support is experimental. Compatibility and gameplay behavior vary by version; see the release notes for supported versions and known limitations."""
