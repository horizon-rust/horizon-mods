changelog = """
### Added
- Highlights: mark missing and wrong blocks through everything, however far away, for all items or just one you pick in the material list (`/hm highlight`).
- Pick block: middle-click a ghost block to take that block in hand.
- Several placements at once: select, show, hide, lock and unload each.
- Select an area with the selection tool (a stick) and save it as a `.litematic` (`/hm save`).
- Copy the material list to the clipboard as a table for spreadsheets (`/hm materials copy`).
- Command completion for `/hm` in chat.
- A wiki in `docs/wiki`: every tab, button and key, with the matching command.

### Changed
- Air place is off by default.
- Printer without air place: only blocks next to a real block whose face you can see are tried, blocks that can't be placed from where you stand aren't tried again until you move or a neighbour changes, and in each layer the item in hand comes first.
- Logs, froglights and other pillars get their direction from the clicked face alone. Without air place they need a real block on the matching side, and the printer's note says so.
- Pinned to Nightly 2026-11-04 `67dad0d` (was `c9d474d`).

### Fixed
- The printer places bamboo, crops, stems, berry bushes and vines. They count as correct at any stage of growth, and the material list includes them.

Built for Horizon Nightly 2026-11-04 (67dad0d, hook API 359)."""

