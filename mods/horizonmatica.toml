First release in the registry.

- Loads .litematic, .schem (Sponge v1–v3), .schematic (MCEdit, 1.12 ids) and structure .nbt; older files are upgraded with Horizon's data fixer
- Ghost overlay with real block models, see-through mode, verifier colours and layer modes
- Placements remembered per world and dimension; move mode, rotate, mirror
- Own menu screen (M) and a material list with item icons
- Printer: places missing blocks within reach, checked against the game's own placement logic; the camera never moves

Since 0.1.0 on GitHub: loading another schematic no longer shows the previous one's blocks.

Built for Horizon Nightly 2026-11-01 (c9d474d, hook API 80)."""
