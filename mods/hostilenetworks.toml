changelog = """
First Horizon release, a port of Hostile Neural Networks 7.0.0 (NeoForge) by Shadows_of_Fire. 7.0.3 is this port's own version number. Built on Horizon commit fdc87ae (Nightly 2026-11-08).

Since the 7.0.2 submission: builds with the new Horizon ports of Tinkers' Construct, Ender IO, Powah and Apothic Spawners (all ten together); with JEI, recipe cards draw fluids as their textures (mod kit 14); the W guide's 3D scenes find their structures from any page and its buttons are translated. The block and item models were compared with the 7.0.0 jar's: all 23 the same, none missing.

From the 7.0.1 review: Data Center outputs respect each item's stack limit in the IO port, and an empty slot takes no more than the limit either; the Deep Learner has its screen; Data Model icons show their mob.
"""
