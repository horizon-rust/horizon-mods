changelog = """
Four views for every module — Minimal, Compact, Standard and Full. Standard keeps the module's individual switches; the other three are presets, so one row under N makes a module tiny, tidy or exhaustive. Profiles pick a view for all modules (Minimal gives Minimal, PvP gives Compact, the rest Standard).

Also adds an Off setting for effect timers and a separate inventory-grid switch (Minimal keeps only the hotbar), tightens the held/armour rows for the compact views, drops the full-screen sleep overlay from the Vanilla page because there is nothing to move or scale in it, and makes snap-to-grid move modules around their own default offset so dragging one back restores its exact default position.

Settings now open as one compact, scrollable panel on the right instead of a list of module pages: General, every module, Vanilla HUD and Tooltips are on a single screen, the world stays visible behind it, and each module keeps its own switches inline. Clicking a row on the Vanilla page now selects the widget actually under the pointer (the list treated its header as a row), Subtitles start where the captions are drawn and move and scale with the rest of the vanilla HUD, and a configuration change made from chat reaches the HUD immediately. AppleSkin keeps its icons on the vanilla hunger bar when the food numbers make the box wider, and centres those numbers over the icons."""
