changelog = """Review repair. Two upgrades before the furnace ticks no longer lose the contents: the transfer is atomic now — the captured inventory and the four burn/cook counters are written into the replacement in the same server call, inside one transaction, all-or-nothing, and the deferred queue keeps one entry per position and carries the earlier snapshot forward. The game mode is checked before anything is read, replaced or consumed: a spectator changes nothing, adventure only where the item may be used. The package carries upstream's third-party credits (NOTICE.txt verbatim at the root, Apache-2.0). Proven in game: two upgrades in one server call report the input, fuel and output in the replacement; a spectator's click leaves the block unchanged while a survival player's upgrades it."""
