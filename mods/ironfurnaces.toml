changelog = """
First Horizon release, a port of Iron Furnaces 4.4.2 (NeoForge). 4.4.5 is this port's own version number. Built on Horizon commit fdc87ae (Nightly 2026-11-08).

Since the 4.4.4 submission: builds with the new Horizon ports of Tinkers' Construct, Ender IO, Powah and Apothic Spawners (all ten together); with JEI, recipe cards draw fluids as their textures (mod kit 14); the W guide's 3D scene finds its structure from any page and its buttons are translated. The block and item models were compared with the 4.4.2 jar's: all 135 the same, none missing.

From the 4.4.3 review: multiplied smelting stops at the result's own stack limit, into an empty output slot as into a partly filled one, with tests for both. Smelting, blasting and smoking recipes come from the world, data packs included, as a vanilla furnace finds them.
"""
