id = "itemtooltip"
kind = "native-mod"
name = "Item Tooltip+"
summary = "Adds the item id, durability and stack size to item tooltips."
description = """Adds a little more to item tooltips: the item id, current durability and max stack size, so you can tell similar items apart at a glance.

An original native mod for Horizon, written for this project (MIT). Source and licence: [`native/itemtooltip`](https://github.com/Jorungandr/horizon-rust-mods/tree/main/native/itemtooltip).

- Item id line, e.g. `minecraft:diamond_pickaxe`.
- Durability `current / max` for damageable items.
- Stack size for stackable items.
- Each line can be toggled in settings."""
authors = ["Jorungandr"]
owners = ["Jorungandr"]
owner_ids = [188995885]
license = "MIT"
source = "https://github.com/Jorungandr/horizon-rust-mods/tree/main/native/itemtooltip"
icon = "icons/itemtooltip.png"
categories = ["utility"]
tags = ["tooltip", "items", "durability", "hud"]

