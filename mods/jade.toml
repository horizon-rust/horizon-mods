changelog = """
Still a port of Jade 26.3.5; 26.3.6 is this port's own version number, not a Jade release. Built and tested on Horizon commit 6475f62.

- Jade's sprites in themes, the drag-to-place screen, the config screens, and the sniffer's dig cooldown.
- `jade:max_position_deviation` is a real game rule.
- Block aim follows the player's reach and Extended Reach.
- Tested on a dedicated server."""

