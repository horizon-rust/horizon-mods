id = "justenoughitems"
kind = "native-mod"
name = "Just Enough Items"
summary = """JEI for Horizon: every item beside your inventory, JEI's search, recipes and uses, the "+" button, bookmarks and cheat mode."""
description = """
A port of [Just Enough Items (JEI)](https://github.com/mezz/JustEnoughItems) by mezz to Horizon, as a native mod. It draws JEI's own interface, with JEI's sprites and layout, over the game's container screens.

- **Ingredient list** beside every container screen and the creative inventory: every item, enchanted books, potions and other variants included, in pages (mouse wheel or arrows).
- **JEI's search**: words (names and tooltips), `"phrases"`, `-exclusions`, `a | b`, `@mod`, `#tooltip`, `$tag`, `%creative tab`, `&id`.
- **Recipes and uses**: left click or **R** for how an item is made, right click or **U** for what it is used for — on the list, the bookmarks, a recipe's slots or any slot of the screen.
- **The recipes screen** as in JEI: category tabs, catalysts, pages, cycling ingredients, a click on the title for all recipes, Backspace to go back. Crafting (with JEI's tipped arrows, firework rockets and shield patterns), stonecutting, smelting, smoking, blasting, campfire, fuels, brewing with its steps, anvil repairs and enchanted books with their cost, grindstone repairs and disenchanting, smithing, composting.
- **"+"** moves a recipe into the crafting grid (Shift: as many as the items allow), with ordinary slot clicks, so it works on any server.
- **Bookmarks** (**A**), **cheat mode** (Ctrl+click on the config button), **Ctrl+O** to hide the overlays, **Ctrl+F** for the search bar.
- Settings and keys in Options > Mods > Just Enough Items. English and Russian.

Turn other recipe viewers off while this one is on: they use the same place on screen.

Built for Horizon Nightly 2026-11-13 (`9f42064`). Native mods are compiled into the game and are not sandboxed: build only code you trust.

**Credits.** Just Enough Items is Copyright (c) 2014-2015 mezz, MIT License; the GUI sprites are JEI's own. This port rewrites JEI in Rust under the same licence and is not affiliated with mezz, Mojang or Microsoft."""
authors = ["DeportedToHell"]
