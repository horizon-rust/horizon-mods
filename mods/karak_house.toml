summary = "Discover Karak Houses in villages and enjoy six drinks with special powers."
description = """
Discover Karak Houses in newly generated villages, with five designs inspired by their surroundings. Meet the Karak Seller and choose from six drinks with distinct powers. A regular Karak Tea costs one emerald, and sellers sometimes offer a complimentary cup. Drinks have individual timers and can be combined.

Install the mod in Horizon 26.3, enable Karak Tea under Options > Mods, restart, and explore newly generated terrain. Tested on Horizon nightly 66f3981."""
