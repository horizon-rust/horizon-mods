changelog = "First registry release, built with the exact-build SDK 0a875da on the mod API (one RETURN mixin adds the grey and red post chains). Aura and the edit only for damage that lands (after the shield and the hurt cooldown); /aura off silences every edit, revenge included; no post-chain warmup on world entry; full-screen white flashes and red pulses are opt-in (screen_flashes = 1). No music is bundled: set your own track in config/kotost_aura.txt, the vanilla beat plays otherwise."
