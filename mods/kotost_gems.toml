id = "kotost_gems"
kind = "mod"
name = "Kotost Gems"
summary = "Gems for Kotost Skill Tree: citrine, iriscite, jade, ruby and sapphire in six tiers, and vacucite."
description = """
The gem items for the native mod **Kotost Skill Tree** (`kotost_skilltree` 0.2.0): citrine, iriscite, jade, ruby and sapphire, each in six tiers from "crumbled" to "exceptional", and vacucite, with their icons and Russian and English names, in their own creative tab.

This pack has only the items. Drops from ores, sockets in tools, weapons and armour, socketing on the anvil, tooltips and bonuses are the skill tree's: install both, on the server and the client.

The textures and names come from Passive Skill Tree 0.6.14a by Daripher (GPL-3.0), baked by `tools/bake.py` in the source repository. No Minecraft code or assets are included."""
