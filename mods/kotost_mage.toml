id = "kotost_mage"
kind = "native-mod"
name = "Kotost Mage"
summary = "A mage: six spells that gather and go off where you look, mana, mastery, and the hat, dress and staff on your model."
description = """
- **Six spells** on keys R G Z X C N: Fireball, Shadow step, Meteor, Absolute zero, Chain lightning, Supernova. They gather and go off where you look.
- **Mana and mastery**: each spell levels up as you use it.
- **Hat, dress and staff** drawn on your player model, with a casting pose.
- **Settings** in `config/kotost-mage.txt`.

Needs the content mod **Kotost Mage Items** (kotost_mage_items: the hat, dress, staff, recipes and sound events) and **Kotost Bust** (kotost_body). Sounds are the game's own. Native source mod: the launcher compiles it after a warning; it runs with your account's permissions. No Minecraft code or assets are included."""
authors = ["Kotost Games"]
