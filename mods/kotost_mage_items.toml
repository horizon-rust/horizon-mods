id = "kotost_mage_items"
kind = "mod"
name = "Kotost Mage Items"
summary = "The Mage's Hat, Dress and Staff with recipes, and the spells' sound events, for Kotost Mage."
description = """
The items of Kotost Mage: the **Mage's Hat**, the **Mage's Dress** and the **Mage's Staff**, their crafting recipes, a creative tab, English and Russian names, and the sound events of the six spells (they point at the game's own sounds, no audio files are shipped).

Install it together with the native mod **Kotost Mage** (kotost_mage), which draws them on your model and adds the spells. Content only: no code."""
