id = "litematica"
kind = "native-mod"
name = "Litematica"
summary = "A modern schematic mod for Horizon, ported from Litematica and MaLiLib."
description = """
Litematica for Horizon (Rust Minecraft).

A clean-room native port of **Litematica** and its core dependency **MaLiLib** for the Horizon engine.

**Features**
- **Schematic Formats**: Reads `.litematic` (v5 & v6), Sponge `.schem`, and legacy `.schematic` files.
- **In-World Ghost Blocks**: Visual overlays displaying placed schematics with color-coded verification:
  - Missing blocks: see-through ghosts
  - Wrong blocks: highlighted in red
  - Wrong block states: highlighted in orange
  - Extra blocks: highlighted in magenta
- **Layer Slicing**: Render complete schematic, all below, single layer, or layer range with Page Up / Page Down hotkeys.
- **Material List**: Real-time material calculation and missing items inventory tracking.
- **Area Selection & Saving**: Define regions using corner selections and export directly to `.litematic` files.
- **In-Game Menu**: Press **M** to open the main menu or use `/litematica` and `/schematics` commands.
- **MaLiLib Configuration**: Full in-game configuration manager for visuals, colors, hotkeys, and rendering.

Pinned to Horizon 0b14f8a and horizon-mixins e59da90.
"""
