id = "lumen"
kind = "shader"
name = "Lumen"
summary = "Cozy Photon-style look: soft shadows, warm sunsets, volumetric clouds, light shafts, clear water, waving plants."
description = """
A cozy shader pack in Horizon's own format, inspired by the look of Photon. All code is original, no Minecraft assets.

- Soft sun and moon shadows
- Warm sky with a round sun and golden sunsets
- Volumetric clouds with drifting cloud shadows
- Light shafts through trees, sun rays, bloom and distance haze
- Clear water with waves, refraction, reflections and the sun's glint
- Clear turquoise water with caustics when you dive
- Waving leaves, grass, flowers and seagrass
- Coloured block light and glowing fireflies
- Wet ground after rain

Every effect can be changed in Options > Horizon Settings > Shader Packs > Shader Options."""
