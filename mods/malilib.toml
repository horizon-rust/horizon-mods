## Horizon registry entry for MaLiLib (exact 1:1 Rust rewrite of the LGPL-3.0 mod).
id = "malilib"
kind = "native-mod"
name = "MaLiLib"
summary = "Core client library mod providing configuration systems, hotkey management, GUI widgets, positioning and NBT for Horizon Minecraft."
description = """**A native Horizon mod**: the launcher builds it into the game (install it on the launcher's Mods page, then press Build there). Native mods are not sandboxed and run with your account's rights, so read the source before you build it.

An exact 1:1 Rust rewrite of [MaLiLib](https://github.com/sakura-ryoko/malilib): the upstream Java by masa and sakura-ryoko rewritten code-for-code into clean, idiomatic Rust.

- **NBT Engine**: High-performance Big-Endian binary NBT reader and writer supporting all standard tag types with automatic Gzip, Zlib, and raw compression detection.
- **Math & Positioning**: BlockPos, Vec3d, IntBoundingBox with volumetric calculation, intersection, containment and iteration, BlockRotation, BlockMirror, and layer slicing (LayerRange / LayerMode).
- **Configuration Engine**: Typed configuration options (Boolean, Integer, Double, String, Color, OptionList) with JSON persistence to disk (`~/.horizon/config/malilib.json`).
- **Hotkey & Keybind System**: Multi-key combinations (e.g. `M, C`), modifier handling (Ctrl, Shift, Alt, Meta), and trigger modes (Press, Release, Hold, Toggle).
- **GUI Framework**: Widget abstractions for Buttons, Sliders, TextFields, Labels, and tabbed screens.

Upstream project by masa and sakura-ryoko. LGPL-3.0 license text and upstream credit carried in full."""
