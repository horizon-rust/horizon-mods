owner_ids = [107615167]
license = "MIT"
source = "https://github.com/AdLf0208/mcwtrpdoors"
icon = "icons/mcwtrpdoors.png"
categories = ["decoration"]
tags = ["port", "trapdoors", "building", "blocks"]

