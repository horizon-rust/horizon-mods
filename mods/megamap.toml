id = "megamap"
kind = "native-mod"
name = "Teiwazik's All in One Map"
summary = "Minimap and fullscreen world map with waypoints, fog of exploration, far terrain from LOD data and a cave layer."
description = """
A client-side minimap and fullscreen world map for Horizon.

**Features**

- Waypoints: death points, sharing over chat, in-world beams with distance labels
- Breadcrumb trail, exploration fog with explored %, threat radar and a cave layer
- Far terrain drawn from Horizon LOD data, volumetric cloud fog
- Map detail: hillshade, shadows, contours, grid; UI themes; automatic surface/cave layers
- Block colours taken from resource packs, entity faces and 3D previews
- English and Russian names

**Default keys** (rebindable under Options > Mods > megamap)

- M: world map
- B: waypoint here
- U: waypoint list
- Z: minimap zoom
- J: minimap size
- K: minimap mode (surface, cave, hidden)
- N: rotate with player or lock north

Chat commands: `/megamap wp add|del|share|list|import` and `/megamap trail clear`.

**Needs**

Horizon with Minecraft 26.3. It is a native mod, so the launcher builds it from source; native code is not sandboxed and needs `--trust-native-code`. The first build takes a while."""
