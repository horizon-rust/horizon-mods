sha256 = "5e304608de3b1094a2b9ce62b5fe9245299cc0587e4bacc44201b303cf8fd989"
changelog = """Slice 4, the chemical capability: one resource, one published capability key, one block entity holding a tank and one item that carries a chemical. A basic chemical tank holds sixty-four thousand units and names them in its own saved data, and a gauge dropper takes two hundred and fifty units a call into its component, so a chemical can now be moved between a machine and a hand the same way items and energy are. Proven in game in five parts: the capability is published by name and lists Mekanism's thirty-two chemicals with hydrogen among them; an insert of four thousand units lands in the tank and reads back from the block data as the id and the number exactly; a partial drain takes two hundred and fifty of a thousand asked, leaving three thousand seven hundred and fifty in the tank and putting exactly two hundred and fifty on the item; an unknown chemical is refused by name and moves nothing; and the counterfactual against a block entity that answers items and energy but not this key finds no handler and no saved chemical. This is the surface two stopped add-ons were waiting for: the article of Mekanism's identity that this port had none of, noted in its own manifest as a gap for four slices."""
