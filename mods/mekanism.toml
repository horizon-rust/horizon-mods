changelog = """Slice 3, the Crusher — the ore-processing machine that needs no new capability: 50 FE/t, a 20,000 FE buffer and 200 ticks (10,000 FE) per operation, from the jar's own config, carrying 145 of its 313 crushing rows (the rest need dusts this port does not register, and each skipped row is printed by the generator). Two defects found while carrying it, both fixed. First: every shaped recipe in 0.2.x used the 1.21.1 `{"item": …}` ingredient form, which 26.3 rejects — all four existing recipes and the new one could not craft at all; they now use bare item ids and are proven in game. Second: the local `Stack` and `Recipe` types shadowed SDK names, so the `uses` table claimed SDK types the port never used and `fits` against a different build failed; renamed `ItemAmount` and `MachineRecipe`, and the table is now true. Proven in game: cobblestone becomes gravel with the buffer at 0 after exactly one 10,000 FE operation, all 145 rows crush in a sweep, an uncharged crusher does nothing, and dirt with no recipe burns nothing."""

