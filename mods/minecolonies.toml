name = "minecolonies"
summary = "A town hall founds a colony, a citizen joins and farms it — with generated art."
description = """
A Horizon port of [MineColonies](https://github.com/ldtteam/minecolonies) (GPL-3.0 code; the mod's own art is All Rights Reserved, so **every asset here is generated by this port**) for Horizon. This first slice is **a town hall, a colony, one citizen and one job**.

**Implemented so far**

- **Founding:** placing a `minecolonies:blockhuttownhall` founds a colony with a default name (`<owner>'s Colony`), its owner, centre, a **64-block (4-chunk) radius**, the founding tick and its records of citizens and harvests. Legality is decided before the block appears, so an illegal hall never exists.
- **Refusals that matter:** a second hall too close is refused, a hall **120 blocks across and 120 up** is refused (founding distance is horizontal — the colony is a 2D claim), and a second colony for the same owner is refused.
- **A citizen and a job:** `/minecolonies citizen hire|list`, `/minecolonies job assign <citizen> farmer|info` and `/minecolonies colony info|rename|radius`. The farmer needs a `minecolonies:blockhutfarmer` in the colony, walks to a mature wheat every 40 ticks, harvests it, replants at age 0 and counts it; a citizen with no colony does nothing.
- **Everything survives a quit and relaunch** — name, roster, radius and harvest count are in the town hall's saved data.
- **The art is generated**, never copied: `tools/gen_assets.py` builds all 15 asset files from a named 10-colour palette and three model templates, and regenerating gives byte-identical files.

**Not yet ported**

- the other ~40 jobs, the builder and its schematics, the research tree, and the colony/citizen UI (the commands above are the surface);
- happiness, saturation, requests, raids, building-driven growth and worldgen colonies;
- the citizen's own renderer (its texture is generated but not yet bound), and the proper hut and scythe shapes.

**Licence.** MineColonies' code is **GPL-3.0**; its art is **All Rights Reserved**, so this port ships **regenerated art only** and contains no upstream texture, model or language file. The GPL-3.0 text and a notice naming the authors, the upstream URL and the exact jar with its sha256 travel inside the archive; the port is a derivative of the code under the same licence with its complete source published.

Original copyright and licence notices are kept in this repository. Pinned to Horizon 9f42064 and horizon-mixins 5a64af93. Help with the remaining slices is welcome."""
