id = "minelights"
kind = "native-mod"
name = "MineLights"
summary = "MineLights brings RGB lighting integrations to Horizon."
description = """
MineLights brings RGB lighting integrations to Horizon.

Lighting reacts to your biome, weather, player status and compass. Configure keys, colors and individual devices from Horizon's Mods menu or with `/minelights`. OpenRGB and Yeelight connect directly. Other supported RGB devices use [MineLights Server](https://github.com/megabytesme/MineLights-Server).

This package uses the Horizon native mod SDK for Minecraft 26.3 and Horizon commit `0a875da91dbb0fdcb7ba8c42c11341aa229af51a`. Horizon Launcher compiles it for that build. Native code runs with your account permissions and requires enabling native-code trust in the launcher.

MineLights Server uses authenticated V2 and pinned TLS for remote pairing. On Windows, the optional reviewed MineLights Server 2.4.1 download and launch stays off until you confirm it. MineLights verifies the executable's pinned SHA-256 before running it. By default on Windows, entering a world checks GitHub release metadata for newer MineLights Server versions, including when automatic server start is off. This check only shows a notice about newer versions. Turn off **Check for MineLights Server updates** in MineLights settings to disable the automatic check.
"""
