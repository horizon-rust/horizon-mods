id = "minelights"
kind = "native-mod"
name = "MineLights"
summary = "MineLights is a Minecraft mod that brings RGB lighting integrations to Minecraft Java Edition and Horizon."
description = """
MineLights is a Minecraft Fabric, Quilt, Forge, NeoForge and Horizon mod that brings your world to life with dynamic RGB lighting effects for your peripherals. Effects respond to your environment, weather and player status; keyboard lighting can also display health, hunger, experience and a compass.

Configure MineLights through Horizon's Mods menu. OpenRGB devices and Yeelight bulbs can connect directly. Other supported RGB devices use [MineLights Server](https://github.com/megabytesme/MineLights-Server).

MineLights connects to local RGB services and may discover Yeelight bulbs on the local network. MineLights Server uses encrypted, authenticated connections and supports optional pairing with servers on other computers. On Windows, Horizon's server option is off by default. If you opt in and confirm, it can download and launch the reviewed MineLights Server v2.4.0 after verifying its pinned SHA-256. Current clients use authenticated V2; older clients may use loopback-only V1 after explicit approval. You can also install and start the server yourself. Configurable chat notices report when the server is missing, when a download starts, is in progress, or finishes, and when a newer stable release is available; update checks read release metadata without downloading an update.

This is the Horizon port of [MineLights](https://github.com/megabytesme/MineLights), by MegaBytesMe. As a native mod, it is built into the game and runs with the player's account permissions.
"""
