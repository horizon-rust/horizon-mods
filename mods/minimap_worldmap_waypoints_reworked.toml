id = "minimap_worldmap_waypoints_reworked"
kind = "native-mod"
name = "Minimap, Worldmap and waypoints reworked"
summary = "An adaptive minimap and world map with named waypoints, portals, world borders and a biome readout."
description = """
An adaptive minimap and full-screen world map for Horizon, with shared terrain and biome history in memory for the current connection.

- Minimap in four corners, square or round, 64–256 GUI pixels, 0.1–4 blocks per pixel, optional player rotation and a directional player arrow on both maps.
- English, Russian, French, Spanish and German interfaces follow the game language, including regional variants.
- Rebindable map (M by default) and waypoint manager (N by default); drag to pan, scroll to zoom under the cursor, and select dimensions independently without teleporting.
- Original 16×16 icons for all 67 vanilla biomes and for each dimension. Detailed terrain keeps known biome names and icons after the game unloads a chunk, separately for each dimension and height layer.
- Existing Horizon CPU LOD fills distant map coverage; detailed chunks take precedence. Approximate LOD heights and biome names remain available in the map's cache. No extra terrain is requested from the server.
- The full-screen map shows cursor coordinates, the converted Nether coordinates, the localised biome and fluid surface/bottom heights. Right-click for coordinate copying, waypoints and chunk/region information; teleport appears only with known game-master permission.
- Create, edit, colour and delete named waypoints, or choose Show on map. Coloured first-letter markers appear through walls on the HUD and on both maps. Points are isolated by save/server identity and dimension, with 64 per world/server.
- Biome grass, foliage and water tints blend across borders; leaves use their actual texture colours. Water and glass-family blocks are translucent, water tint thickens with depth, ground cover is skipped, and flowers/crops use curated colours.
- Portals and world borders appear on both maps; portal markers show destinations. Independent coordinate toggles below the minimap convert Overworld/Nether X/Z correctly, including negative positions.
- Fixed terrain texels at every zoom and matching texture/geometry publication prevent stale chunk stripes. The distant-smoothing option is removed. The map skips rendering the 3D world behind it.

Settings and waypoints persist asynchronously in the mod data folder. Terrain and biome history stays in RAM until disconnect; RAM retention is temporarily uncapped, and very wide views use a raster fallback. Legacy unscoped waypoints are deleted on upgrade; preferences and scoped points remain. The mod makes no network requests.

The runtime uses portable standard-library APIs and is intended for Linux, macOS and Windows. Validated on pinned Horizon Nightly 2026-11-07 and Mixins revisions; other revisions are not claimed supported. Live gameplay, macOS and Windows runs remain unverified for this release.
"""
