id = "mobs_see_far"
kind = "native-mod"
name = "Mobs See Far"
summary = "Hostile mobs can now see much further"
description = """
Hostile mobs can now see much further

The average distance in vanilla Minecraft is 20 blocks
With this mod, that value becomes 128 blocks

If a player is in survival mode, hostile mobs within a 128-block radius will notice the player and pursue them

(For those who enjoy a hardcore experience)"""
