id = "mod_menu"
kind = "native-mod"
name = "Mod Menu"
summary = "A Mods button on the title screen that lists every mod you have installed."
description = """
Adds a Mods button next to Accessibility on the title screen. It opens a Mod Menu style screen that lists every mod
you have installed, with its icon, name, version and description.

- Search by name, id or description, and filter by on, off, native or content mods.
- Pick a mod to see its details, turn it on or off, or open its own settings page.
- Open Mods Folder and Done at the bottom, as in the Java mod.

The button is the only way in: there is no key and no command.

Inspired by [Mod Menu](https://modrinth.com/mod/modmenu) by TerraformersMC for Fabric. This is a clean-room version
for Horizon and contains none of its code or assets. The icon is my own."""
authors = ["tariksabanuz"]
owners = ["tariksabanuz"]
license = "MIT"
source = "https://github.com/tariksabanuz/ModMenuHorizon"
icon = "icons/mod_menu.png"

