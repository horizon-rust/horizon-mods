id = "mod_menu"
kind = "mod"
repo = "levzzz5154/horizon-mod-menu"
name = "Mod Menu"
summary = "Browse installed mods, including native mods, with versions, enabled states, filters and search."
description = """
An independent, sandboxed mod browser by levzzz5154.

Press **M** while playing, run **`/modmenu`**, or open
**Options → Mods → Mod Menu → Settings**. Use `/modmenu text` to search names,
ids and mod types. Filter all/enabled/disabled mods, browse pages, select a row
for details, and refresh after changing mods in the launcher.

Lists installed sandboxed, content and native source mods in the current instance.
Enabled means the launcher's selected state, not proof a mod is running. This is
a read-only menu: it does not toggle other mods, run commands, or start native builds.

**Requires a launcher with the schema-1 Mod Menu inventory feed**
([Horizon #3112](https://github.com/horizon-rust/horizon/pull/3112)). On a launcher
without it, the menu shows an explicit update message. The launcher supplies display
metadata through this mod's own sandbox storage; the mod has no general filesystem
or network access. Direct external `--dev-mod` paths and runtime failure status
are not included in the feed.

Tested on Horizon nightly `83f15fa27` (Minecraft 26.3), mod API 0.1 / API level 0.
Other Horizon revisions have unverified support. This `.hmod` does not require Rust,
Git, Horizon Mixins or any native build to install.

Independently written, not a port of another project's Mod Menu. No Minecraft code
or artwork is included. MIT licensed; source, tests and feed specification are linked below.
"""
authors = ["levzzz5154"]
owners = ["levzzz5154"]
license = "MIT"
source = "https://github.com/levzzz5154/horizon-mod-menu"

