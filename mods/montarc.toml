changelog = """
- For Horizon builds that serve shader API 0.1. Build 1.7.0 is the same pack for API 0.2.
- Portals: the Nether portal glows violet and the End portal and gateway glow cyan-green.
- Shadows: new "Shadow map size" (512 to 2048) and "Shadow distance" (64 to 160) options.
- Weather: rain and snow have their own look, lit by the sky, the moon, torches and lightning.
- Rain puddles that mirror the sky, with raindrop rings ("Rain puddles", needs "Wet surfaces").
- Sunbeams: optional light rays toward the sun ("Sunbeams", off by default).
- Underwater: sunlight patterns dance on the seabed ("Underwater light"), and the water fog is a clear blue-teal instead of almost black.
- Screenshots added. Release v1.6.1 of the repository.
"""

