id = "montarc"
kind = "shader"
name = "Montarc"
summary = "Bright, colorful shader pack: soft shadows, colored light, living water, wind, and own look for the Nether and the End."
description = """
Bright, colorful shader pack for Horizon. Horizon had no shaders on the registry, so I made one. Style is close to Complementary Reimagined, but the code is mine, written from scratch in WGSL.

## What you get

- **Soft shadows.** Sun and moon cast them. Water and stained glass tint the light that goes through. Pick the shadow map size and distance in game.
- **Sky and fog match.** Blue day, orange sunsets, dark blue night. Far terrain fades into the sky, no hard line at the horizon.
- **Colored light.** Torches are warm, soul fire is blue, redstone is red, sea lanterns are cyan, amethyst is purple. The Nether portal glows violet, the End portal cyan-green.
- **Water that looks like water.** Waves, depth color, reflections, sun glitter and foam on the shore. Swim under it and sunlight dances on the seabed.
- **Rain that looks like rain.** Rain and snow are lit by the sky, the moon and your torches. Puddles gather on flat ground and mirror the sky, with raindrop rings.
- **Wind.** Grass, flowers, crops and leaves move. Rain makes it stronger.
- **Nether and End look different.** Nether is hot and hazy, with heat shimmer. End is cold and purple.
- **Sunbeams.** Optional light rays toward the sun, off by default.
- **34 options.** Everything can be tuned or turned off in game.

## Slow? Try this

- Shadow map size: 1024 or 512
- Shadow distance: 64
- Shadow quality: Low
- Water reflections: off
- Rain puddles: off
- Bloom: off
- Shadows: off. Biggest gain.

## Known problems

- Horizon shader API is 0.1, experimental. It can change.
- Entities, block entities and particles are not shaded yet. There is no stage for them.
- Nether and End sky is vanilla. The sky stage only draws in the Overworld.
- Shadow bias may need tuning on some GPUs. If you see stripes on surfaces, change `Shadow bias`.
- Rain puddles form on any flat ground under open sky, not only on grass and dirt.
- Underwater light does not depend on how deep you are, only on sky light and distance, so deep water looks as lit as shallow.
- Sunbeams are new and still rough. They need a visible sun and may look strong or patchy in some scenes. Lower the setting or turn it off.
"""
