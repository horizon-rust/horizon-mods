changelog = """
- Portals: the Nether portal glows violet and the End portal and gateway glow cyan-green.
- Shadows: new "Shadow map size" (512 to 2048) and "Shadow distance" (64 to 160) options, so you can trade shadow sharpness for FPS in game.
- Weather: rain and snow now have their own look, lit by the sky, the moon, torches and lightning. Night rain stays faint instead of covering the screen.
- Rain puddles: puddles that mirror the sky, with raindrop rings, on flat open ground while it rains ("Rain puddles", needs "Wet surfaces").
- Sunbeams: optional light rays toward the sun ("Sunbeams", off by default, costs a little FPS).
- Underwater: sunlight patterns dance on the seabed when you swim ("Underwater light").
- Screenshots added.
"""

