## Horizon registry entry for MoreChatHistory (exact 1:1 Rust port of MoreChatHistory by JackFred).
id = "morechathistory"
kind = "native-mod"
name = "MoreChatHistory"
summary = "Expands the chat history cap from 100 entries to 16,384."
description = """
**A native Horizon mod**: the launcher builds it into the game (install it on the launchers Mods page, then press Build there). Native mods are not sandboxed and run with your accounts rights, so read the source before you build it. Pinned to the Horizon tree this was built against.

- The chat history deque is created with capacity 16384 instead of 100.
- The display queue, send queue and recent-chat caps all read 16384 instead of 100.
- Trimming drops from the oldest side exactly as vanilla does; nothing else in the chat paths changes.

Exact 1:1 Rust port of [MoreChatHistory](https://github.com/JackFred2/MoreChatHistory) by JackFred (CC0-1.0); upstream code translated code-for-code, CC0-1.0 carried, credited upstream. Ported to Rust by sparticle.
"""
