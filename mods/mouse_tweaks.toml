id = "mouse_tweaks"
kind = "native-mod"
name = "Mouse Tweaks"
summary = "Convenient inventory handling: RMB drag deposit, Shift+LMB drag transfer, and scroll wheel item move."
description = """
Brings essential inventory and mouse handling enhancements to the Horizon Rust client.

Features
RMB Drag: Hold the right mouse button and drag across slots to deposit 1 item per slot evenly.
Shift + LMB Drag: Hold Shift and drag the left mouse button across items of the same type to quickly transfer them between containers.
Scroll Wheel Move: Scroll up or down over item slots to transfer items one by one.
Fully toggleable in Options > Mods > Mouse Tweaks."""
