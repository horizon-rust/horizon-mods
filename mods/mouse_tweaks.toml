name = "mouse_tweaks"
summary = "A Horizon port of Mouse Tweaks."
description = """A Rust port of MouseTweaks (BSD 3-Clause, (c) 2023 Ivan Molodetskikh,
https://github.com/YaLTeR/MouseTweaks) for Horizon native mods. 1:1
behavior: left-drag pickup, right-drag distribute, and wheel push/pull of
items between slots, with the original's config keys. Settings are driven
by the /mousetweaks command instead of the original's MouseTweaks.cfg.

License: BSD 3-Clause (the original's), notice preserved in LICENSE.

Source-only .hmod built on the current SDK (Horizon f00125f).

Licence: BSD-3-Clause. Source: https://github.com/Sparticle62ops/horizon-mouse-tweaks
"""
