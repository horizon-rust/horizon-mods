id = "mvs"
kind = "mod"
name = "MVS - Moog's Voyager Structures"
summary = "160+ structures carried to 26.3: villages, towers, cathedrals, wells and carts, with their loot."
description = """
A port of [MVS - Moog's Voyager Structures](https://github.com/Moog-s-Mods/MoogsVoyagerStructures)
by FinnDog (built by Phantax) for Horizon. The jar is data only, so this port is
the content tier as the mod ships it, mapped to Minecraft 26.3:

- **130 structures** (127 overworld, 3 Nether) generated by the vanilla jigsaw
  system, **116 structure sets** with the mod's 1.65 spread factor and its
  `min_distance_from_world_origin`, **170 template pools** and **355 NBT
  templates**.
- **13 processor lists**, including the 8 spawner-randomizing ones (weighted
  mobs and timing) as `horizon:spawner_mobs`, and **32 loot tables** in the 26.3
  shape.
- The **16 NeoForge `c:` biome tags** the structures select by are restored:
  26.3 ships none, and without them the overworld structures could never start
  (proved in game by removing them).

The `moogs_structures` library is not shipped: its four types are mapped to
vanilla `minecraft:jigsaw` plus Horizon's `horizon:start_checks`,
`horizon:piece_limited` and `horizon:enhanced_terrain_adaptation`. Versioned
template folders for other game versions are carried but inert for 26.3, and
`when_replacing` is not modelled (no set here uses it). Spawner mobs are carried
and read by the engine but spawner spawning was not waited for in the in-game
check. **Generated structures stay in the save after the mod is removed** —
they are written into the world's chunks like any other worldgen.

This port is **LGPL-3.0-only**, the same licence as the original, and the
complete corresponding source of the port is in the repository named below
(full licence text in LICENSE, the GNU GPL v3.0 it incorporates in COPYING)."""
authors = ["FinnDog", "AdLf0208"]
