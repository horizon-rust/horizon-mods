id = "neovitae"
kind = "native-mod"
name = "neovitae"
summary = "A Horizon port of neovitae."
description = """
A port of [Neo Vitae](https://github.com/breakinblocks/NeoVitae) for Horizon.

**Implemented so far**

- The altar `neovitae:ara_vitae`: a horizontal `facing` block with no menu, so a right click reaches the use hooks (hardness 2, blast 5, stone sounds, collision 16×12×16). It has a block entity, a server tick and one slot.
- Structure → tier, data-driven from the jar's two layouts: `weak` (the altar alone, tier 0) and `apprentice` (altar + 8 runes at `y-1`, tier 1), revalidated every 100 ticks; only the layout's four orthogonal `upgrade` positions are scanned for runes.
- The LP tank: `10,000 × capacityMod` mB main, `1,000 × mod` I/O and a reserve `× 20`. A Capacity Rune adds 0.2, an Augmented Capacity Rune multiplies by 1.075.
- Clicks: a right click with an item puts one item in the slot (carrying that stack's own components); an empty-hand right click takes the stack back.
- The weak orb: within 5 blocks of an altar it trades health for LP — creative fills the altar's room (verified at exactly 18,000), survival pays 2 health for 200 LP.
- Harness commands `/neovitae altar|lp|insert` (upstream has none).

**Not yet ported**

- **Altar tiers `mage`/`master`/`archmage`/`transcendent`** (pillars, t3–t6 capstones, tier effects) and the 21-rune family beyond Capacity.
- The altar's fluid I/O (input/output/charging tanks), the reserve auto-move, the tier-0 bootstrap leech, redstone/comparator output, particles, sounds and the block-entity renderer.
- **The crafting tree above the altar** (vitae stone, tabula rasa/robur/animata and the rest) is not carried, so every recipe it would unlock is missing.
- The slot move is applied by the altar's tick, one tick after the click (a block-entity slot written inside a use hook is not kept at this pin); upstream moves it inline.
- A take is ignored for 500 ms after an insert on the same altar, so the engine's other-hand retry cannot take back what the first hand inserted.
- The layouts are Rust constants transcribed from the jar's data, not a datapack registry (the pin has no consumer for the mod's own registry).

MIT: the original copyright and licence travel inside the bundle, not only in the source repository. Pinned to Horizon 1d63e0a and horizon-mixins 5a64af93."""
