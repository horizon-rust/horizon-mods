id = "nethersdelight"
kind = "mod"
name = "Nether's Delight Refabricated"
summary = "Nether foods for Farmer's Delight: stuffed hoglin, Blackstone Stove and furnaces, propelplants, machetes (needs Farmer's Delight 0.5 or later)."
description = """
Nether foods for Farmer's Delight: hoglin and strider dishes, the stuffed hoglin feast, the Blackstone Stove and three furnaces, soul compost and rich soul soil, fungus colonies, the mimicarnation, propelplants and machetes.

**Needs** [farmersdelight](https://playhorizon.dev/mods/farmersdelight) 0.5 or later installed too (declared as a dependency, so the game names it if it's missing). Its stove, furnaces, feast, plants, soils, recipes and mob drops run on that package's code.

**Differences from the original:** The Blackstone furnaces give no experience for what they smelt. The propelplant gives no light, and the Blackstone Stove's light doesn't change with its state. A propelplant broken without the right tool or losing its support breaks without exploding. The mimicarnation's trick of copying a meal on rich soul soil is left out. Soul compost isn't sped up by the soul sand valley biome.

A port of [Nether's Delight Refabricated](https://github.com/DragonsPlusMinecraft/NethersDelightRefabricated) 1.20.1-4.1.1 by RaymondBlaze, a Fabric port and fork of [Nether's Delight](https://github.com/Chefs-Delight/NethersDelight_Forge) by Umpaz, SoyTutta and Sammy (MIT). Published under the Refabricated licence, LGPL-2.1-only. The original copyright and licence notices are kept in the file (LICENSE, LICENSE-FORGE, NOTICE), and the package is its own source.

Its textures, models and data come from the original mod. No Minecraft code is included."""
authors = ["lavoide", "RaymondBlaze", "Umpaz", "SoyTutta", "Sammy"]
owners = ["lavoide"]
owner_ids = [38075742]
license = "LGPL-2.1-only"
source = "https://github.com/lavoide/horizon-ports/tree/main/nethersdelight"
icon = "icons/nethersdelight.png"
categories = ["food"]
tags = ["homestead", "port"]

