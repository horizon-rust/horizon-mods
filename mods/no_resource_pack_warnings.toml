## Horizon registry entry for No Resource Pack Warnings (port of SpaceWalkerRS/no-resource-pack-warnings).
id = "no_resource_pack_warnings"
kind = "native-mod"
name = "No Resource Pack Warnings"
summary = "Stops the resource-pack compatibility warnings and lets any pack load."
description = """
**A native Horizon mod**: the launcher builds it into the game (install it on the launchers Mods page, then press Build there). Native mods are not sandboxed and run with your accounts rights, so read the source before you build it. Pinned to the Horizon tree this was built against.

- Every resource-pack compatibility check reads as compatible: packs of the wrong format load and select without the warning screen.
- Upstream redirects `PackCompatibility.isCompatible()` to true in the options-side pack reload and the pack-selection screen; Horizon routes packs through its configuration adapter, so the port overrides the one verdict the adapter applies and extends to a selection UI when one lands.

Exact 1:1 Rust port of [no-resource-pack-warnings](https://github.com/SpaceWalkerRS/no-resource-pack-warnings) by SpaceWalkerRS (MIT); upstream code translated code-for-code, MIT carried, credited upstream. Ported to Rust by sparticle.
"""
