id = "no_telemetry"
kind = "native-mod"
name = "No Telemetry"
summary = "Disables in-game usage telemetry, outbox writes and the anonymous usage-count heartbeat."
description = """
Disables the game's usage telemetry endpoint, consent predicate, outbox writes and anonymous usage-count heartbeat startup. It is always active while installed and does not create a configuration file. Its scope is the game; a separately installed launcher has its own behavior.

Independent MIT Rust implementation of the documented behavior of [No Telemetry by kb1000](https://github.com/kb-1000/no-telemetry). The original project is MPL-2.0; its credit and complete upstream notice are retained separately. No original implementation code is included.

Native source mod for Horizon 26.3. The launcher compiles it into the game, with the game's account permissions. The published build targets Horizon `1453e0e614af4b2d04dd0d228a94162b5d459910` (API 415) and horizon-mixins `5a64af938ec86b00d53d16a408aabc0038fb3e57`; latest Nightly compatibility is pending registry CI.
"""
authors = ["Vex193"]
