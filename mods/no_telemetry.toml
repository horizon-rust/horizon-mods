license = "MIT"
source = "https://github.com/Vex193/horizon-ports/tree/e4d9d4f00b4d1a705a59b83a4b32ad048a1c3e80/mods/no_telemetry/source"
icon = "icons/no_telemetry.png"
categories = ["utility"]
tags = ["port","privacy"]

