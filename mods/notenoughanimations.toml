id = "notenoughanimations"
kind = "native-mod"
name = "Not Enough Animations"
summary = "tr7zw's third-person animations for Horizon: eating, climbing, rowing, maps and bows."
description = """
A native port of [Not Enough Animations](https://github.com/tr7zw/NotEnoughAnimations) by **tr7zw**, brought to Horizon by **romaeboj**.

It improves third-person player animations without changing gameplay:

- **Eat / Drink** — the hand lifts to the mouth while eating or drinking.
- **Ladder** — arms and legs swing while climbing; the body faces the ladder.
- **Boat** — each oar sweeps with its own rowing time.
- **Item Swap** — the arms cross as the hands trade items.
- **Burning** — the head wobbles and the free arm flails while on fire.
- **Freezing** — the arms shake in powder snow.
- **Crawling** — the swimming pose becomes crawling on land.
- **No Sleep Movement** — the arms lie still in bed.
- **Maps** — filled maps render in the hand with paper around the content and on the back.
- **Bow fixes** — the other hand's item hides while a bow or crossbow is drawn or charged; shields never hide.

Every animation has its own toggle in **Options → Mods → Not Enough Animations**. Two extra toggles are **In-World Map Rendering** and **Bow Animation Fixes**. The labels use the original mod's translations (en, de, fr, pl, pt, ru, sv, tr, uk, zh).

Client-side only: it changes how your player model looks, not movement, combat or item stats.

Requires Horizon 26.3. Install it from the launcher's Mods page, then press **Build** on the same page. The source is at the link below; the original mod and its licence are credited there.

Original mod by tr7zw. Horizon port by romaeboj."""
authors = ["tr7zw", "romaeboj"]
