changelog = """
Updated to the latest Horizon (`fdc87aecdbd116bf1e08adcd062fcbaea8c2e2ca`).

- Filled maps render on one side only, with paper around the content and on the back; no z-fighting.
- Maps show in the inventory player preview.
- Map pose no longer follows head pitch; the right hand matches the left.
- Empty Map stays a plain vanilla flat item.
- Offhand items stay hidden for bows and crossbows, except shields.
- A crossbow also hides a bow in the other hand while charged or drawn.
- New settings: **In-World Map Rendering** and **Bow Animation Fixes**.
- Settings labels use the original mod's translations in 14 languages."""
