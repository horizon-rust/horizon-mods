name = "Not Enough Animations for Horizon"
summary = "tr7zw's player animations for Horizon: eating, ladders, boats, item swaps, burning, freezing, crawling and sleeping."
description = """
Not Enough Animations brings tr7zw's third-person player animations to Horizon. It changes only how player models are posed; movement, combat, damage and game logic stay vanilla.

Ported animations: Eat/Drink, Ladder, Boat Rowing, Item Swap, Burning, Freezing, Crawling and No Sleep Movement. Each has its own toggle in Options → Mods → Not Enough Animations, with the original mod's translations.

Original mod by tr7zw. Horizon port by romaeboj."""
