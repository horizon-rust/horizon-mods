changelog = """
Not Enough Animations brings tr7zw's player animations to Horizon. It changes only how player models are posed. Movement, combat, damage and game logic stay vanilla.

Ported animations:

- **Eat / Drink** — the hand rises to the mouth while eating or drinking, with a chewing motion.
- **Ladder** — arms and legs alternate while climbing; the phase follows the player's height.
- **Boat** — each arm rows with its own oar timing, and rests when the oars do.
- **Item Swap** — the arms cross while the hands trade items, then unroll.
- **Burning** — the head wobbles and the free arms flail while the player is on fire.
- **Freezing** — the arms shake in powder snow, unless the player has Fire Resistance.
- **Crawling** — the swimming pose on land becomes a crawl with alternating arms and legs.
- **No Sleep Movement** — the arms lie still while sleeping in a bed.

Every animation has its own on/off toggle in **Options → Mods → Not Enough Animations**, plus a master switch. Labels use the original mod's translations.

Arms busy with a swing, held item use, item swap, climbing, rowing, aiming a two-handed item or holding a spear keep their pose, so the animations do not fight vanilla actions.

Original mod by **tr7zw**. Horizon port by **romaeboj**."""
