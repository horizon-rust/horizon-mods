name = "Ocean's Delight"
summary = "Squid, guardian and pufferfish dishes for Farmer's Delight, and the guardian soup feast (needs Farmer's Delight 0.5 or later)."
description = """
Squid, guardian, elder guardian and pufferfish dishes for Farmer's Delight: cooking pot and cutting board recipes, tentacles and guardian meat from knife kills, and the guardian soup feast.

**Needs** [farmersdelight](https://playhorizon.dev/mods/farmersdelight) 0.5 or later installed too (declared as a dependency, so the game names it if it's missing). Its cooking pot and cutting board recipes, the feast and the knife drops run on that package's code.

**Differences from the original:** No food-group tags for the Diet mod, which Horizon doesn't have. Otherwise none known.

A port of [Ocean's Delight](https://github.com/Scouter456/Oceans_Delight) fdrf-fabric-1.0.2-1.20 by Scouter, published under its licence, MIT. The original copyright and licence notices are kept in the file (LICENSE, NOTICE).

Its textures, models and data come from the original mod. No Minecraft code is included."""
