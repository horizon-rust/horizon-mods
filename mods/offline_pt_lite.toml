id = "offline_pt_lite"
kind = "native-mod"
name = "SeyrlaunPT Lite"
summary = "A lightweight, open-source offline path tracer for Horizon screenshots, with PBR materials and optional Intel Open Image Denoise integration."
description = """
SeyrlaunPT Lite is a lightweight, open-source offline path tracer for taking screenshots in Horizon. Hold the camera still and let the image get cleaner as samples accumulate. It is designed for still images, not real-time gameplay.

Features:
- PBR materials and connected textures from compatible resource packs.
- Adjustable render resolution, light bounces, exposure and lighting freeze.
- Automatic F2 screenshot denoising with optional Intel Open Image Denoise.
- Main, raw, albedo and normal PNG outputs.

Controls: F6 toggles path tracing, F8 opens settings, and F2 captures a screenshot.

Install it as a native mod through the original Horizon launcher, enable it, review the native-code warning, build and launch.

The .hnmod does not include OIDN binaries. For automatic denoising, install the separate Windows x64 native-tools runtime provided in the GitHub release into your instance's game-data folder.

This experimental alpha targets Horizon v0.2.97 (a3acb5f), with Minecraft 26.3. Other Horizon revisions are unverified. Lite uses a local 128-block scene and has limited entity support.

The Pro weather controller and expanded camera tools are not included."""
