name = "One shot gun"
summary = '"A gun that kills any mob in one hit."'
description = """
# One Shot Gun

Adds a gun that kills any mob in a single hit.

## Features
- One-shot kills on every mob
- Simple to use: equip it and fire
- Lightweight, with no extra setup needed

## How to use
1. Install the mod in Horizon.
2. Get the gun in-game.
3. Hold it and use it to shoot.

## Notes
- Made for Minecraft 26.3
- Report bugs in the comments"""
