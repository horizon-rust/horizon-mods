description = """
**A native Horizon mod**: the launcher builds it into the game (install it on the launcher's Mods page, then press Build there). Native mods are not sandboxed and run with your account's rights, so read the source before you build it. Pinned to the Horizon tree this was built against.

Pickup notifications: config (trove semantics and the v1-to-v2 offset migration), icon and GUI alignment values, pickup event buses, S2C packet models with the server send gate, the HUD queue state machine (shown list plus backlog with merge/extend rules) and the notification base state machine (durations, pop, expiry, slide-in/out math).

Port of [Pickup Notifications](https://github.com/Roundaround/mc-fabric-pickup-notifications) by Roundaround (MIT); credited upstream, original license carried.
"""
