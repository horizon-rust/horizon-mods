changelog = "Fixes pickups that showed nothing: Horizon's server can announce the pickup of an entity it never sent the client (one that spawns and is taken in the same tick, like a furnace's experience or an item dropping at the player's feet). The mod's server half now tells the client what such an entity was (plugin channel `pickupnotifier:take_entity`, only to clients that register it), and the client lists each entity once. Built for Horizon Nightly 2026-11-13 (`9f42064`)."

