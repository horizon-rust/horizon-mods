## Horizon registry entry for Polymorph (exact 1:1 Rust translation of the LGPL-3.0-or-later mod).
id = "polymorph"
kind = "native-mod"
name = "Polymorph"
summary = "Recipe conflict resolution: when several recipes produce the same item, the crafter picks between them instead of the menu silently taking the first match."
description = """**A native Horizon mod**: the launcher builds it into the game (install it on the launcher's Mods page, then press Build there). Native mods are not sandboxed and run with your account's rights, so read the source before you build it. Pinned to the Horizon tree this was built against.

An exact 1:1 Rust translation of [Polymorph](https://modrinth.com/mod/polymorph): the upstream Java by Illusive Soulworks ([IllusiveSoulworks/polymorph](https://github.com/IllusiveSoulworks/polymorph)) translated code-for-code, carrying the upstream license and credit in full.

- **Conflict keying**: RecipePair, RecipeCache, RecipeData, BlockEntityRecipeData and PlayerRecipeData: per-block-entity and per-player selected recipes, cache invalidation and data write-back.
- **Lookup ladder**: RecipeManager (get_player_recipe, then get_block_entity_recipe), with the PolymorphApiSeam for engine-facing recipe access.
- **Wrappers**: IngredientWrapper, RecipeWrapper and CraftingRecipeWrapper with the shaped/shapeless conflict comparison transcribed from upstream.
- **Network**: all seven packets (C2S: PlayerRecipeSelection, BlockEntityListener, PersistentRecipeSelection; S2C: PlayerRecipeSync, RecipesList, HighlightRecipe, UpdatePreview) with their FriendlyByteBuf field order, the ServerPacketEnv / ClientPacketEnv seams and the client handler ladder.
- **Ticker**: the block-entity ticker-side listener registration.

Port of [IllusiveSoulworks/polymorph](https://github.com/IllusiveSoulworks/polymorph), copyright (C) 2020-2022 Illusive Soulworks, LGPL-3.0-or-later: the license text ships with the source. 66 unit tests on the translated logic. Rust port by sparticle, upstream by Illusive Soulworks."""
