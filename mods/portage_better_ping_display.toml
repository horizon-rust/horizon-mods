name = "portage-better-ping-display"
summary = "Colored ping in milliseconds in Tab: an unofficial Rust port of Better Ping Display for Horizon."
description = """
An unofficial community Rust port of **Better Ping Display — Fabric Edition**, originally created by **Vlad Marica**.

Hold **Tab** to display colored latency in milliseconds after player names. Connection bars and name formatting are preserved. Enable or disable the display in **Options → Mods**.

The value comes from the server. The mod sends no additional ping requests. Updates depend on the server, generally every 30 seconds on vanilla at its normal tick rate.

This native mod must be built into Horizon through your native-mod integration. It targets Minecraft 26.3 and Horizon revision `fdc87aecdbd116bf1e08adcd062fcbaea8c2e2ca`. Other Nightly revisions require compatibility checks.

The original YACL settings screen and JSON configuration are not included.

**Credits:** Vlad Marica — original mod and color logic, MIT license. Name-formatting code adapted from Horizon — Ludovic Marie and the Horizon contributors, MIT license. Complete license notices are included.

Original project: https://github.com/vladmarica/better-ping-display-fabric"""
