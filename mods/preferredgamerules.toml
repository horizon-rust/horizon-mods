id = "preferredgamerules"
kind = "native-mod"
name = "Preferred Gamerules"
summary = "New worlds start with your preferred game rules."
description = """
New worlds start with your preferred game rules.

**Differences from the original:** The two gamerules are built in (fire spread off, mob explosion drop decay off) and there is no config file. The Java mod only changes the defaults for new worlds. This port also sets the rules once on an existing world the first time it opens with the mod, and keeps any later changes.

A port of [Preferred Gamerules](https://github.com/Estecka/mc-Preferred-Gamerules) 1.1.1+1.19.4 by Estecka, published under its licence, MIT. Original copyright and licence notices are kept in the file.

Native source mod: install it on the launcher's Mods page, press Build there, and confirm the native-code warning. It runs with your account's permissions. It is pinned to Horizon Nightly fdc87ae and Horizon Mixins e8cd0aa.

No Minecraft code is included."""
authors = ["lavoide", "Estecka"]
