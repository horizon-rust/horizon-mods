id = "quark"
kind = "mod"
name = "Quark"
summary = "Quark's building blocks and tweaks. Requires the native mod Quark (native)."
description = """
Independent port of [Quark](https://github.com/VazkiiMods/Quark) by Vazkii and the Quark team to Horizon. Not affiliated with or endorsed by them.

This version has Quark's building blocks and a set of its tweaks; the rest of Quark comes in later versions.

**Both projects are required:** this content mod (blocks, items, textures, recipes' data) and the native mod **Quark (native)** (behaviour, config, recipes).

- **Building blocks:** vertical slabs for every slab, wooden posts, hedges, hollow logs, stools you can sit on, rope, leaf carpets, framed glass, paper lanterns and walls, bamboo mats, thatch, shingles, crates and sacks, bookshelves and ladders in every wood, blackstone and deepslate furnaces, rainbow lamps, more bricks and stone variants, grates, gold bars, more potted plants.
- **Tweaks:** double doors open together, right-click harvesting, hoe harvesting, ladders drop down, note blocks chime on amethyst, map washing, renewable spore blossoms, scaffolding replacing, petting dogs, pig litters, safer rabbits and slimes, slimes to magma cubes, concrete powder stays on magma, glass shards, two slabs back into a block, utility recipes, automatic recipe unlock.
- **Config:** the original's `config/quark-common.toml`.

Licensed under CC BY-NC-SA 3.0, same as the original: not for commercial use."""
