id = "reroll_trades"
kind = "native-mod"
name = "Reroll Trades"
summary = "A button on a villager's trading screen gives it new trades, as long as nobody has traded with it yet."
description = """
**A native Horizon mod**: the launcher builds it into the game. Native mods are not sandboxed and run with your account's rights, so read the source before you build it. Pinned to the Horizon commit it was tested on.

- Open a villager's trading screen: while it has no experience and no trade has been used, a circular-arrow button sits above its offers. Click it, or press **C** (rebindable in Options > Mods), and the villager's offers are rolled again from the game's own trade tables, as vanilla rolls them for a new villager.
- A villager that has traded keeps its trades, as does one without a workstation.
- Single player and LAN worlds you host: the world's server does the reroll. On a Java server running Trade Cycling the button sends that mod's packet.

Written for Horizon by apeirs. The idea is the one of [Trade Cycling](https://github.com/henkelmax/trade-cycling) by henkelmax; no code or assets come from it.
"""
