id = "respectmytrims"
kind = "native-mod"
name = "Respect My Trims"
summary = "Piglins respect gold armour trims."
description = """
Piglins respect gold armour trims.

**Differences from the original:** On LAN, the game doesn't check a guest's armour for gold at all, so a gold trim only keeps piglins calm for the host.

A port of [Respect My Trims](https://github.com/tnoctua/respectmytrims) 1.0.0+mc1.20 by N (tnoctua), published under its licence, LGPL-2.1-only. Original copyright and licence notices are kept in the file.

Native source mod: install it on the launcher's Mods page, press Build there, and confirm the native-code warning. It runs with your account's permissions. It is pinned to Horizon Nightly fdc87ae and Horizon Mixins e8cd0aa.

No Minecraft code is included."""
authors = ["lavoide", "N (tnoctua)"]
