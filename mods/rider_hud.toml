license = "MIT"
source = "https://github.com/maliferen/horizon-rider-hud"
icon = "icons/rider_hud.png"
categories = ["equipment", "utility", "game-mechanics"]
tags = ["hud", "mounts", "horse", "riding", "utility", "client-side"]
screenshots = ["screenshots/rider_hud/1.png", "screenshots/rider_hud/2.png"]

