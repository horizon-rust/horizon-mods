id = "rightclickharvest"
kind = "native-mod"
name = "Right Click Harvest"
summary = "Right-click a grown crop to harvest and replant it."
description = """
Right-click a grown crop to harvest and replant it.

**Differences from the original:** The Java mod takes one seed out of the drops for the replant. This port leaves the drops as vanilla rolls them, so each harvest gives one seed more.

A port of [Right Click Harvest](https://github.com/JamCoreModding/right-click-harvest) 4.6.1+1.20.1 by Jamalam, published under its licence, MIT. Original copyright and licence notices are kept in the file.

Native source mod: install it on the launcher's Mods page, press Build there, and confirm the native-code warning. It runs with your account's permissions. It is pinned to Horizon Nightly fdc87ae and Horizon Mixins e8cd0aa.

No Minecraft code is included."""
authors = ["lavoide", "Jamalam"]
owners = ["lavoide"]
owner_ids = [38075742]
license = "MIT"
source = "https://github.com/lavoide/horizon-ports/tree/main/rightclickharvest"
icon = "icons/rightclickharvest.png"
categories = ["utility"]
tags = ["homestead", "port"]

