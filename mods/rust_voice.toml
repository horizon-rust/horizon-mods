changelog = """
Replaces 0.1.44, which was never published. Fixes all findings from the review of #548: voice and microphone stop as soon as you leave a server; a server can no longer make the client allocate memory with a huge distance range; IPv6 voice servers work; the Local volume no longer mutes groups and discs; holding a player's volume slider while scrolling no longer moves it to another player.

New: RNNoise noise suppression (as in Plasmo Voice) and automatic voice activation by a neural speech detector; Simple Voice Chat groups in the menu (join with a password, leave, create); group invites; Simple Voice Chat 2.6 and Horizon's voicechat-server; pv-addon-discs: track titles, music notes, the jukebox you look at is louder, pinning a disc; a simpler Devices tab with fine tuning under Advanced."""
