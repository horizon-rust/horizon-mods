id = "rzero"
kind = "native-mod"
name = "RZero"
summary = "Return by Death: rewinds world chunks, entities, containers, and player state to the last checkpoint upon death."
description = """
Rewinds the world and player state to the last checkpoint when the player dies. Blocks, containers, entities, weather, time, dimensions, and inventory are restored to their state at the checkpoint.

### How it works
- **Return by Death:** On fatal damage, the world rolls back to the last checkpoint instead of showing the death screen.
- **Checkpoints:** An initial checkpoint is created when entering a world. New checkpoints are saved automatically during safe periods, after combat, and after defeating a boss, or on a fixed timer.
- **Multiplayer modes:** On a LAN or server world, a key player's death rewinds the world for everyone on it. Supports single key player, multiple key players, all players, or rotating key player, with an optional rollback cooldown.
- **Manual control:** With cheats enabled, `F6` (`/rzero set`) creates a checkpoint, `F7` (`/rzero load`) rolls back, and `F8` switches the key player mode.

Settings and keybinds are in **Options > Mods**.

Licensed under `GPL-3.0-only`, with a review grant for Horizon's reviewers in [REVIEW-GRANT.md](https://github.com/Reset171/RZeroRust/blob/main/REVIEW-GRANT.md)."""
