id = "safespawn"
kind = "native-mod"
name = "SafeSpawn"
summary = "New players spawn somewhere safe."
description = """
New players spawn somewhere safe.

**Differences from the original:** The search for a safe spot only covers chunks that are already loaded, where the Java mod loads chunks to search. Players who were already in a world before the mod was added are never moved.

A port of [SafeSpawn](https://github.com/CozyCord/SafeSpawn) 1.0.0 by Tokimi, CozyStudios, published under its licence, CC0-1.0. Original copyright and licence notices are kept in the file.

Native source mod: install it on the launcher's Mods page, press Build there, and confirm the native-code warning. It runs with your account's permissions. It is pinned to Horizon Nightly fdc87ae and Horizon Mixins e8cd0aa.

No Minecraft code is included."""
authors = ["lavoide", "Tokimi", "CozyStudios"]
owners = ["lavoide"]
owner_ids = [38075742]
license = "CC0-1.0"
source = "https://github.com/lavoide/horizon-ports/tree/main/safespawn"
icon = "icons/safespawn.png"
categories = ["game-mechanics"]
tags = ["homestead", "port"]

