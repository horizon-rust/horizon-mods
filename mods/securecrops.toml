id = "securecrops"
kind = "native-mod"
name = "Secure Crops"
summary = "Farmland isn't trampled by players who land softly."
description = """
Farmland isn't trampled by players who land softly.

**Differences from the original:** The Java mod has three gamerules that control trampling. This port has none and always behaves as Homestead sets them: nothing tramples farmland, with or without a crop on it.

A port of [Secure Crops](https://github.com/zekk051/secure-crops) 2.0.0 by zekk051, published under its licence, MIT. Original copyright and licence notices are kept in the file.

Native source mod: install it on the launcher's Mods page, press Build there, and confirm the native-code warning. It runs with your account's permissions. It is pinned to Horizon Nightly fdc87ae and Horizon Mixins e8cd0aa.

No Minecraft code is included."""
authors = ["lavoide", "zekk051"]
