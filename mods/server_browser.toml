changelog = "Addresses registry review #248. Discover limits status probes to the visible window plus a small margin. Scrolling replaces queued probes and automatic refresh uses the active window or saved servers. Removed offline-access search options and catalog listings. Added explicit discovery consent for new and upgrading users, removed the dormant feedback sender, and corrected copyright to shuab."
