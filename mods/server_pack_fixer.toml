id = "server_pack_fixer"
kind = "native-mod"
name = "Server Pack & SMP Fixer"
summary = "Helps playing multiplayer servers with heavy resource packs and custom textures: fixes bad-CRC textures, asset loading freezes, holograms, and chunk holes."
description = """
This mod helps when playing on multiplayer SMP servers with many resource packs, custom skins, and custom textures (such as HugoSMP or ItemsAdder/Oraxen servers). 

It ensures custom textures, buttons, scoreboards, and holograms become visible and fixes timeouts while loading into the server. 

Note: Heavy servers with dozens of packs can still feel laggy on the first join. If joining hangs on first connect, simply restart your client (close Horizon and open it again). Once the assets are cached, you should have a smooth experience!

Features included:
- Fixes obfuscated PNGs / bad chunk CRCs so "Loading assets" no longer freezes.
- Resilient pack downloader with automatic retries and larger cache.
- Fixes stretched GUI buttons, font holograms, and missing chunk holes."""
