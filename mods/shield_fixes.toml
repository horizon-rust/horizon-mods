name = "Shield Fixes & Status HUD"
summary = "Always-active shield status HUD, durability tracker, 5-tick warmup indicator, axe break detection, and sound fixes."
description = """
# Shield Fixes & Status HUD for Horizon

A complete native mod for modern Minecraft combat that adds real-time shield telemetry, durability indicators, and accurate opponent shield disable tracking.

### Key Features:
- **Shield Status HUD**: Displays current shield readiness (Ready, Blocking, Raising Warmup, Disabled Cooldown) even when the shield is in your inventory.
- **Durability Tracker**: Real-time shield durability counter rendered directly on your HUD.
- **5-Tick Warmup Indicator**: Visual cues showing the exact 5-tick delay before shield blocking engages.
- **Accurate Opponent Cooldowns**: Opponent shields are tracked with exact axe disable mechanics (5-second cooldown timer).
- **Sound Fixes**: Authentic shield disable and block sound triggers.
- **Customizable HUD Corner**: Move the HUD to Top-Left, Top-Right, Bottom-Left, or Bottom-Right via mod settings.

### Controls:
- Configurable via **Options > Mods > Shield Fixes**."""
authors = ["taxtii", "itzglecni"]
owners = ["taxtii"]
license = "MIT"
source = "https://github.com/taxtii/shield_fixes.git"

