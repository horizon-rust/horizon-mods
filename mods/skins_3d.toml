id = "skins_3d"
kind = "native-mod"
name = "3D Skins"
summary = "The outer layer of every player's skin drawn as real 3D pixels."
description = "The outer layer of every player’s skin drawn as real 3D pixels: hat, jacket, sleeves and pants follow the head, arms and legs exactly as the game moves them. Lighter and cleaner than Horizon’s built-in option: about 4x fewer polygons, closed corners, nothing poking through armor, and 3D sleeves in first person. Works for everyone you can see, respects Skin Customization, and switches to the flat layer further away. Client side only."
