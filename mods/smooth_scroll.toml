## Horizon registry entry for Smooth Scrolling (exact 1:1 Rust translation of the GPL-3.0-only mod).
id = "smooth_scroll"
kind = "native-mod"
name = "Smooth Scrolling"
summary = "Makes every list scroll smoothly (chat, inventories, menus, creative tabs) instead of jumping one slot per wheel tick."
description = """**A native Horizon mod**: the launcher builds it into the game (install it on the launcher's Mods page, then press Build there). Native mods are not sandboxed and run with your account's rights, so read the source before you build it. Pinned to the Horizon tree this was built against.

An exact 1:1 Rust translation of [Smooth Scrolling](https://modrinth.com/mod/smooth-scroll): the upstream Java by SmajloSlovakian ([SmajloSlovakian/Minecraft-Smooth-Scrolling](https://github.com/SmajloSlovakian/Minecraft-Smooth-Scrolling)) translated code-for-code, carrying the upstream license and credit in full.

- **Smooth chat scrolling** with inertia, snapping and animation settings carried from upstream, including the chat-position-with-scaling fix.
- **Inventories and containers**: AbstractContainerScreen, AbstractScrollArea, ItemPickerMenu, creative tabs, EditBox, Hud, MouseHandler, precise scissor rects, suggestions list, screens and the miscellaneous set, all 1:1.
- **Config screen** under Mod Menu with the upstream option set (SmoothSc config, NewConfig base, custom slider and tab widgets).

Port of [SmajloSlovakian/Minecraft-Smooth-Scrolling](https://github.com/SmajloSlovakian/Minecraft-Smooth-Scrolling), copyright (C) SmajloSlovakian, GPL-3.0-only: the license text ships with the source. 109 unit tests on the translated logic. Rust port by sparticle, upstream by SmajloSlovakian."""
