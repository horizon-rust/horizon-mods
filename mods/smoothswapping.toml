id = "smoothswapping"
kind = "native-mod"
name = "Smooth Swapping"
summary = "A port of Smooth Swapping: items fly from slot to slot instead of jumping, along an animation curve you can edit."
description = """
A port of [Smooth Swapping](https://github.com/Schauweg/Smooth-Swapping) by Schauweg and Riflusso to Horizon, as a native mod.

- Items moved in an inventory **fly from slot to slot** instead of jumping: shift-clicks, hotbar keys, sorting, crafting results and stacks taken into the cursor.
- The flight follows the original's **animation curve** at the original's speed.
- **Smooth Swapping's own config screen**, as in Java (Mod Menu's Configure, or Options > Mods > Smooth Swapping > Configure...): Toggle Mod, the speed slider, the curve editor and the test inventory.
- Drawing only: it works on servers too.

Built for Horizon Nightly 2026-11-13 (`9f42064`). Native mods are compiled into the game and are not sandboxed: build only code you trust.

**Permission and credits.** Published with the permission of the original author Schauweg and the current maintainer Riflusso (given on Discord on 2026-11-08). Smooth Swapping is licensed under the LGPL-3.0; this port keeps that licence and is not affiliated with Mojang or Microsoft."""
authors = ["DeportedToHell"]
