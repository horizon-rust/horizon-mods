id = "smwyg"
kind = "native-mod"
name = "Show Me What You Got"
summary = "Ctrl+T over an item puts it in chat, with its tooltip on hover."
description = """
Ctrl+T over an item puts it in chat, with its tooltip on hover.

**Differences from the original:** The shared line arrives as a server message, not as signed player chat. Sharing doesn't work from the creative inventory. If you edit the item name in the chat box, the message goes out as plain text.

A port of [Show Me What You Got](https://github.com/apace100/show-me-what-you-got) 1.1.1 by Apace, published under its licence, MIT. Original copyright and licence notices are kept in the file.

Native source mod: install it on the launcher's Mods page, press Build there, and confirm the native-code warning. It runs with your account's permissions. It is pinned to Horizon Nightly fdc87ae and Horizon Mixins e8cd0aa.

No Minecraft code is included."""
authors = ["lavoide", "Apace"]
owners = ["lavoide"]
owner_ids = [38075742]
license = "MIT"
source = "https://github.com/lavoide/horizon-ports/tree/main/smwyg"
icon = "icons/smwyg.png"
categories = ["social"]
tags = ["homestead", "port"]

