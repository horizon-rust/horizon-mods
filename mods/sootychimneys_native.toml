id = "sootychimneys_native"
kind = "native-mod"
name = "Sooty Chimneys"
summary = "Chimneys that smoke, with wind, soot and scraping."
description = """
**This mod has two parts, and you need both.** This is the native part (the rules, as Rust code); install [the other one](https://playhorizon.dev/mods/sootychimneys) too.

Chimneys that smoke, with wind, soot and scraping.

**Differences from the original:** Wind doesn't bend campfire smoke. Chimney smoke is sent by the server, so every player sees the same wind. Blocking or unblocking a chimney doesn't puff soot, and there is no statistic for scraped soot. Create's sandpaper doesn't work as a soot scraper.

A port of [Sooty Chimneys](https://github.com/mortuusars/sootychimneys) 1.3.4 by mortuusars, published under its licence, MIT. Original copyright and licence notices are kept in the file.

Native source mod: install it on the launcher's Mods page, press Build there, and confirm the native-code warning. It runs with your account's permissions. It is pinned to Horizon Nightly fdc87ae and Horizon Mixins e8cd0aa.

No Minecraft code is included."""
