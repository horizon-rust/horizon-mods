changelog = "The UI remaster: a voice menu on V (Simple Voice Chat's own keybind defaults: M mute, H hide icons, N disable; push-to-talk on Caps Lock), centered and keyboard-navigated; pixel speaker icons instead of text indicators (talking, whispering, muted, deafened, off); the deafen state (hear nobody); and a control channel so the server tells the client its group and the menu can leave one. Verified: the bundle applies and the whole game cargo checks on the pinned Horizon commit with -D warnings; 40 unit tests."
