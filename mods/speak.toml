id = "speak"
kind = "native-mod"
name = "Speak."
summary = "Proximity voice chat: hold a key to talk, groups to reach further."
description = """
Speak. is a proximity voice chat for Horizon: hold a key to talk and the players near you hear you, or join a group to talk across distance.

- Hold the key (V by default) to talk; players nearby hear you based on in-game distance.
- Push to talk or voice activation mode, switchable in settings.
- Whispering shortens the distance for quiet conversation.
- Password protected groups let you talk to players outside your vicinity.
- Configurable voice distance, mic sensitivity, and per-player volume.
- Individual player volume adjustment.
- Talking players are shown above their heads in a GUI overlay.
- Commands: /speak invite <player>, /speak group <name>, /speak leave, /speak whisper, /speak pt, /speak vox.
- Settings page: Options > Mods > Speak. > Settings.

Built as a Horizon native mod with horizon-mixins, on Horizon's native hook points.
Install it on the launcher's Mods page, then press Build there. Native mods run with
the player's account permissions and are not sandboxed.

Authored by wxund. Source: https://github.com/wxundup/speak
"""
authors = ["wxund"]
owners = ["wxundup"]
license = "MIT"
source = "https://github.com/wxundup/speak"

