id = "speak"
kind = "native-mod"
name = "Speak."
summary = "Proximity voice chat: hold a key to talk, nearby players hear you; groups talk beyond distance."
description = """
Speak. is a proximity voice chat for Horizon: hold a key to talk and the players near you hear you — or join a group and talk beyond distance.

The keys, all bindable in Options > Mods, with Simple Voice Chat's own defaults where it has them: speak (Caps Lock, hold to transmit), menu (V), mute (M), whisper (B, hold while transmitting), hide icons (H), disable (N).

The menu, on V: a centered panel with the toggles and the quick settings, keyboard-navigated (arrows move, the number keys and Enter use a row, V or Esc closes) — mute, deafen (hear nobody), hide icons, voice chat, voice distance, whisper distance, volume, and leave group, with the header showing the group the server says you are in.

The indicators, top-left: icons, not text — a pixel speaker glyph for your own mic state (waves when talking, one wave when whispering, a slash when muted, struck through when deafened, bare gray when off) and a glyph and name for each talking player, whisperers in their own colour, fading half a second after the last packet.

Also: proximity routing by position and dimension; groups with passwords and open/isolated types (/speak group, invite, leave), members reached whatever the distance; per-player volume on the settings page; and the full settings under Options > Mods > Speak. > Settings.

What is real and what is stubbed: the transport is real — the window sends a mic packet each tick while the key is held, the server mixes by group and proximity and sends sound packets to the receivers, over Horizon's mod message channel (speak:voice), which vanilla clients simply don't carry. Control messages (a leave, the group's name) ride the same channel, kept apart from voice by a kind byte. The audio codec is a stub: the packets are framed but carry no sound bytes yet, because Horizon has no audio capture hook and no codec crate in its lock. Until one is wired in, voice activation and actual audio are pending; the settings for them are in place.

Built as a Horizon native mod with horizon-mixins, on Horizon's native hook points. Install it on the launcher's Mods page, then press Build there. Native mods run with the player's account permissions and are not sandboxed.

Authored by wxund. Source: https://github.com/wxundup/speak
"""
authors = ["wxund"]
owners = ["wxundup"]
