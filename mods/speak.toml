changelog = "Groups with passwords, open and isolated types, invites and routing rules; the HUD with mic states and talking players; mute and whisper keys; per-player volume; sound packets carry sender, position, dimension and name. Verified: the bundle applies and the whole game cargo checks on the pinned Horizon commit with -D warnings; 32 unit tests. The audio codec stays a stub until Horizon offers native mods an audio source."
