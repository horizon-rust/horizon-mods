license = "MIT"
source = "https://github.com/wyddy7/minecraft-spider-man-rust"
icon = "icons/spider_man.png"
categories = ["adventure", "transportation"]
tags = ["spider-man", "web-swinging", "parkour", "wall-running", "movement"]

