description = """A port of Storage Delight for Horizon: barrel-like storage furniture. Slice 1 is the oak
family — fourteen 27-slot containers (a drawer, a drawer with a door, a drawer with books, small drawers, a
bookshelf with a door, a glass cabinet, a cabinet with glass doors, a single-door cabinet and six countertop
cabinets) — each a barrel-shaped block whose 27 slots every face reaches, with the vanilla three-row chest
menu, a plain 176x166 chest screen, and the barrel's `open` state driven by its viewer count. The other
eleven wood families, the per-block GUI texture and title, the per-block open/close sound, the
`OPEN_BARREL` statistic and the piglin anger are not ported yet.

**Implemented so far:** the slice in the package, as described above.

**Not yet ported**

- **Menu title.** API 17 opens one of vanilla's MOD_MENUS; the three-row
- **Vertical placement.** The minecraft:barrel template's
- **Menu is the vanilla chest layout**, not upstream's per-block GUI texture
- **No piglin anger / OPEN_BARREL stat.** Upstream's useWithoutItem awards
- **Other wood families** (birch, spruce, jungle, acacia, dark oak, mangrove,
- **No in-game run of 0.2.0.** horizon-launcher is not installed on this machine, so nothing here

Ported to Horizon 0.2 from the upstream mod; pinned to game 26.3, Horizon SDK `0b14f8a` and horizon-mixins `e59da90`. The full corresponding source ships in this repository beside the artifact.

Based on the original project: https://github.com/axperty/storagedelight
"""
