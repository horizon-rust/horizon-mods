id = "subsense"
kind = "native-mod"
name = "SubSens"
summary = "Allows even lower mouse sensitivity than vanilla, down to true zero."
description = """
A port of [SubSens](https://github.com/chikaradude/SubSens) by Maciej "ChikaraDude" Panocha to Horizon.

- Extends the sensitivity slider from 0..1 to -1/3..1 (roughly -67%).
- Stores precise negative values in options.txt.
- Keeps an untouched exact value, so DPI conversions survive.
- No separate menus or config files.
"""
