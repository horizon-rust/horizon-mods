id = "subsense"
kind = "native-mod"
name = "SubSens"
summary = "Allows even lower mouse sensitivity than vanilla, down to true zero."
description = """
A port of [SubSens](https://github.com/chikaradude/SubSens) by Maciej "ChikaraDude" Panocha to Horizon.

- Adds a separate sensitivity setting from `-1/3` (true zero) to `1`.
- The vanilla sensitivity slider is ignored while SubSens is enabled.
- Settings live on **Options → Mods → SubSens**.
- Built for the Horizon mod API as a native `.hmod`.
"""
