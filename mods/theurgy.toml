description = """
# Theurgy (Assets)

The **assets and data** half of [Theurgy for Horizon](https://github.com/ReenkyPig-Studio/theurgy-horizon), a Rust port of [Theurgy](https://github.com/klikli-dev/theurgy) by klikli-dev. Theurgy is a mod about classical alchemy: refine raw materials, replicate matter and transmute it into something else.

## What this file is

`theurgy-26.3-1.120.1-content.hmod` holds only resources: `horizon-mod.toml`, `assets/` (textures, models, sounds, translations) and `data/` (recipes, tags, loot tables, world generation, the Hermetica guide book). It contains no code.

## What it needs

On its own this file does nothing in the game. The machines, items and logistics run in the separate **Theurgy native mod** (`theurgy-26.3-1.120.1-native.hnmod`, published as its own project), and **both are required**. Install the two together, or use the Theurgy modpack that bundles them.

Ported from Theurgy `release/v26.3-1.120.1` (Minecraft 26.3). JEI/EMI, Jade and KubeJS integrations are not included: those mods do not exist on Horizon.

## Credits and licence

Original mod: [Theurgy](https://github.com/klikli-dev/theurgy) © klikli-dev. The assets and data are the original's, under CC-BY-4.0; the manifest is MIT. Third-party notices (Modonomicon, NeoForge) are in the source repository.

This port is not affiliated with or endorsed by klikli-dev. Please do not report issues with this port upstream; use the [port's issue tracker](https://github.com/ReenkyPig-Studio/theurgy-horizon/issues)."""
