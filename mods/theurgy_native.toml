description = """
# Theurgy (Native)

The **code** half of [Theurgy for Horizon](https://github.com/ReenkyPig-Studio/theurgy-horizon), a Rust port of [Theurgy](https://github.com/klikli-dev/theurgy) by klikli-dev. Theurgy is a mod about classical alchemy: refine raw materials, replicate matter and transmute it into something else.

## What it does

It is the native Horizon implementation of Theurgy's behaviour, built into the game by the launcher:

- the alchemical apparatus (calcination, liquefaction, distillation, incubation, fermentation, digestion, reformation and the rest), their heat and mercury flux
- mercurial logistics, wires and item/fluid filters
- items such as divination rods and the mercurial wand
- the sal ammoniac fluid, ore generation and the block and item renderers
- the Hermetica guide book screen, the recipe screen and the mod's key bindings

## What it needs

On its own this file has no textures, models, recipes or block definitions. Those are in the separate content mod **Theurgy (Assets)**, id `theurgy`, and **both are required**. Install the two together, or use the Theurgy modpack that bundles them.

Pinned to Horizon `fdc87ae` (nightly-2026-11-08), Minecraft 26.3. Ported from Theurgy `release/v26.3-1.120.1`. JEI/EMI, Jade and KubeJS integrations are not included: those mods do not exist on Horizon.

## What it touches

- Files: it reads `config/theurgy.json` (or the file named by `THEURGY_CONFIG_FILE`) and reads and writes each player's guide book progress, `<uuid>.theurgy_book.json`, in the world's player data folder. Nothing else.
- Network: it opens no connections of its own. Client and server talk only through the game's own connection (the `theurgy:book` channel and the game's block and menu updates).
- It starts no processes. Its only dependency is `serde_json`, from Horizon's lock file.

## Credits and licence

Original mod: [Theurgy](https://github.com/klikli-dev/theurgy) © klikli-dev, MIT. This port's code is MIT; the upstream licence texts and third-party notices (Modonomicon, NeoForge) are in the bundle and in the source repository.

This port is not affiliated with or endorsed by klikli-dev. Please do not report issues with this port upstream; use the [port's issue tracker](https://github.com/ReenkyPig-Studio/theurgy-horizon/issues)."""
