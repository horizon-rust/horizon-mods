id = "things"
kind = "native-mod"
name = "Things"
summary = "Trinkets and gadgets from Things (subset)."
description = """
Trinkets and gadgets from Things (subset).

**Works with** [trinkets](https://playhorizon.dev/mods/trinkets) 0.4 or later (an optional dependency): the socks, gloves, necklaces and other trinkets are worn in its slots. The tools work without it.

**Differences from the original:** The Agglomeration, Displacement Tome, Broken Watch, Ender Pouch, Radiant Gem and the Things almanac are left out. Mining Gloves give Haste II instead of the Momentum effect, and the Infernal Scepter fires on use with a cooldown instead of charging. The Enchanted Wax Gland doesn't help with floating or lava, the Hades Crystal doesn't put out fire, and mobs can trigger the diamond pressure plate. Players joining over LAN can open a locked container with any Container Key. The socks' upgrade and Jumpy Socks crafting recipes are left out.

A port of [Things](https://github.com/glisco03/things) 0.3.3 by glisco, published under its licence, MIT. The original copyright and licence notices are kept in the file (LICENSE, NOTICE).

Its textures, models and data come from the original mod. No Minecraft code is included."""
authors = ["lavoide", "glisco"]
owners = ["lavoide"]
owner_ids = [38075742]
license = "MIT"
source = "https://github.com/lavoide/horizon-ports/tree/main/things"
icon = "icons/things.png"
categories = ["adventure", "equipment"]
tags = ["homestead", "port"]

