id = "tokimistoolshed"
kind = "mod"
name = "Tokimi's Toolshed (assets)"
summary = "Hammers, excavators, scythes, copper buckets and other tools."
description = """
**This mod has two parts, and you need both.** This is the content part (items, blocks, textures, models, data; no code); install [the other one](https://playhorizon.dev/mods/tokimistoolshed_native) too.

Hammers, excavators, scythes, copper buckets and other tools.

**Differences from the original:** The manual has no book screen, and the items show no tooltip lines. Chisels switch between Copy and Shuffle when used in the air instead of with Left Alt and the mouse wheel, and the abacus shows its counts on the action bar with no outline. Dispensers don't use copper buckets, and wooden tools don't work as furnace fuel. In creative mode, filling a copper bucket gives a vanilla bucket.

A port of [Tokimi's Toolshed](https://github.com/CozyCord/TokimisToolshed) 1.8 by Tokimi, CozyStudios, published under its licence, CC0-1.0. Original copyright and licence notices are kept in the file.

Its textures, models and data come from the original mod. No Minecraft code is included."""
