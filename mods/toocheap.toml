id = "toocheap"
kind = "native-mod"
name = "Too Cheap!"
summary = "Anvil repairs never become Too Expensive."
description = """
Anvil repairs never become Too Expensive.

**Differences from the original:** Only Homestead's setting is ported. The 40-level "Too Expensive!" cap is gone, and the Java mod's other cost options aren't available. Costs of 40 levels and more show in red even when the player can afford them.

A port of [Too Cheap!](https://github.com/the-sh4d0w/too-cheap) 1.4.0+mc1.20 by Sh4d0w, published under its licence, MIT. Original copyright and licence notices are kept in the file.

Native source mod: install it on the launcher's Mods page, press Build there, and confirm the native-code warning. It runs with your account's permissions. It is pinned to Horizon Nightly fdc87ae and Horizon Mixins e8cd0aa.

No Minecraft code is included."""
authors = ["lavoide", "Sh4d0w"]
