name = "Traveler's Backpack"
summary = "Backpacks with tanks, upgrades and abilities. Requires the native mod Traveler's Backpack (native)."
description = """
An independent port of [Traveler's Backpack](https://github.com/Tiviacz1337/Travelers-Backpack) by Tiviacz1337.

**Both projects are required:** install this one (`travelersbackpack`) and **Traveler's Backpack (native)** (`travelersbackpack_native`)

- 44 backpack designs and five tiers, from leather to netherite. Open one from your hand, place it as a block or wear it on your back.
- Upgrades: crafting, furnaces, pickup, magnet, void, feeding, refill, tanks, jukebox and lantern, with filters.
- Tanks for water, lava, milk and potions, a hose, and an ability for each design.
- Sleeping bags, dyeing, chest loot and mobs wearing backpacks.
- With Accessories installed, the backpack goes in its Back slot.

Source, changelog and details: https://github.com/DeportedToHell/MCRE-Mods/tree/main/travelersbackpack

LGPL-3.0, same as the original. Not affiliated with or endorsed by Tiviacz1337."""
