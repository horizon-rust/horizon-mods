summary = "The native code of Traveler's Backpack. Requires the mod Traveler's Backpack."
description = """
The native code of an independent port of [Traveler's Backpack](https://github.com/Tiviacz1337/Travelers-Backpack) by Tiviacz1337.

**Both projects are required:** install this one (`travelersbackpack_native`) and **Traveler's Backpack** (`travelersbackpack`)

Native source mod: the launcher builds it into a separate game with Horizon Mixins. It is not sandboxed and runs with your account's permissions.

Built for Horizon Nightly `9f42064` and Horizon Mixins `5a64af9`; other revisions are not tested.

Keybinds: **B** opens the worn backpack. Commands: `/tb`. Config files are the original's, in `config/`.

Source, changelog and details: https://github.com/DeportedToHell/MCRE-Mods/tree/main/travelersbackpack

LGPL-3.0, same as the original. Not affiliated with or endorsed by Tiviacz1337."""
