summary = "Wearable lanterns for the trinket lantern slot."
description = """
Wearable lanterns for the trinket lantern slot.

**Needs** [trinkets](https://playhorizon.dev/mods/trinkets) and [trinkets_native](https://playhorizon.dev/mods/trinkets_native) installed too.

**Differences from the original:** The lanterns have their own creative tab and are worn through the Trinkets port's menu on the G key. Their light comes from the Radiant Gear port and couldn't be seen in testing, because Horizon's dynamic lighting showed no light at all in the tested build.

A port of [Wearable lanterns](https://github.com/AbsentAbigail/WearableLantern) 1.0.1 by tsuki, Absent Abigail, published under its licence, MIT. Original copyright and licence notices are kept in the file.

Its textures, models and data come from the original mod. No Minecraft code is included."""
