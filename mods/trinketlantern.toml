id = "trinketlantern"
kind = "mod"
name = "Wearable lanterns"
summary = "Wearable lanterns for the trinket lantern slot."
description = """
Wearable lanterns for the trinket lantern slot.

**Needs** [trinkets](https://playhorizon.dev/mods/trinkets) 0.4.x installed too (declared as a dependency, so the game names it if it's missing). With [radiantgear](https://playhorizon.dev/mods/radiantgear) 0.4.x (an optional dependency) a worn lantern gives light. Both are native packages for Horizon's exact-build SDK dd67b76: they were tested, with this package, on dd67b76 builds and run only there; this content package itself isn't tied to a build.

**Differences from the original:** The lanterns have their own creative tab and are worn through the Trinkets port's menu on the G key. Their light comes from the radiantgear package, through Horizon Extras' dynamic lights (that option has to be on), and only your own lantern's light is drawn.

A port of [Wearable lanterns](https://github.com/AbsentAbigail/WearableLantern) 1.0.1 by tsuki, Absent Abigail, published under its licence, MIT. The original copyright and licence notices are kept in the file (LICENSE, LICENSE-CC0, NOTICE).

Its textures, models and data come from the original mod. No Minecraft code is included."""
authors = ["lavoide", "tsuki", "Absent Abigail"]
