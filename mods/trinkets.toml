name = "Trinkets"
summary = "Extra equipment slots for trinkets, in a menu on G."
description = """
Extra equipment slots for trinkets, in a menu on G.

**Differences from the original:** The trinket slots are in a separate menu opened with the G key, not beside the inventory. Worn trinkets aren't drawn on the player's body. Attribute bonuses stored on trinket items aren't applied, so a trinket only does what its own mod's port provides. A totem of undying worn in the Charm slot saves you as one in the off hand does.

A port of [Trinkets](https://github.com/emilyploszaj/trinkets) 3.7.2 by Emi, C4, published under its licence, MIT. The original copyright and licence notices are kept in the file (LICENSE, NOTICE).

Its textures, models and data come from the original mod. No Minecraft code is included."""
