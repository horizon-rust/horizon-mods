description = """
# TristanPbty's Lib

TristanPbty's Lib is a shared Rust library developed by TristanPbty for Horizon native mods.

It provides reusable components and common functionality to help organize and simplify the development of multiple native Horizon projects.

## Features

- Shared Rust components.
- Reusable functionality.
- Centralized code for multiple projects.
- Modular architecture.
- Designed for Horizon native mod development.

## How to use

Add TristanPbty's Lib to your Rust project as a dependency.

Use its exported components and functions in your native Horizon mod.

## Requirements

- Rust toolchain.
- Compatible Horizon native mod development environment.

## Credits

Created and maintained by TristanPbty.

## License

MIT License."""
