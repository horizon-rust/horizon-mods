changelog = "First release on Horizon's mod API: one native package (code and content). Pinned to Nightly 2026-11-18 (0b14f8a). Replaces 0.1.0's two files (`vastrifts_native` .hnmod and the `vastrifts` content mod, never published). Reward tables are the mod's own; a rift's cleanup only touches its own dimension; an out-of-range saved wave no longer stops the rift's tick."
