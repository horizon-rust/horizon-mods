id = "vastrifts"
kind = "mod"
name = "Vast Rifts (content)"
summary = "The sigils of Vast Rifts: their art, recipes and words. Needs the native mod."
description = """
The content half of Vast Rifts: seven rift sigils (Ember, Warp, Mire, Pasture, Night, Inferno and Golem), each a block that opens its rift when placed, with art drawn by the mod's own code, their recipes and the names of the rifts and their named mobs in English and Brazilian Portuguese. **The native mod `vastrifts_native` does the work**, and both are needed.

The art and words are this mod's own; none of Gateways to Eternity's are used."""
