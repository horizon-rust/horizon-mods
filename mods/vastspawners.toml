name = "Vast Spawners (content)"
summary = "The words of Vast Spawners in English and Brazilian Portuguese. Needs the native mod."
description = """
The content half of Vast Spawners: the names of what a spawner can be changed to (Shortest Wait, Batch Size, Unwatched, Lightproof, Wired, Dazed, Echoes, Vigour and the rest) and its messages, in English and Brazilian Portuguese. **The native mod `vastspawners_native` does the work**, and both are needed.

The words are this mod's own; Apothic Spawners' lang is all rights reserved and none of it is used."""
