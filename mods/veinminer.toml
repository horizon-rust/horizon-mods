id = "veinminer"
kind = "native-mod"
name = "Veinminer"
summary = "Mine connected ores and matching trees using Horizon's native player-mining behavior."
description = """
An unofficial Rust port by levzzz5154. Mines connected veins, including diagonal neighbours,
through Horizon's player-mining code, preserving loot, XP, tool wear and server block events.
Includes per-player toggles, configurable block/tool groups, a block limit and cooldown.

Native source mod: the launcher builds a separate game using Horizon Mixins. Requires Rust,
Git and Horizon's platform build dependencies, and runs with your account's permissions.

Tested against Horizon nightly `83f15fa276c44711276b6ceb5f0fe0c9c534dc66`
(`nightly/build-2026-10-28-3`) with Horizon Mixins 0.5.0 at
`0500ff24aa5933fca95a877ef41125353c4b4fe3`. Other Horizon revisions show unverified support;
source planning and compilation must succeed before the game starts.

Use `/veinminer toggle`, `/veinminer on`, `/veinminer off` or `/veinminer status`.
`/veinminer reload` requires operator permission. Survival mining only; install on the
world host/server. Delayed mining, drop merging and Java client addons are not supported.

Original project: [MiraculixxT's Veinminer](https://github.com/MiraculixxT/Veinminer).
Independently written Rust code; no upstream mod code or artwork is bundled. MIT licensed.
"""
authors = ["levzzz5154"]
owners = ["levzzz5154"]
license = "MIT"
source = "https://github.com/levzzz5154/horizon-veinminer"

