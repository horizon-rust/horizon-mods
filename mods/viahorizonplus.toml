name = "ViaHorizonPlus"
summary = "Multi-version client protocol selector & legacy 1.8 combat emulation for Horizon"
description = """
### 🌐 About ViaHorizonPlus

**ViaHorizonPlus** brings multi-version protocol compatibility and legacy gameplay mechanics to **Horizon 26.3** (the 100% Rust Minecraft rewrite).

It allows Horizon players to seamlessly connect to legacy and modern Minecraft servers (from 1.8.x up to 26.3) while preserving the authentic feel and mechanics of older versions.

---

### ⚔️ Key Features

- **In-Game Version Selector**: Accessible directly from the Multiplayer menu with one click.
- **Auto-Detect (Ping)**: Automatically detects the server's protocol or lets you force a specific version (from 1.8.9 to modern releases).
- **1.8 Combat Emulation**:
  - Right-click sword blocking
  - Removal of 1.9+ attack delay / cooldown
  - Classic 1.7/1.8 block-hitting visual animation
  - 1.8 eye height when sneaking (1.54m instead of modern 1.27m)
- **100% Native Rust**: Zero JVM or Fabric bytecode dependency; compiles directly into the Horizon engine.

---

### 📜 Upstream Attribution & License

ViaHorizonPlus is an independent native Rust port inspired by the concepts of **[ViaFabricPlus](https://github.com/ViaVersion/ViaFabricPlus)** by **FlorianMichael** and the **ViaVersion** team.

Distributed under the terms of the **MIT License**."""
