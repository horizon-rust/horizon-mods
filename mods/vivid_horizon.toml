changelog = "Ported to shader API 0.2 (vanilla fog now comes from the pack). Fixes the black picture on 0.2. Much thinner distance haze (no more white film), bluer sky, a more vivid grade, softer water reflections (physical Fresnel) with the gentle animated waves kept, rain and wet ground that fade across biome borders."
