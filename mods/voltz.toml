id = "voltz"
kind = "mod"
name = "Voltz (assets)"
summary = "The blocks, items, textures, text and recipes of Voltz. Needs the Voltz native mod."
description = """
**This is one of the two parts of [Voltz](https://playhorizon.dev/mods/voltz_core), and does little alone.** Install both: this one, the assets, and the native part.

It holds the blocks, items, creative tabs, textures, text and recipes of Voltz. It has no code. The code, and the description of what the mod does, are in Voltz.

All the art is original and drawn for this project. No Minecraft assets and no art from other mods are included. MIT licensed."""
