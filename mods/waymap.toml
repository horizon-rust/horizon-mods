id = "waymap"
kind = "native-mod"
name = "Waymap"
summary = "Native Horizon waypoint mod with per-context storage, minimap dots, world markers, and full command suite."
description = """
Waymap — Native client-side waypoints for Horizon.
Features:
- World markers (3D, camera-projected)
- Minimap dots (rotation-aware)
- Waypoint list panel (bottom-left, 6 nearest)
- Per-context storage (per server server_<host:port>.txt / world world_<folder>.txt)
- Atomic saves (temp + atomic rename), legacy migration
- Commands: /wp add|del|list|rename|color|clear|edit|help
- Keys: N = add, B = toggle list"""
