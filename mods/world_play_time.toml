name = "world_play_time"
summary = "A Horizon port of World Play Time."
description = """World Play Time ported to Horizon on the mod API: the config model (six entries exactly as upstream's annotated WPTConfig, JSON at config/worldplaytime/config.json), the server play time manager (per-server tick counts), the client tick handler (one tick per connected tick, autosave every 6000), the play time formatter and the world-stats reader (upstream's LevelStorageSourceMixin). Upstream: github.com/Khajiitos/WorldPlayTime, MIT (c) Khajiitos. Ported 1:1.

Port by sparticle. Upstream: https://github.com/Khajiitos/WorldPlayTime (MIT).

Source-only .hmod built on the current SDK (Horizon f00125f/e59da90)

Licence: MIT. Source: https://github.com/Sparticle62ops/horizon-world-play-time
"""
