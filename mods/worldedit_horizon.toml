description = """
✨ Features 
🪓 Wooden axe wand — left click = pos 1, right click = pos 2. Outside creative it is a normal axe. 
🎨 Creative only — every command works only in /gamemode creative. 
🧱 Fill, replace, walls, faces, hollow, overlay, naturalize, line 
⚪ Shapes — spheres, cylinders, pyramids, solid or hollow (hcyl, hsphere, hpyramid). 
🌊 Terrain tools — drain, fixwater, fixlava, smooth.
📋 Clipboard — copy, cut, paste, rotate, flip, stack, move. 
↩️ Undo / redo with configurable history. 
🎲 Patterns — stone, 0 (air), stone,dirt, 30%stone,dirt. 
🔧 In-game limits — /we limit changes block, radius and history limits live. 
🔇 No item drops — edits do not pop torches/flowers (toggle with /we physics). 

📦 Installation 
Method 1: Automatic 
Copy the URL of this GitHub repository from your browser's address bar.
Open the Horizon launcher, go to Mods -> Install from Link.
Simply paste this GitHub link directly inside the launcher, and the mod will install automatically!

Method 2:
1. Open the Horizon launcher → Mods → Add mods and pick the file. 
2. Enable Settings → Native mods (experimental) and press Build (the first build takes a while). 
3. Launch the Native mods instance, enter a world and switch to creative: /gamemode creative.



