id = "worldedit_horizon"
kind = "native-mod"
name = "WorldEdit for Horizon"
summary = "WorldEdit-style building commands for Horizon: selections, fills, shapes, clipboard, undo and redo, brushes and terrain tools."
description = """
A native mod for Horizon that adds the WorldEdit-style building commands.

**What it does**

- **Selection** — the wooden axe wand, `pos1` and `pos2`, and the shapes `cube`, `sphere`, `cylinder` and `ellipsoid`.
- **Edits** — `set`, `replace`, `overlay`, `naturalize`, `walls`, `faces`, `hollow`, `line`, `count`, `fill`, `removeabove`, `removebelow`, `drain`, `fixwater`, `fixlava`, `smooth`.
- **Shapes** — `sphere`, `hsphere`, `cyl`, `hcyl`, `pyramid`, `hpyramid`.
- **Clipboard** — `copy`, `cut`, `paste`, `rot`, `flip`, `stack`, `move`, and `schematic save|load|list|delete` for builds kept in your own folder.
- **Brushes** — sphere, cylinder and ellipsoid brushes, a smoothing brush and a distance brush.
- **Undo and redo** with a configurable history; an edit keeps the dimension it was made in.

**How to use it**

Everything starts with `/we`: `/we set stone`, `/we copy`, `/we undo`. The wand picks the two corners of the selection. The commands work in creative mode only and need operator level 2 or more; `/we limit` and `/we regen` need level 4.

**What it needs**

Horizon 26.3 and native hooks 58. The mod is a source mixin bundle: the launcher compiles it into the game, so it runs without a sandbox.

**An independent implementation**

This is not the original WorldEdit and it is not affiliated with EngineHub. The smoothing brush and the terrain regeneration follow the behaviour of WorldEdit 7.4.6."""
