changelog = """
## 1.5.2

**A patch: the client keeps its own files to what the player asked for.**

The schematics are the player's own files, and the client used to hand them to any server that asked. Now the client does only what the player asked for:

- the command the player types in the chat box allows the one operation it names: `/we schematic save house` lets the server write `house`, `/we schematic load house` lets it read that file once, `/we schematic list` lets it tell the files once, `/we schematic delete house` lets it remove that file once;
- a new level allows nothing at all: another server, another dimension or leaving the server clears every allowance and every unfinished transfer;
- a part of a file is refused before anything is allocated for it when its index, its count or its size is out of bounds — at most 4096 parts and 32 MiB per file.

The finding came from a review of the 1.5.1 sources and was reported as a real security issue, not a matter of style. Seven new tests cover the hostile headers, the size limit and the rules of the allowances. The tests are 93.

## 1.5.1

- `/we regen` now needs operator level 4, like `/we limit`: it takes the ground of whole chunks away.

## 1.5.0

- `/we regen [radius]` — the ground of the chunks around you comes back as the level's own generator made it.

## 1.4.0

- `/we brush smooth [radius] [iterations]` — the smoothing brush of WorldEdit 7.4.6.

## 1.3.0 and earlier

- Selection (box, sphere, cylinder, ellipsoid), fills, shapes, the clipboard, undo and redo, schematics and the terrain tools.
