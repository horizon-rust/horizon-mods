changelog = """
- **Minimap** in a corner of the game, with your waypoints and the night. It turns with you (the way you face is up) with the sides of the world on its edge, or keeps north up. Under a roof or in a cave it shows the floor at your height, at every block, a jump too. Other players are dots on it. Corner and size are in Options > Mods; keys N (on and off) and Z (scale).
- **Day and night on the map:** the surface of the Overworld is dark at night, and lit blocks keep their light.
- **Waypoints in the world** are a square of their colour with their first letter, name and distance under it; they follow the view smoothly.
- **Waypoint groups:** give a waypoint a group in its menu, click the group's heading in the list to hide or show them all.
- **Export and Import** of waypoints (exports/waypoints.txt, exports/import.txt); the import also reads the waypoints file of other map mods.
- **Smoother map:** it glides on when you let go of a drag, and reads the world faster while it is open.
- **Fixed:** worlds with the same name (New World, New World (1)...) and friends' worlds no longer share one map and one set of waypoints."""
