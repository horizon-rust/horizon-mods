changelog = """
- Built for Horizon Nightly fdc87ae (2026-11-08), the newest, and tried on it. The mod is the same as in 0.7.0, which was made for 2ebf00a.
- `/wp` chat commands: add, del, rename, list, clear and share; `/wp share <number> <player>` sends a waypoint as a private message, `/wp share <number> all` to the whole chat. The chat box colours and completes `/wp` and its words.
- Share a waypoint through the chat: a player with the mod sees a green [Add] and a click puts it on their map.
- Minimap in the game: it can turn with you, with compass letters, waypoints and other players; in caves it shows the floor at your head height.
- A day and night map, glowing blocks stay lit; maps of different worlds with the same name no longer mix.
- Waypoint groups, hide, import and export (also Xaero's format), a waypoint menu with hotkeys, waypoints in the world with name and distance.
- Smoother and lighter on big maps: files are read a little in each frame, no flicker when zooming, the zoomed-out map is drawn from its texels, and a slow computer gets a slightly coarser picture instead of lag.
- The mod's keys are now on its page, Options > Mods > World Map."""

[[versions]]
version = "0.6.0"
published = "2026-11-06"
game = "26.3"
file = "worldmap-0.6.0.hnmod"
sha256 = "460af1e08fd353cc7455fc32c4b4bd543572e68f6791c03910ae356725904a40"
changelog = """
- **Minimap** in a corner of the game, with your waypoints and the night. It turns with you (the way you face is up) with the sides of the world on its edge, or keeps north up. Under a roof or in a cave it shows the floor at your height, at every block, a jump too. Other players are dots on it. Corner and size are in Options > Mods; keys N (on and off) and Z (scale).
- **Day and night on the map:** the surface of the Overworld is dark at night, and lit blocks keep their light.
- **Waypoints in the world** are a square of their colour with their first letter, name and distance under it; they follow the view smoothly.
- **Waypoint groups:** give a waypoint a group in its menu, click the group's heading in the list to hide or show them all.
- **Export and Import** of waypoints (exports/waypoints.txt, exports/import.txt); the import also reads the waypoints file of other map mods.
- **Smoother map:** it glides on when you let go of a drag, and reads the world faster while it is open.
- **Fixed:** worlds with the same name (New World, New World (1)...) and friends' worlds no longer share one map and one set of waypoints."""
