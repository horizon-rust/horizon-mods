id = "worldmap"
kind = "native-mod"
name = "World Map"
summary = "A full screen, self-writing world map with a minimap, waypoints (groups, import and export), day and night, cave layers and teleport."
description = """
A full screen map that writes itself as you explore, for Horizon, with a minimap in the game.

- **Self-writing map.** The terrain you have seen stays on the map after you leave, per world, dimension and cave layer, in the vanilla map colours, by day and by night (glowing blocks stay lit).
- **Smooth.** Drag with a glide, scroll to zoom towards the pointer; no flicker when zooming, light on big maps.
- **Minimap** that can turn with you, with the compass letters, waypoints and other players, and the floor at your head height in caves.
- **Cave layers.** Under a roof, in a cave or in the Nether the map shows the floor round you; layered or full, with a Top Y slider.
- **Waypoints.** Right-click menu with hotkeys: add, rename, 16 colours, shapes, groups, hide, teleport, share, delete; markers in the world with name and distance; import and export (also Xaero's format); a waypoint where you die.
- **Share a waypoint** with a friend through the chat (a green [Add] they click), or with `/wp share <number> <player>` as a private message.
- **`/wp` commands:** add, del, rename, list, clear, share.
- **Also:** dimensions button, waypoint list with search, biome under the pointer, go to coordinates, chunk grid, PNG export, Russian interface.

Open it with **M**. Keys are in Options > Mods > World Map, all rebindable.

**What it does and doesn't do:** it reads the chunks the game has loaded around you and the game's own state, draws on its own screen and in the game's HUD, and keeps files in `config/worldmap/` (the explored chunks and a waypoints file for each world). It makes no network connection of its own and needs no other mod. It sends `/tp` in chat when you choose Teleport, and a chat line or a private message (`/msg`) only when you choose to share a waypoint.

**Support the author:** [donatello.to/luminaaa](https://donatello.to/luminaaa)

**Native mod, pinned** to Horizon Nightly `fdc87ae` (Minecraft 26.3): it reuses the minimap's colour scan, so it builds on that revision."""
