changelog = """Slice 2, the item channel's amount and destination policy: `SINGLE`/`STACK`/`COUNT` with `extractAmount`, the stock-keeping `count` on either end, and `PRIORITY`/`ROUNDROBIN` destinations — the rules upstream's `tickItemHandler` and `fetchItem` already carry, now saved per connector and surviving a relaunch. Three carried artefacts were dead and are fixed: the recipes were in the 1.21.1 `{"item": …}` form the pin rejects, so every one logged `invalid ingredient` and crafted nothing; the cable and connector loot tables dropped a block id that has no item, so breaking one gave nothing usable; and the recipes' `c:` tags were declared by no mod, so the four tags are carried with their vanilla members. Proven in game: stack mode moves 20 of 20 in one operation where single moves 1; a count of 16 moves 160 in 100 ticks; `stock 5` fills the target to 5 and `keep 5` leaves 5 at the source; round robin sends 10 east and 10 south where priority sends 0 and 20; an unknown mode is refused with the readout unchanged; and the settings survive a relaunch and keep moving items."""
