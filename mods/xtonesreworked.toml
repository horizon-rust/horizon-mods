changelog = """A directional-block fix, proven in the one place a declaration cannot reach: a flat lamp now takes its facing from where the player is looking when it is placed, instead of keeping the declared default north forever. The rule is a branch-for-branch port of the engine's own nearest-looking direction, so a click on a south face looking north yields south. The red is the published package itself: the same probe against it reads north for a north-looking click and north again for an east-looking one, which is exactly the complaint. Proven in game with four legs: two placements reading south and east where the old package read north and north, a selftest that inverts the expectation and fails, a control against the same Nightly without the package, and a negative run whose false assertion fails as required. The package also moves to the native format, so the content stays byte-identical to the previous release while one small rule is added on the server side. A trap worth knowing is recorded with it: the placement context sees the server's rotation one aim behind, so the scenario sets the heading and waits before clicking rather than trusting the click's own frame."""
