[package]
name = "horizon-mod-dark_loading_screen"
version = "1.6.20"
edition = "2021"
license = "LGPL-3.0-only"
publish = false
description = "Exact 1:1 Rust translation of Dark Loading Screen (A5b84/dark-loading-screen, LGPL-3.0-only) for the Horizon client."

[lib]
path = "mixins/dark_loading_screen/runtime.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
