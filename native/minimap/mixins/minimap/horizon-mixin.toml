[mod]
id = "minimap"
version = "2.0.0"
priority = 100

# Tested renderer layout. The map uses a stable hook; its outline/coordinate
# drawing also injects around extras_hud::draw_minimap.
[compatibility]
horizon_revision = "eaa7da4fb1e1c580ed618bc7cfd1758858c0b878"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "official_minimap"
visibility = "pub(crate)"
source = "runtime.rs"

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "settings"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings"
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "click"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings_click"
helper = "click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]

[[injection]]
id = "minimap"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_minimap"
helper = "minimap.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "minimap", ty = "&mut Option<crate::game::native_hooks::NativeMinimap>", value = "&mut *minimap" },
]

[[injection]]
id = "coordinates-before"
kind = "HEAD"
target = "horizon_client_lib::extras_hud::draw_minimap"
helper = "coordinates_before.rs"
bindings = [
  { name = "corners", ty = "&mut Corners", value = "&mut *corners" },
  { name = "look", ty = "&MinimapLook", value = "look" },
]

[[injection]]
id = "coordinates-after"
kind = "RETURN"
target = "horizon_client_lib::extras_hud::draw_minimap"
helper = "coordinates_after.rs"
bindings = [
  { name = "_result", ty = "()", value = "$value" },
  { name = "corners", ty = "&mut Corners", value = "&mut *corners" },
  { name = "look", ty = "&MinimapLook", value = "look" },
  { name = "batch", ty = "&mut HudBatch", value = "&mut *batch" },
  { name = "atlas", ty = "&HudAtlas", value = "atlas" },
]

[[module]]
id = "coordinate-state"
file = "crates/horizon-client/src/extras_hud.rs"
name = "minimap_coordinates"
visibility = "pub"
source = "coordinate_state.rs"
