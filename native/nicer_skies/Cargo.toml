[package]
name = "horizon-mod-nicer_skies"
version = "1.5.2"
edition = "2021"
license = "LGPL-3.0-only"
publish = false
description = "Exact 1:1 Rust translation of Nicer Skies (ZtereoHYPE/nicer-skies, LGPL-3.0-only) for the Horizon client."

[lib]
path = "mixins/nicer_skies/runtime.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
