[package]
name = "horizon-mod-show-me-your-skin"
version = "1.0.0"
edition = "2024"
license = "MIT"
publish = false
description = "Per-player armor visibility: exact 1:1 Rust port of Show Me Your Skin by enjarai (MIT)."

[lib]
path = "src/lib.rs"

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
