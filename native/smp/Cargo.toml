[package]
name = "horizon-mod-smp"
version = "0.36.1"
edition = "2024"
license = "MIT"
publish = false
description = "The official Horizon server's SMP, a native server mod: economy (and next, market, trades, claims)."

[lib]
path = "src/lib.rs"

[dependencies]
# The pinned SDK, fetched into .horizon/sdk/ by any `cargo horizon-mod` command.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
flate2 = "1"
log = "0.4"
