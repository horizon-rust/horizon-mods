# The commit of horizon it was tested on: it needs horizon#6106 (merged at 975c07d): native_inventory,
# native_move_stack, native_send_map, lore on the wire.
[compatibility]
horizon_revision = "975c07d9151847e6af13afc4b5ab37b6bbe78ef5"

