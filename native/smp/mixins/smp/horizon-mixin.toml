[mod]
id = "smp"
version = "0.36.0"
priority = 100

# The commit of horizon CI tests it on (the minimap's: mods on the newest hooks share one; the official server's
# engine, r9.1 52882c1, descends from it with the same hooks): it needs the projectile impact,
# hanging break, entity join and dispenser hooks (API 359), the entity handles and native_player_chat (in its source,
# stamped later on main as API 399), on top of native_hide_player (API 314) and horizon#6106's helpers.
[compatibility]
horizon_revision = "5de5b6fd91b70be34562f56b747c9e06db692fa3"

