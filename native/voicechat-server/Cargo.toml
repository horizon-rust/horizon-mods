# The mod's crate. The relay (the handshake, the groups and the UDP relay) is its own crate in relay/, with its
# tests; `cargo test` runs there.
[package]
name = "voicechat_server"
version = "1.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
voicechat_server_relay = { path = "relay" }
serde_json = "1"
log = "0.4"
