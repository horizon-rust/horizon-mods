[package]
name = "mod-zoom"
version = "3.0.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }

# The SDK build this mod is made for: `cargo horizon-mod update` moves it.
[package.metadata.horizon]
sdk = "0b14f8acfd97fa2c750e42795249dcc981178ca4"
